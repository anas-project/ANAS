modules:
  - samba_dc
  - samba_fs
  - postgres
  - llng
  - nextcloud
  - collabora
  - meshcentral
  - lam

global:
  base_domain: nas.example.com
  email: admin@example.com
  timezone: Asia/Shanghai
  # Optional shared password for administrator accounts that people log in
  # with. When omitted, each cask gets its own generated root password; list
  # them with `anas config secret list`.
  default_service_root_password: ChangeMe1!
  # The administrator name for Traefik's dashboard gate.
  basicauth_user: admin
  # Optional. Absent means the default applies; an explicit false is kept, which
  # is why these are written as booleans rather than left to the env: block.
  # ipv6: false

# The DNS vendor is chosen per engine, not deployment-wide: certificates and
# dynamic DNS often live at different vendors, and the same vendor sometimes
# needs a different credential for each (Namecheap's DNS API user is not its
# Dynamic DNS password). `anas plan` reports what each engine resolved and
# whether they can share one credential.
services:
  lego:
    env:
      dns_provider: cloudflare
  ddns_go:
    env:
      dns_provider: cloudflare

secrets:
  # Keyed by vendor: every engine configured for that vendor reads it. Prefix
  # the key with a cask name to give that engine its own account instead, e.g.
  # ddns_go_cloudflare_dns_api_token.
  cloudflare_dns_api_token: replace-me

# Keep this deployment's own A/AAAA records current, without naming the program
# that does it. "auto" picks among the implementations that can address the
# vendor, and records the choice in the lock so a later release cannot move an
# existing deployment onto a different one. Omit the section entirely to
# declare no records; a DDNS cask listed in `modules` then runs entirely on its
# own configuration.
dynamic_dns:
  provider: auto
  dns_provider: cloudflare

# The single identity provider for this deployment. Required as soon as any
# enabled cask consumes the iam capability; the runner never picks one for you,
# even when only one candidate is installed. The chosen cask is pulled into the
# dependency closure automatically, so it does not need to be in `modules`.
iam:
  provider: llng
  # Optional. Applies to casks whose iam_protocol is left on "auto" and that
  # actually support this protocol; the rest fall back to their own preference
  # order. Per-cask overrides live in services.<name>.env.iam_protocol.
  default_protocol: oidc

# Point-in-time copies of <workspace>/data, taken before an apply switches
# deployments. Each snapshot also carries the config, lock, secrets and a full
# copy of the deployment artifact, so it can restore the system on its own.
# Requires the workspace to be on Btrfs.
rollback:
  snapshot:
    # btrfs, or none to disable automatic snapshots. `anas snapshot create`
    # works regardless, as long as the workspace is on Btrfs.
    backend: btrfs
    # How many automatic snapshots survive collection. Manual and pinned
    # snapshots are neither counted nor collected, so pinning three does not
    # reduce how much automatic history is kept. Omit for the default of 5;
    # 0 means keep none, which is not the same as omitting it.
    keep_auto: 5

env:
  # The top level env: block sets raw environment keys, for values no manifest
  # declares. Parameters that are declared belong under global: or under
  # services.<cask>.env; `anas config list` prints the path for each.
  #
  # Mainland China: enables APT, APK, npm, Go, GitHub/Nextcloud downloads and
  # Docker Hub/GHCR/Quay mirrors as one coordinated setting.
  # CHINESE_SPEEDUP: "true"
  # ANAS_IMAGE_REGISTRY: docker.cnb.cool/anas.dev/anas
  #
  # These two are samba_fs parameters published under a bare name, because they
  # name what people see in a file manager.
  #
  # all_rw: all authenticated domain users can write.
  # all_read_group_write: all authenticated users can read; FS Share RW can write.
  SHARE_ACCESS_MODE: all_read_group_write
  # Set to "Yes" to allow unauthenticated read-only access to the Share directory.
  SHARE_GUEST_READ_ONLY: "No"
