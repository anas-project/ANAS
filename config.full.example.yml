# Module artifacts: official uses GHCR first; cn/official-cn uses CNB first and,
# unless explicitly disabled, also enables global.chinese_speedup.
module_source: official

modules:
  samba_dc: {}
  samba_fs: {}
  postgres: {}
  llng: {}
  nextcloud:
    # Optional exact Module release. `anas module update` records its immutable
    # OCI digest in config.lock.yml; ordinary apply never upgrades it.
    # version: 34.0.2-r2
    identity:
      # LDAP still provisions users and groups; this selects browser login.
      login_protocol: saml
  collabora: {}
  meshcentral: {}
  lam: {}
  lego:
    config:
      dns_provider: cloudflare
  ddns_go:
    config:
      dns_provider: cloudflare
global:
  base_domain: nas.example.com
  email: admin@example.com
  # Optional. Locale derives from an explicit region-bearing language first,
  # then host locale and CLDR inference. Keep it explicit for reproducibility.
  timezone: Asia/Shanghai
  # default_language: zh-Hans
  # default_locale: zh-CN
  # Optional. Absent means the default applies; an explicit false is kept, which
  # is why these are written as booleans rather than left to the env: block.
  # ipv6: false
administration:
  bootstrap:
    username: admin
  local_accounts:
    password_length: 24
secrets:
  # Keyed by vendor: every engine configured for that vendor reads it. Prefix
  # the key with a module name to give that engine its own account instead, e.g.
  # ddns_go_cloudflare_dns_api_token.
  cloudflare_dns_api_token: replace-me
# Keep this deployment's own A/AAAA records current, without naming the program
# that does it. "auto" picks among the implementations that can address the
# vendor, and records the choice in the lock so a later release cannot move an
# existing deployment onto a different one. Omit the section entirely to
# declare no records; a DDNS module listed in `modules` then runs entirely on its
# own configuration.
dynamic_dns:
  provider: auto
  dns_provider: cloudflare
# The single identity provider for this deployment. Required as soon as any
# enabled module consumes the iam capability; the runner never picks one for you,
# even when only one candidate is installed. The chosen module is pulled into the
# dependency closure automatically, so it does not need to be in `modules`.
identity:
  iam:
    provider: llng
  # Optional. Applies to modules whose iam_protocol is left on "auto" and that
  # actually support this protocol; the rest fall back to their own preference
  # order. Per-module overrides live in modules.<name>.config.iam_protocol.
    default_protocol: oidc
# Snapshot policy is normally omitted. `anas lock` records btrfs/keep_auto=5
# when <workspace>/data is a Btrfs subvolume, otherwise it records none. Set
# backend: none explicitly only to disable snapshots on a capable workspace.
# rollback:
#   snapshot:
#     backend: none
env:
  # The top level env: block sets raw environment keys, for values no manifest
  # declares. Parameters that are declared belong under global: or under
  # modules.<module>.config; `anas config list` prints the path for each.
  #
  # Mainland China: published images/runtime downloads and source builds are
  # separate so changing a build input cannot silently reuse an old image.
  # CHINESE_SPEEDUP: "true"
  # CHINESE_BUILD_SPEEDUP: "true"
  # ANAS_IMAGE_REGISTRY: docker.cnb.cool/anas.dev/anas
  #
  # These two are samba_fs parameters published under a bare name, because they
  # name what people see in a file manager.
  #
  # all_rw: all authenticated domain users can write.
  # all_read_group_write: all authenticated users can read; FS Share RW can write.
  SHARE_ACCESS_MODE: all_read_group_write
  # Set to "Yes" to allow unauthenticated read-only access to the Share directory.
  SHARE_GUEST_READ_ONLY: "No"
