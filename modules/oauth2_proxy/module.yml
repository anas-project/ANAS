api_version: anas.module/v1
kind: Module
name: oauth2_proxy
version: 7.15.3
revision: 5
app_version: 7.15.3
abi:
  supports:
    - anas.module-hook/v1
title: OAuth2 Proxy
description: Authenticated gate in front of services that have no login of their own.
category: identity
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  # The exchange Traefik speaks to an external authenticator: ask about each
  # request, forward it only on a 2xx.
  provides:
    - name: forward_auth
      interfaces:
        - http
dependencies:
  requires:
    - traefik
  # It gates access using the deployment's own accounts rather than a second
  # user database, so it is an ordinary OIDC client of whichever IAM is
  # selected. Group membership is enforced by the IAM through the existing
  # ANAS_IAM_CLIENT__*__ALLOW_GROUPS contract, so no group logic lives here.
  #
  # Which groups pass is not a parameter. Everything behind this gate is an
  # administrative interface, so the answer is the platform_admin role, and the
  # Hook resolves that to the directory's real administrator group name. Making
  # it configurable would let one edit widen every gated service at once --
  # Adminer included -- with nothing to announce it.
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - oidc
        prefer:
          - oidc
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: auth-gate
    iam_protocol: auto
    console_proxy_enabled: false
    console_proxy_port: "8443"
  types:
    domain_prefix: string
    iam_protocol:
      enum: [auto, oidc, saml]
    console_proxy_enabled: bool
    console_proxy_port:
      kind: int
      constraints:
        minimum: 1
        maximum: 65535
  # The middleware name protected modules attach to their routers, and the URL
  # of the gate itself.
  exports:
    - ANAS_FORWARD_AUTH_*
    - ANAS_PROXY_PLATFORM_ADMIN_GROUP
    - ANAS_TRAEFIK_ROUTE__ANAS_CONSOLE__*
    - ANAS_TRAEFIK_SERVERS_TRANSPORT__ANAS_CONSOLE_MTLS__*
    - ANAS_CONSOLE_PROXY_PUBLIC_URL
    - ANAS_IAM_CLIENT__OAUTH2_PROXY__*
  consumes:
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - TRAEFIK_BASE_PORT
    - ANAS_IAM_BINDING_*
    - SAMBA_DC_ADMIN_GROUP_NAME
    # The issuer-neutral certificate contract: the identity provider presents
    # an internally issued certificate on a domain that cannot obtain a public
    # one, and this module has to trust it to complete OIDC discovery.
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - TRAEFIK_FORWARDED_HEADERS_TRUSTED_IPS
    - TRAEFIK_HOSTNAME
features:
  domain: true
  generated_secrets: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
