services:
  anas_oauth2-proxy:
    build:
      context: ./oauth2_proxy
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        ANAS_IMAGE_REGISTRY: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}
        GO_BUILDER_REGISTRY: ${GO_BUILDER_REGISTRY:-${DOCKER_HUB_REGISTRY:-docker.io}}
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-oauth2-proxy:7.15.3-r5
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    restart: unless-stopped
    # The deployment's own resolver, not an upstream one: the identity provider
    # is reached by its public name, and only this resolver maps that name to
    # the address it is actually served on. An upstream resolver returns the
    # public address, which a container on the shared network cannot reach.
    dns:
      - ${LOCAL_DNS_SERVER}
    env_file:
      - .env
    volumes:
      # --provider-ca-file replaces the system store rather than adding to it,
      # so the pinned file has to cover both issuers: internal when the domain
      # cannot obtain a public certificate, public once ACME succeeds. That is
      # what the trust bundle is.
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
    command:
      # The static-upstream arrangement from the upstream Traefik integration
      # guide: an authenticated request gets a 202 straight from the proxy, and
      # an unauthenticated one gets a redirect to the sign-in page. The
      # alternative, pointing ForwardAuth at /oauth2/auth, returns a bare 401
      # that Traefik has to translate back into a redirect with an errors
      # middleware and a 401->302 status rewrite; browsers render a "Found."
      # link instead of following it when that rewrite is missed.
      - --upstream=static://202
      # Builds redirect URLs from the X-Forwarded-* headers Traefik sets rather
      # than from the address it was reached on. Required in this arrangement.
      - --reverse-proxy=true
      # The image bootstrap resolves TRAEFIK_HOSTNAME at container start and
      # appends one exact --trusted-proxy-ip address. This keeps redirects and
      # audit context correct without trusting every RFC1918 container.
      - --http-address=0.0.0.0:4180
      - --provider=oidc
      - --provider-ca-file=/certs/${ANAS_TLS_TRUST_BUNDLE_NAME}
      - --oidc-issuer-url=${OAUTH2_PROXY_OIDC_ISSUER_URL}
      - --client-id=${OAUTH2_PROXY_CLIENT_ID}
      - --client-secret=${OAUTH2_PROXY_CLIENT_SECRET}
      - --cookie-secret=${OAUTH2_PROXY_COOKIE_SECRET}
      - --redirect-url=${OAUTH2_PROXY_REDIRECT_URL}
      # One cookie for the whole deployment, so signing in once covers every
      # gated service under the base domain.
      - --cookie-domain=.${BASE_DOMAIN}
      # Without this, a redirect back to the service the user actually asked
      # for is treated as an open-redirect attempt and refused.
      - --whitelist-domain=.${BASE_DOMAIN}
      - --cookie-secure=true
      - --email-domain=*
      - --scope=openid profile email
      - --skip-provider-button=true
      - --set-xauthrequest=true
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "anas.client-ip.mode=application"
      # The gate's own router: it must be reachable by name because the OIDC
      # callback and the sign-in page are served from here.
      - "traefik.http.routers.oauth2-proxy.entrypoints=https"
      - "traefik.http.routers.oauth2-proxy.rule=Host(`${OAUTH2_PROXY_DOMAIN}`)"
      - "traefik.http.routers.oauth2-proxy.tls=true"
      - "traefik.http.services.oauth2-proxy.loadbalancer.server.port=4180"
      # The middleware every protected service attaches. The address is the
      # container rather than the public URL so Traefik does not loop back
      # through itself, which would also require it to trust the internal CA.
      - "traefik.http.middlewares.${ANAS_FORWARD_AUTH_MIDDLEWARE_NAME}.forwardauth.address=http://${CONTAINER_PREFIX}${MODULE_NAME}:4180/"
      - "traefik.http.middlewares.${ANAS_FORWARD_AUTH_MIDDLEWARE_NAME}.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.${ANAS_FORWARD_AUTH_MIDDLEWARE_NAME}.forwardauth.authResponseHeaders=X-Auth-Request-User,X-Auth-Request-Email,X-Auth-Request-Preferred-Username"

networks:
  default:
    external: true
    name: ${NETWORK_PREFIX}traefik
