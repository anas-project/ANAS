services:
  anas_samba_fs:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    build:
      context: ./${MODULE_NAME}
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        - CHINESE_BUILD_SPEEDUP
        - APT_MIRROR_URL
        - DOCKER_HUB_REGISTRY
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-samba-fs:4.23.6-r3
    restart: unless-stopped
    hostname: ${SAMBA_FS_HOSTNAME}
    cap_add:
      - CAP_NET_ADMIN
    # Joining the domain needs the AD zone, which only the domain controller's
    # DNS serves. Without this the container inherits a resolver that cannot
    # answer for the realm and the join loops on
    # "kinit: Cannot contact any KDC".
    dns:
      - ${LOCAL_DNS_SERVER}
    dns_search:
      - ${SAMBA_DC_DNS_SEARCH}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wbinfo", "-t"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    volumes:
      - "${SAMBA_FS_USERDATA_PATH}:/userdata"
      - "${DATA_PATH}/samba_fs/var:/var/lib/samba"
    # The address is stated rather than allocated. Otherwise Docker's IPAM
    # picks one from the macvlan pool: an address no DHCP server agreed to hand
    # out, and one nobody can predict without inspecting the daemon -- while it
    # is also the address this server's AD DNS record points at. Stating it is
    # what makes it excludable from the router's DHCP pool, and checkable for a
    # conflict before it is taken.
    networks:
      default:
        ipv4_address: ${HOST_LAN_IP}
    # ports:
    #   - 445:445

networks:
  default:
    name: ${VLAN_INTERFACE}
    external: true
