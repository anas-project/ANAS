services:
  anas_collabora:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-collabora:26.04.2.4.1
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    restart: unless-stopped
    user: "0:0"
    stop_grace_period: 180s
    entrypoint: ["/usr/local/bin/anas-collabora-start", "--container-start"]
    command:
      - --use-env-vars
      - --o:file_server_root_path=/usr/share/coolwsd
      - --o:logging.color=false
      - --o:stop_on_config_change=true
    volumes:
      - type: bind
        source: ./.hook.bin
        target: /usr/local/bin/anas-collabora-start
        read_only: true
        bind:
          create_host_path: false
    cap_add:
      - MKNOD
    environment:
      aliasgroup1: ${COLLABORA_ALIAS_GROUP}
      extra_params: ${COLLABORA_EXTRA_PARAMS}
      server_name: ${COLLABORA_DOMAIN_PORT}
      username: ${COLLABORA_ADMIN_USERNAME}
      password: ${COLLABORA_ADMIN_PASSWORD}
      DONT_GEN_SSL_CERT: "1"
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "anas.client-ip.mode=edge"
      - "traefik.http.routers.collabora.entrypoints=https"
      - "traefik.http.routers.collabora.rule=Host(`${COLLABORA_DOMAIN}`)"
      - "traefik.http.routers.collabora.tls=true"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    healthcheck:
      test: ["CMD", "/usr/local/bin/anas-collabora-start", "--container-probe"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
networks:
  default:
    external: true
    name: ${NETWORK_PREFIX}traefik
