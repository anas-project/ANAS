api_version: anas.module/v1
kind: Module
name: collabora
version: 26.4.2
revision: 5
app_version: 26.04.2.4.1
abi:
  supports:
    - anas.module-hook/v1
title: Collabora Online
description: Online document editing backend for Nextcloud.
category: app
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - nextcloud
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  must_resolve:
    - admin_password
  # Cross-module values this module reads. Listing them is what lets a rendered
  # .env carry only what is used, instead of everything the dependency
  # closure happens to own.
  consumes:
    - NEXTCLOUD_DOMAIN_FULL
    - TRAEFIK_BASE_PORT
  defaults:
    admin_username: admin_collabora
    domain_prefix: collabora
    log_level: warning
    auto_save: "60"
  types:
    admin_username: string
    admin_password:
      kind: string
      default_source: generated
    domain_prefix: string
    log_level: string
    auto_save: int
  exports:
    - COLLABORA_DOMAIN_FULL
    - COLLABORA_HOSTNAME
  changes:
    admin_username:
      effect: container_recreate
      apply: recreate-collabora
      description: The native admin-console username is injected when the container starts.
    admin_password:
      effect: container_recreate
      apply: recreate-collabora
      sensitive: true
      description: If omitted, the Module persists an independent random password in the Secret Store.
    domain_prefix:
      effect: container_recreate
      apply: recreate-collabora
      description: The proxy route and Collabora hostname change.
    log_level:
      effect: container_recreate
      apply: recreate-collabora
      description: The value is injected into the container environment.
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
