api_version: anas.module/v1
kind: Module
name: immich
version: 3.2.4
revision: 1
app_version: 3.2.4
abi:
  supports: [anas.module-hook/v1]
title: Immich
description: Photo and video upload, mobile backup, albums, and search with OIDC-only accounts.
category: app
status: developing
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires: [traefik]
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of: [oidc]
        prefer: [oidc]
  contracts:
    - name: relational_database
      version: ">=1.0.0 <2.0.0"
      selected_by: db_type
      interfaces: [postgres]
      default: postgres
resources:
  requires:
    - id: primary_database
      contract: relational_database
      binding: db_type
      spec_from:
        name: db_name
      spec:
        principal: immich
        credential:
          policy: generated
        deletion_policy: retain
        postgres:
          extensions: [vector, earthdistance]
upgrade:
  data_breaking: []
config:
  defaults:
    domain_prefix: photos
    db_name: immich
    db_type: auto
    iam_protocol: auto
    machine_learning: true
    job_concurrency: 2
    video_concurrency: 1
  types:
    domain_prefix:
      kind: string
      constraints:
        min_length: 1
        max_length: 63
        pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'
    db_name: string
    db_type:
      enum: [auto, postgres]
    iam_protocol:
      enum: [auto, oidc]
    machine_learning: bool
    job_concurrency:
      kind: int
      constraints: {minimum: 1, maximum: 16}
    video_concurrency:
      kind: int
      constraints: {minimum: 1, maximum: 8}
  exports:
    - ANAS_IAM_CLIENT__IMMICH__*
    - APPS_LIST*
  consumes:
    - ANAS_IAM_BINDING__IMMICH__*
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - SAMBA_DC_ADMIN_GROUP_NAME
    - SAMBA_DC_APP_FILTER
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - TRAEFIK_BASE_PORT
  changes:
    domain_prefix:
      effect: container_recreate
      apply: recreate-immich
      description: Reconcile the public URL and OIDC redirect/logout registrations together.
    iam_protocol:
      effect: container_recreate
      apply: recreate-immich
      description: Only OIDC is supported; the client registration and app config remain coupled.
    machine_learning:
      effect: container_recreate
      apply: recreate-immich
      description: Enable or disable the dedicated ML service and the matching application setting.
    job_concurrency:
      effect: container_recreate
      apply: recreate-immich
      description: Set non-video background queue concurrency in the managed configuration.
    video_concurrency:
      effect: container_recreate
      apply: recreate-immich
      description: Set video transcoding concurrency in the managed configuration.
    db_name:
      effect: data_migrate
      apply: migrate-immich-database
      description: Existing database and media must retain a matching recovery point.
    db_type:
      effect: data_migrate
      apply: migrate-immich-database
      description: Only the shared PostgreSQL resource is supported.
identity:
  authentication:
    capability: iam
    selected_by: iam_protocol
    interfaces:
      any_of: [oidc]
      prefer: [oidc]
  application_group: true
features:
  generated_secrets: true
  domain: true
management:
  surfaces:
    - id: web
      uri_from: IMMICH_DOMAIN_FULL
      authentication:
        primary: iam
logic:
  hook:
    command: [go, run, ./hook]
    phases: [validate, calculate, render_env, services]
