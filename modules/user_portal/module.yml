api_version: anas.module/v1
kind: Module
name: user_portal
version: 0.1.0
revision: 1
app_version: 0.1.0
abi:
  supports: [anas.module-hook/v1]
title: ANAS User Portal
description: Authorized applications, personal accounts and delegated directory administration.
category: identity
status: developing
applications:
  - name: user-portal
    display_name: {en: "ANAS Portal", zh-CN: "ANAS 门户"}
    summary: {en: "Applications and your account", zh-CN: "应用与个人账户"}
    description: {en: "Your applications, personal information and account security.", zh-CN: "管理应用入口、个人资料与账户安全。"}
    documentation_url:
      en: https://github.com/anas-project/ANAS/tree/master/modules/user_portal
      zh-CN: https://github.com/anas-project/ANAS/tree/master/modules/user_portal
    url_from: USER_PORTAL_URL
    kind: user
    categories: [identity]
    hidden: true
    access: {mode: iam, client: user_portal}
    visibility: {mode: authenticated}
    icons: {source: assets/icon.png}
application_catalog:
  consumes: true
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires: [traefik, samba_dc, casdoor]
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of: [oidc]
        prefer: [oidc]
identity:
  group_catalog: true
  interfaces: [ldaps]
upgrade:
  data_breaking: []
features:
  domain: true
config:
  defaults:
    domain_prefix: portal
    iam_protocol: oidc
    delegation_rules: "[]"
    protected_users: "[]"
    protected_groups: "[]"
    password_bind_dn: ""
    password_bind_password: ""
    group_bind_dn: ""
    group_bind_password: ""
    profile_bind_dn: ""
    profile_bind_password: ""
    create_bind_dn: ""
    create_bind_password: ""
    administration_enabled: true
    domain_administration_enabled: false
    recent_window_seconds: 300
    audit_capacity_mb: 64
    service_api_url: ""
    service_api_workspace: ""
    service_api_credentials_dir: ""
  types:
    domain_prefix: string
    iam_protocol:
      enum: [oidc]
    delegation_rules: string
    protected_users: string
    protected_groups: string
    password_bind_dn: string
    password_bind_password: string
    group_bind_dn: string
    group_bind_password: string
    profile_bind_dn: string
    profile_bind_password: string
    create_bind_dn: string
    create_bind_password: string
    administration_enabled: bool
    domain_administration_enabled: bool
    recent_window_seconds:
      kind: int
      constraints: {minimum: 5, maximum: 300}
    audit_capacity_mb:
      kind: int
      constraints: {minimum: 1, maximum: 1024}
    service_api_url: string
    service_api_workspace: string
    service_api_credentials_dir: string
    language:
      kind: string
      default_source: inherited
  must_resolve: [language]
  changes:
    password_bind_password:
      effect: container_recreate
      sensitive: true
    group_bind_password:
      effect: container_recreate
      sensitive: true
    profile_bind_password:
      effect: container_recreate
      sensitive: true
    create_bind_password:
      effect: container_recreate
      sensitive: true
  exports:
    - ANAS_IAM_CLIENT__USER_PORTAL__*
  consumes:
    - ANAS_IAM_BINDING__USER_PORTAL__*
    - ANAS_APP_CATALOG_DIR
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - SAMBA_DC_LDAPS_SERVER_URL_PORT
    - SAMBA_DC_LDAP_BIND_DN
    - SAMBA_DC_LDAP_BIND_PASSWORD
    - SAMBA_DC_BASE_DN
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_BASE_GROUPS_DN
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - SAMBA_DC_ADMIN_GROUP_NAME
    - SAMBA_DC_ADMIN_GROUP_DN
    - SAMBA_DC_BASE_SERVICE_ACCOUNTS_DN
    - SAMBA_DC_MAIL_DOMAIN
    - SAMBA_DC_USER_PRINCIPAL_NAME_BASE_DOMAIN
    - SAMBA_DC_FS_ADMIN_GROUP_NAME
    - TRAEFIK_BASE_PORT
    - TRAEFIK_HOSTNAME
    - TRAEFIK_FORWARDED_HEADERS_TRUSTED_IPS
logic:
  hook:
    command: [go, run, ./hook]
    phases: [calculate, render_env, validate]
