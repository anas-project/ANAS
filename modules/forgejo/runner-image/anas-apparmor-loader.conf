[Unit]
# Apply only on kernels with the namespace mediation this image supports.
ConditionPathExists=/proc/sys/kernel/apparmor_restrict_unprivileged_userns

[Service]
# Keep AppArmor enabled. The parser package also supplies permissive userns
# fallback profiles; loading its whole distribution profile set would grant
# ordinary guest programs a permission absent from the outer-host baseline.
# Boot and reload must instead use the same fixed, executable-scoped policy
# as the engine prerequisite. The packaged no-unload stop behavior is retained.
ExecStart=
ExecStart=/usr/sbin/apparmor_parser --replace --skip-cache /usr/share/anas/forgejo-runner/podman.apparmor
ExecReload=
ExecReload=/usr/sbin/apparmor_parser --replace --skip-cache /usr/share/anas/forgejo-runner/podman.apparmor
