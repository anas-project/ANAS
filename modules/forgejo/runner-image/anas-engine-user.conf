[Unit]
Requires=systemd-tmpfiles-setup.service
After=systemd-tmpfiles-setup.service

[Service]
# Apply mount isolation while the system manager still has privilege, then
# inherit it in the engine's user units. Do not enable extra user namespaces
# merely to implement user-unit sandboxing around newuidmap/newgidmap.
PrivateTmp=true
ProtectHome=false
ProtectSystem=strict
ReadWritePaths=/home/runner-engine /run/anas-podman /run/user/1002
NoNewPrivileges=false
RestrictSUIDSGID=false
