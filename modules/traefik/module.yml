api_version: anas.module/v1
kind: Module
name: traefik
version: 3.7.10
revision: 3
app_version: 3.7.10
abi:
  supports:
    - anas.module-hook/v1
title: Traefik reverse proxy
description: HTTPS reverse proxy and dashboard for all web-facing services.
category: network
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - lego
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    base_port: "9000"
    domain_prefix: traefik
  types:
    base_port: int
  # Route declarations from modules the Docker provider cannot discover: host
  # networking, non-Docker processes, or anything Traefik must reach by
  # address. Published by the declaring module, rendered by this module's
  # entrypoint into the file provider directory.
  consumes:
    - LEGO_CERTS_PATH
    - LEGO_CERT_NAME
    - LEGO_DNS_PROVIDER
    - LEGO_EMAIL
    - LEGO_KEY_NAME
    - ANAS_TRAEFIK_ROUTE__*
  changes:
    base_port:
      effect: container_recreate
      apply: recreate-traefik-and-routes
      description: Published ports and derived application URLs change.
    domain_prefix:
      effect: container_recreate
      apply: recreate-traefik
      description: The router rule is a Compose label.
features:
  domain: true
management:
  surfaces:
    - id: dashboard
      uri_from: TRAEFIK_DASHBOARD_URL
      authentication:
        primary: local
  local_accounts:
    - id: primary
      purpose: primary
      credential:
        policy: generated_per_module
        container_format: bcrypt
      lifecycle:
        apply: apply-traefik-local-admin
        rotate: rotate-traefik-local-admin
logic:
  hook:
    command:
      - go
      - run
      - ./hook
