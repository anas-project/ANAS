services:
  anas_mail:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mail:0.1.0-r1
    build:
      context: .
      dockerfile: service/Dockerfile
      additional_contexts:
        shared: ${ANAS_SHARED_BUILD_CONTEXT:-../..}
      args:
        DOCKER_HUB_REGISTRY: ${DOCKER_HUB_REGISTRY:-docker.io}
        GO_MODULE_PROXY: ${GO_MODULE_PROXY:-${GOPROXY_URL:-https://proxy.golang.org,direct}}
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    dns: ["${LOCAL_DNS_SERVER}"]
    environment:
      TZ: ${TZ}
      MAIL_IDENTITY_CONFIG: /run/anas/mail-identity/config.json
      MAIL_DB_HOST: ${MAIL_DB_HOST}
      MAIL_DB_PORT: ${MAIL_DB_PORT}
      MAIL_DB_NAME: ${MAIL_DB_NAME}
      MAIL_DB_USERNAME: ${MAIL_DB_USERNAME}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD}
      MAIL_SERVICE_API_URL: ${MAIL_SERVICE_API_URL:-}
      MAIL_SERVICE_API_WORKSPACE: ${MAIL_SERVICE_API_WORKSPACE:-}
      MAIL_SERVICE_API_TOKEN_FILE: /run/anas/service-client/token
      MAIL_SERVICE_API_SOCKET_FILE: ${MAIL_SERVICE_API_SOCKET_FILE:-}
    volumes:
      - "${DATA_PATH}/mail/ingress:/var/lib/anas-mail-ingress"
      - type: bind
        source: ${MAIL_SERVICE_API_CREDENTIALS_DIR:-${DATA_PATH}/mail/service-client}
        target: /run/anas/service-client
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${MAIL_SERVICE_API_SOCKET_DIR:-${MAIL_SERVICE_API_CREDENTIALS_DIR:-${DATA_PATH}/mail/service-client}}
        target: /run/anas/mail-install
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${ANAS_MODULE_RUNTIME_STATE_PATH}/identity
        target: /run/anas/mail-identity
        read_only: true
        bind: {create_host_path: false}
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
      - "${ANAS_DIRECTORY_EVENTS_DIR}:/run/anas/directory-events:ro"
    healthcheck:
      test: [CMD, /anas-mail, healthcheck]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      proxy:
      database:
      mail:
        aliases: ["${MAIL_DOMAIN}"]
    labels:
      - "traefik.enable=true"
      - "anas.client-ip.mode=edge"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.docker.network=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.mail.entrypoints=https"
      - "traefik.http.routers.mail.rule=Host(`${MAIL_DOMAIN}`)"
      - "traefik.http.routers.mail.tls=true"
      - "traefik.http.services.mail.loadbalancer.server.port=8080"

  anas_mail_dms:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mail-dms:0.1.0-r1
    build:
      context: .
      dockerfile: dms/Dockerfile
      additional_contexts:
        shared: ${ANAS_SHARED_BUILD_CONTEXT:-../..}
      args:
        DOCKER_HUB_REGISTRY: ${DOCKER_HUB_REGISTRY:-docker.io}
        GO_MODULE_PROXY: ${GO_MODULE_PROXY:-${GOPROXY_URL:-https://proxy.golang.org,direct}}
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}_dms
    hostname: ${MAIL_DMS_HOST}
    restart: unless-stopped
    dns: ["${LOCAL_DNS_SERVER}"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL, SYS_CHROOT, AUDIT_WRITE]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ}
      MAIL_DMS_CONFIG: /run/anas/mail-dms/config.json
      ENABLE_CLAMAV: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_FAIL2BAN: "0"
      ENABLE_RSPAMD: "1"
      ENABLE_RSPAMD_REDIS: "0"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_QUOTAS: "1"
      ENABLE_UPDATE_CHECK: "0"
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: "0"
      SSL_TYPE: manual
      SSL_CERT_PATH: /certs/${LEGO_CERT_NAME}
      SSL_KEY_PATH: /certs/${LEGO_KEY_NAME}
      ENABLE_OAUTH2: "1"
      OAUTH2_INTROSPECTION_URL: https://${MAIL_DOMAIN}:8443/internal/protocol/introspect
    volumes:
      - type: bind
        source: ${ANAS_MODULE_RUNTIME_STATE_PATH}/dms
        target: /run/anas/mail-dms
        read_only: true
        bind: {create_host_path: false}
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
      - "${DATA_PATH}/mail/maildata:/var/mail"
      - "${DATA_PATH}/mail/mailstate:/var/mail-state"
      - "${DATA_PATH}/mail/maillogs:/var/log/mail"
      - "${DATA_PATH}/mail/dms-config:/tmp/docker-mailserver"
    networks:
      mail:
        aliases: ["${MAIL_DMS_HOST}"]

  anas_mail_webmail:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mail-webmail:0.1.0-r1
    build:
      context: .
      dockerfile: roundcube/Dockerfile
      args:
        DOCKER_HUB_REGISTRY: ${DOCKER_HUB_REGISTRY:-docker.io}
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}_webmail
    restart: unless-stopped
    dns: ["${LOCAL_DNS_SERVER}"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, NET_BIND_SERVICE, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: ${TZ}
      ROUNDCUBEMAIL_DB_TYPE: pgsql
      ROUNDCUBEMAIL_DB_HOST: ${MAIL_WEBMAIL_DB_HOST}
      ROUNDCUBEMAIL_DB_PORT: ${MAIL_WEBMAIL_DB_PORT}
      ROUNDCUBEMAIL_DB_USER: ${MAIL_WEBMAIL_DB_USERNAME}
      ROUNDCUBEMAIL_DB_NAME: ${MAIL_WEBMAIL_DB_NAME}
    volumes:
      - type: bind
        source: ${ANAS_MODULE_RUNTIME_STATE_PATH}/webmail
        target: /run/anas/mail-webmail-input
        read_only: true
        bind: {create_host_path: false}
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
      - "${DATA_PATH}/mail/webmail-temp:/tmp/roundcube-temp"
    tmpfs:
      - /run/anas/mail-webmail:rw,noexec,nosuid,size=1m,mode=0755
    healthcheck:
      test: [CMD, php, /usr/local/lib/anas-mail-webmail-health.php]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks: [proxy, mail, webmail_database]
    labels:
      - "traefik.enable=true"
      - "anas.client-ip.mode=edge"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.docker.network=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.mail_webmail.entrypoints=https"
      - "traefik.http.routers.mail_webmail.rule=Host(`${MAIL_WEBMAIL_DOMAIN}`)"
      - "traefik.http.routers.mail_webmail.tls=true"
      - "traefik.http.services.mail_webmail.loadbalancer.server.port=80"

networks:
  proxy:
    external: true
    name: ${NETWORK_PREFIX}traefik
  database:
    external: true
    name: ${MAIL_NETWORK_DB}
  webmail_database:
    external: true
    name: ${MAIL_WEBMAIL_NETWORK_DB}
  mail:
    name: ${NETWORK_PREFIX}mail
