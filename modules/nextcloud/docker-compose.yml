services:
  anas_nextcloud:
    build:
      context: ./nextcloud
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        - CHINESE_SPEEDUP
        - APT_MIRROR_URL
        - NEXTCLOUD_APT_MIRROR_URL
        - DOCKER_HUB_REGISTRY
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-nextcloud:34.0.2-r1
    container_name: ${CONTAINER_PREFIX}nextcloud
    volumes:
      - "${NEXTCLOUD_BASE_PATH}/nextcloud:/var/www/html"
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
    dns:
      - ${LOCAL_DNS_SERVER}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.nextcloud.entrypoints=https"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_DOMAIN}`)"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-dav,nextcloud-webfinger,nextcloud-regex,nextcloud-header"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.service=nextcloud"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
      - "traefik.http.middlewares.nextcloud-dav.replacepathregex.regex=^/.well-known/(card|cal)dav"
      - "traefik.http.middlewares.nextcloud-dav.replacepathregex.replacement=/remote.php/dav/"
      - "traefik.http.middlewares.nextcloud-webfinger.replacepathregex.regex=^(/.well-known.*)"
      - "traefik.http.middlewares.nextcloud-webfinger.replacepathregex.replacement=/index.php$${1}"
      - "traefik.http.middlewares.nextcloud-regex.redirectregex.permanent=true"
      - "traefik.http.middlewares.nextcloud-header.headers.referrerPolicy=no-referrer"
      - "traefik.http.middlewares.nextcloud-header.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.nextcloud-header.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.nextcloud-header.headers.stsPreload=true"
      - "traefik.http.middlewares.nextcloud-header.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-header.headers.browserXssFilter=true"
      - "traefik.http.middlewares.nextcloud-header.headers.customFrameOptionsValue=SAMEORIGIN"
      - "traefik.http.middlewares.nextcloud-header.headers.customRequestHeaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.nextcloud-header.headers.customResponseHeaders.X-Robots-Tag=noindex,nofollow"
      - "traefik.docker.network=${NETWORK_PREFIX}traefik"
    env_file:
      - .env
    depends_on:
      anas_nextcloud-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/nextcloud-tasks.ready && curl -fsS http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 900s
    networks:
      - nextcloud
      - db
      - traefik

  anas_nextcloud-cron:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-nextcloud:34.0.2-r1
    container_name: ${CONTAINER_PREFIX}nextcloud_cron
    entrypoint: ["/cron.sh"]
    volumes:
      - "${NEXTCLOUD_BASE_PATH}/nextcloud:/var/www/html"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    depends_on:
      anas_nextcloud:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextcloud
      - db

  anas_nextcloud-push:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-nextcloud-notify-push:2026.07.30-7c156254927e
    container_name: ${CONTAINER_PREFIX}nextcloud_push
    user: "33:33"
    init: true
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        until nc -z "$$NEXTCLOUD_HOST" 80; do
          echo "Waiting for Nextcloud to start..."
          sleep 5
        done
        cpu_arch="$$(uname -m)"
        if [ "$$cpu_arch" != "x86_64" ]; then
          cpu_arch="aarch64"
        fi
        custom_push_path="/var/www/html/custom_apps/notify_push/bin/$$cpu_arch/notify_push"
        bundled_push_path="/var/www/html/apps/notify_push/bin/$$cpu_arch/notify_push"
        while [ ! -x "$$custom_push_path" ] && [ ! -x "$$bundled_push_path" ]; do
          echo "Waiting for the notify_push application to be installed..."
          sleep 5
        done
        push_path="$$custom_push_path"
        [ -x "$$push_path" ] || push_path="$$bundled_push_path"
        export RUST_LOG="$$AIO_LOG_LEVEL"
        echo "notify-push was started"
        exec "$$push_path" \
          --port 7867 \
          --nextcloud-url "http://$$NEXTCLOUD_HOST" \
          /var/www/html/config/config.php
    volumes:
      - "${NEXTCLOUD_BASE_PATH}/nextcloud:/var/www/html:ro"
    environment:
      NEXTCLOUD_HOST: ${NEXTCLOUD_HOSTNAME}
      AIO_LOG_LEVEL: info
      TZ: ${TZ}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.nextcloud-push.entrypoints=https"
      - "traefik.http.routers.nextcloud-push.rule=Host(`${NEXTCLOUD_DOMAIN}`) && PathPrefix(`/push`)"
      - "traefik.http.routers.nextcloud-push.tls=true"
      - "traefik.http.routers.nextcloud-push.service=nextcloud-push"
      - "traefik.http.routers.nextcloud-push.middlewares=nextcloud-push-stripprefix"
      - "traefik.http.middlewares.nextcloud-push-stripprefix.stripprefix.prefixes=/push"
      - "traefik.http.services.nextcloud-push.loadbalancer.server.port=7867"
      - "traefik.docker.network=${NETWORK_PREFIX}traefik"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - NET_RAW
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7867"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - nextcloud
      - db
      - traefik

  anas_imaginary:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-nextcloud-imaginary:2026.07.30-d5e7ffac6e1a
    container_name: ${CONTAINER_PREFIX}nextcloud_imaginary
    user: "65534:65534"
    init: true
    environment:
      IMAGINARY_SECRET: ${NEXTCLOUD_IMAGINARY_SECRET}
      AIO_LOG_LEVEL: info
      TZ: ${TZ}
    read_only: true
    tmpfs:
      - /tmp
    cap_add:
      - SYS_NICE
    cap_drop:
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - nextcloud

  anas_nextcloud-redis:
    container_name: ${CONTAINER_PREFIX}nextcloud_redis
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-redis:8.10.0-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - "${NEXTCLOUD_BASE_PATH}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - nextcloud

  anas_talk:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-nextcloud-talk:2026.07.30-2b9a7d12d3e6
    container_name: ${CONTAINER_PREFIX}nextcloud_talk
    user: "1000:1000"
    init: true
    environment:
      NC_DOMAIN: ${NEXTCLOUD_DOMAIN_PORT}
      TURN_DOMAIN: ${TURN_DOMAIN}
      TALK_HOST: ${CONTAINER_PREFIX}nextcloud_talk
      TURN_SECRET: ${TURN_SECRET}
      SIGNALING_SECRET: ${TALK_SIGNALING_SECRET}
      INTERNAL_SECRET: ${NEXTCLOUD_TALK_INTERNAL_SECRET}
      TALK_PORT: ${TURN_PORT}
      AIO_LOG_LEVEL: info
      TZ: ${TZ}
    dns:
      - ${LOCAL_DNS_SERVER}
    volumes:
      - "${ANAS_TLS_CERTS_DIR}/${ANAS_TLS_INTERNAL_CA_NAME}:/usr/local/share/ca-certificates/anas-internal-ca.crt:ro"
    read_only: true
    tmpfs:
      - /var/log/supervisord
      - /var/run/supervisord
      - /opt/eturnal/run
      - /conf
      - /tmp
    cap_drop:
      - NET_RAW
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.nextcloud-talk-signaling.entrypoints=https"
      - "traefik.http.routers.nextcloud-talk-signaling.tls=true"
      - "traefik.http.routers.nextcloud-talk-signaling.rule=Host(`${NEXTCLOUD_DOMAIN}`) && PathPrefix(`/talk`)"
      - "traefik.http.routers.nextcloud-talk-signaling.service=nextcloud-talk-signaling"
      - "traefik.http.routers.nextcloud-talk-signaling.middlewares=nextcloud-talk-signaling-stripprefix"
      - "traefik.http.services.nextcloud-talk-signaling.loadbalancer.server.port=8081"
      - "traefik.http.middlewares.nextcloud-talk-signaling-stripprefix.stripprefix.prefixes=/talk"
      - "traefik.docker.network=${NETWORK_PREFIX}traefik"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - nextcloud
      - traefik

networks:
  nextcloud:
    driver: bridge
    name: ${NETWORK_PREFIX}nextcloud
  db:
    name: ${NEXTCLOUD_NETWORK_DB}
    external: true
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
