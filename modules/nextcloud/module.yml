api_version: anas.module/v1
kind: Module
name: nextcloud
version: 34.0.2
revision: 7
app_version: 34.0.2
abi:
  supports:
    - anas.module-hook/v1
title: Nextcloud
description: File sync, sharing, office integration, memories, and Talk.
category: app
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - eturnal
    - samba_dc
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - oidc
          - saml
        prefer:
          - oidc
          - saml
  contracts:
    - name: relational_database
      version: ">=1.0.0 <2.0.0"
      selected_by: db_type
      interfaces:
        - postgres
        - mariadb
      default: postgres
resources:
  requires:
    - id: primary_database
      contract: relational_database
      binding: db_type
      spec_from:
        name: db_name
      spec:
        principal: nextcloud
        credential:
          policy: generated
        deletion_policy: retain
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  must_resolve:
    - language
    - locale
  defaults:
    domain_prefix: nc
    db_name: nextcloud
    phone_region: CN
    rm_skeleton_files: "false"
    log_level: "2"
    memory_limit: 1G
    upload_max_size: 16G
    talk_enabled: "true"
    memories_enabled: "true"
    db_type: auto
    iam_protocol: auto
  types:
    domain_prefix: string
    db_name: string
    phone_region: string
    rm_skeleton_files: bool
    # Nextcloud accepts named log levels as well as the numeric default.
    log_level: string
    # PHP-style sizes carry a unit suffix and are not plain integers.
    memory_limit: string
    upload_max_size: string
    talk_enabled: bool
    memories_enabled: bool
    db_type:
      enum: [auto, postgres, mariadb]
    iam_protocol:
      enum: [auto, oidc, saml]
    language:
      kind: string
      default_source: inherited
    locale:
      kind: string
      default_source: inherited
  # Generic OIDC/SAML registration, app-launcher metadata, and Talk service
  # settings published for the selected IAM and the bundled Talk containers.
  exports:
    - ANAS_IAM_CLIENT__NEXTCLOUD__*
    - APPS_LIST*
    - TALK_*
  # This module's own IAM binding plus the resolved database backend's real
  # connection password. No IAM-implementation variable is read.
  consumes:
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - SAMBA_DC_ADMIN_GROUP_DN
    - SAMBA_DC_ADMIN_GROUP_NAME
    - SAMBA_DC_ADMIN_NAME
    - SAMBA_DC_APP_ALL_DN
    - SAMBA_DC_APP_FILTER
    - SAMBA_DC_BASE_APP_DN
    - SAMBA_DC_BASE_DN
    - SAMBA_DC_BASE_GROUPS_ROLE_DN
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_GROUP_CLASS_FILTER
    - SAMBA_DC_GROUP_CLASS_NAME
    - SAMBA_DC_GROUP_DISPLAY_NAME
    - SAMBA_DC_GROUP_MEMBER_ATTR
    - SAMBA_DC_HOST
    - SAMBA_DC_HOST_IP
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - SAMBA_DC_LDAPS_PORT
    - SAMBA_DC_LDAPS_SERVER_URL
    - SAMBA_DC_PASSWORD_BIND_DN
    - SAMBA_DC_USER_CLASS_FILTER
    - SAMBA_DC_USER_CLASS_NAME
    - SAMBA_DC_USER_COMPLEX_PASS
    - SAMBA_DC_USER_DISPLAY_NAME
    - SAMBA_DC_USER_EMAIL
    - SAMBA_DC_USER_ENABLED_FILTER
    - SAMBA_DC_USER_LOGIN_ATTRS
    - SAMBA_DC_USER_NAME
    - TRAEFIK_BASE_PORT
    - TRAEFIK_HOSTNAME
    - TURN_DOMAIN
    - TURN_DOMAIN_PORT
    - TURN_PORT
    - ANAS_IAM_BINDING__NEXTCLOUD__*
    - ANAS_IAM_PORTAL_URL
    - COLLABORA_DOMAIN_FULL
    - COLLABORA_HOSTNAME
    - TURN_SECRET
    # Directory credential owned by samba_dc and configured through occ. The
    # recovery administrator is module-local and never reuses Samba's password.
    - SAMBA_DC_PASSWORD_BIND_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: Changing the environment does not migrate an installed Nextcloud database.
    db_name:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: The database name is materialized during installation.
    domain_prefix:
      effect: reconcile
      apply: reconcile-nextcloud-domain
      description: Trusted domains, SSO metadata, and proxy routes must be updated together.
    iam_protocol:
      effect: container_recreate
      apply: recreate-nextcloud
      description: Switching OIDC and SAML changes both the IAM registration and the enabled Nextcloud authentication app.
    language:
      effect: reconcile
      apply: reconcile-nextcloud-localization
      description: Sets the fallback UI language without overriding browser or per-user preferences.
    locale:
      effect: reconcile
      apply: reconcile-nextcloud-localization
      description: Sets the fallback regional formatting locale separately from the UI language.
    upload_max_size:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    memory_limit:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    talk_enabled:
      effect: container_recreate
      apply: recreate-nextcloud-project
      description: The optional Compose service set changes.
    memories_enabled:
      effect: reconcile
      apply: reconcile-nextcloud-apps
      description: The app can be enabled or disabled through occ without restarting the container.
identity:
  provisioning:
    capability: directory
    interfaces:
      any_of:
        - ldaps
    objects:
      - users
      - groups
    identity_key: anasIdentityAnchor
    required: true
  authentication:
    capability: iam
    selected_by: iam_protocol
    interfaces:
      any_of:
        - oidc
        - saml
      prefer:
        - oidc
        - saml
  application_group: true
management:
  surfaces:
    - id: web
      uri_from: NEXTCLOUD_DOMAIN_FULL
      authentication:
        primary: iam
    - id: local_recovery
      uri_from: NEXTCLOUD_BREAK_GLASS_URL
      authentication:
        primary: local
  local_accounts:
    - id: break_glass
      purpose: break_glass
      credential:
        policy: generated_per_module
        container_format: plaintext_on_bootstrap
      lifecycle:
        apply: apply-nextcloud-break-glass
        rotate: rotate-nextcloud-break-glass
features:
  generated_secrets: true
  domain: true
services:
  optional:
    - name: talk
      enabled_by: talk_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
