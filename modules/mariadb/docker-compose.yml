services:
  anas_mariadb:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-mariadb:12.3.2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - "${DATA_PATH}/mariadb:/var/lib/mysql"
      - "./mariadb/root/etc/my.cnf.d/server.cnf:/etc/mysql/conf.d/anas.cnf:ro"
    healthcheck:
      test: ["CMD-SHELL", "unset MYSQL_HOST MARIADB_HOST; exec healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mariadb

  anas_mariadb_provision:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-mariadb:12.3.2
    restart: "no"
    env_file:
      - .env
    environment:
      MARIADB_HOST: ${MARIADB_HOST}
      MARIADB_PORT: ${MARIADB_PORT}
      MARIADB_USERNAME: ${MARIADB_USERNAME}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      ANAS_RESOURCE_DATABASE: ${ANAS_RESOURCE_DATABASE:-}
      ANAS_RESOURCE_USERNAME: ${ANAS_RESOURCE_USERNAME:-}
      ANAS_RESOURCE_PASSWORD: ${ANAS_RESOURCE_PASSWORD:-}
    entrypoint: ["/bin/sh", "/operations/provision.sh"]
    volumes:
      - "./providers/relational_database:/operations:ro"
    networks:
      - mariadb

  anas_mariadb_adminer:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-mirror-adminer:5.5.0
    container_name: ${CONTAINER_PREFIX}mariadb_adminer
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "anas.client-ip.mode=edge"
      - "traefik.http.routers.mariadb_adminer.entrypoints=https"
      - "traefik.http.routers.mariadb_adminer.rule=Host(`${MARIADB_ADMINER_DOMAIN}`)"
      - "traefik.http.routers.mariadb_adminer.tls=true"
      # Adminer has its own database sign-in, so this gate is not what
      # authenticates the session; it is what keeps the console off the
      # public internet, where its arbitrary-host form would be a way
      # into the internal network. The dependency that publishes this
      # variable is conditional on adminer_enabled and unordered, so the
      # value arrives at render time rather than before this module runs.
      - "traefik.http.routers.mariadb_adminer.middlewares=${ANAS_FORWARD_AUTH_MIDDLEWARE}"
      - "traefik.http.services.mariadb_adminer.loadbalancer.server.port=8080"
    networks:
      - mariadb
      - traefik

networks:
  mariadb:
    driver: bridge
    name: ${MARIADB_NETWORK_NAME}
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
