api_version: anas.module/v1
kind: Module
name: casdoor
version: 3.143.0
revision: 8
app_version: 3.143.0
abi:
  supports:
    - anas.module-hook/v1
title: Casdoor
description: Release IAM provider serving OIDC and SAML with Samba AD-backed sign-in.
category: identity
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  provides:
    - name: iam
      interfaces:
        - oidc
        - saml
dependencies:
  requires:
    - traefik
    - samba_dc
  contracts:
    - name: relational_database
      version: ">=1.0.0 <2.0.0"
      selected_by: db_type
      interfaces:
        - postgres
      default: postgres
credentials:
  provides:
    - id: casdoor.signing_key
      secret_key: CASDOOR_SIGNING_MATERIAL
      type: key
      rotation_mode: overlap
      generation:
        kind: x509_rsa_bundle
        length: 2048
        overlap_seconds: 3600
      lifecycle:
        probe: probe-casdoor-signing-key
        reconcile: reconcile-casdoor-signing-key
        verify: verify-casdoor-signing-key
    - id: casdoor.portal_client_secret
      secret_key: CASDOOR_PORTAL_CLIENT_SECRET
      type: shared_secret
      rotation_mode: reconcile
      generation:
        kind: hex
        length: 32
      lifecycle:
        probe: probe-casdoor-portal-client-secret
        reconcile: reconcile-casdoor-portal-client-secret
        verify: verify-casdoor-portal-client-secret
resources:
  requires:
    - id: primary_database
      contract: relational_database
      binding: db_type
      spec_from:
        name: db_name
      spec:
        principal: casdoor
        credential:
          policy: generated
        deletion_policy: retain
upgrade:
  data_breaking: []
config:
  defaults:
    domain_prefix: auth
    db_name: casdoor
    db_type: auto
    ldap_auto_sync_minutes: "5"
  types:
    domain_prefix: string
    db_name: string
    db_type:
      enum: [auto, postgres]
    ldap_auto_sync_minutes:
      kind: int
      constraints:
        minimum: 1
  exports:
    - ANAS_IAM_BINDING_*
    - ANAS_IAM_PORTAL_URL
  consumes:
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_BASE_GROUPS_DN
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - SAMBA_DC_LDAP_BIND_DN
    - SAMBA_DC_LDAP_BIND_PASSWORD
    - SAMBA_DC_LDAPS_PORT
    - SAMBA_DC_LDAPS_SERVER_URL
    - SAMBA_DC_USER_CLASS_FILTER
    - SAMBA_DC_USER_ENABLED_FILTER
    - SAMBA_DC_GROUP_CLASS_FILTER
    - ANAS_DIRECTORY_EVENTS_DIR
    - ANAS_DIRECTORY_EVENTS_FILE_NAME
    - TRAEFIK_BASE_PORT
    - ANAS_IDENTITY_OIDC_CLIENTS
    - ANAS_IDENTITY_SAML_CLIENTS
    - ANAS_IAM_CLIENT_*
    - APPS_LIST*
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-casdoor-database
      description: Existing Casdoor data must be migrated explicitly.
    domain_prefix:
      effect: reconcile
      apply: reconcile-casdoor-domain
      description: OIDC issuer, SAML metadata, client registrations, and the proxy route change together.
features:
  generated_secrets: true
  domain: true
management:
  surfaces:
    - id: web
      uri_from: CASDOOR_DOMAIN_FULL
      authentication:
        primary: iam
    - id: local_recovery
      uri_from: CASDOOR_LOCAL_RECOVERY_URL
      authentication:
        primary: local
  local_accounts:
    - id: break_glass
      purpose: break_glass
      credential:
        policy: generated_per_module
        container_format: plaintext_on_bootstrap
      lifecycle:
        apply: apply-casdoor-break-glass
        rotate: rotate-casdoor-break-glass
logic:
  hook:
    command:
      - go
      - run
      - ./hook
    phases:
      - calculate
      - render_env
      - local_account_apply
      - local_account_rotate
      - local_account_rollback
      - credential_probe
      - credential_reconcile
      - credential_verify
