services:
  anas_lam:
    build:
      context: ./lam
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        CHINESE_BUILD_SPEEDUP: ${CHINESE_BUILD_SPEEDUP:-false}
        APT_MIRROR_URL: ${APT_MIRROR_URL:-}
        LAM_APT_MIRROR_URL: ${LAM_APT_MIRROR_URL:-}
        LAM_DOWNLOAD_URL: ${LAM_DOWNLOAD_URL:-}
        BUILD_GITHUB_DOWNLOAD_PROXY_PREFIX: ${BUILD_GITHUB_DOWNLOAD_PROXY_PREFIX:-}
        DOCKER_HUB_REGISTRY: ${DOCKER_HUB_REGISTRY:-docker.io}
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-lam:9.6.0-r6
    container_name: ${CONTAINER_PREFIX}lam
    restart: unless-stopped
    dns:
      - ${LOCAL_DNS_SERVER}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.lam.entrypoints=https"
      - "traefik.http.routers.lam.rule=Host(`${LAM_DOMAIN}`)"
      - "traefik.http.routers.lam.tls=true"
      - "traefik.http.services.lam.loadbalancer.server.port=80"
    env_file:
      - .env
    volumes:
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
    networks:
      - traefik

networks:
  traefik:
    external: true
    name: ${NETWORK_PREFIX}traefik
