api_version: anas.module/v1
kind: Module
name: llng
version: 2.23.4
revision: 13
app_version: 2.23.4
abi:
  supports:
    - anas.module-hook/v1
title: LemonLDAP::NG
description: SSO portal, SAML/OIDC identity provider, and app launcher.
category: identity
status: developing
applications:
  - name: llng-admin
    display_name:
      zh-CN: "LemonLDAP::NG Manager"
      en: "LemonLDAP::NG Manager"
    url_from: LLNG_MANAGER_DOMAIN_FULL
    summary:
      zh-CN: "身份与门户管理"
      en: "Identity and portal administration"
    description:
      zh-CN: "身份与门户管理。"
      en: "Identity and portal administration."
    documentation_url:
      zh-CN: https://lemonldap-ng.org/documentation/
      en: https://lemonldap-ng.org/documentation/
    icons:
      source: assets/icon.png
    weight: 100
    kind: admin
    categories:
      - identity
    access:
      mode: native
      groups_from: SAMBA_DC_ADMIN_GROUP_NAME
    visibility:
      mode: access
application_catalog:
  consumes: true
  limitations:
    - "Catalog content uses deployment language; native UI language switching does not switch application text"
    - "Default portal template supports one category level; kind and primary category share a label"
    - "Native menu does not expose the complete category filter, documentation links or icon sizes"
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  provides:
    - name: iam
      interfaces:
        - oidc
        - saml
dependencies:
  requires:
    - traefik
    - samba_dc
  contracts:
    - name: relational_database
      version: ">=1.0.0 <2.0.0"
      selected_by: db_type
      interfaces:
        - postgres
        - mariadb
      default: postgres
resources:
  requires:
    - id: primary_database
      contract: relational_database
      binding: db_type
      spec_from:
        name: db_name
      spec:
        principal: lemonldap_ng
        credential:
          policy: generated
        deletion_policy: retain
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: auth
    manager_domain_prefix: auth-manager
    test_domain_prefix: auth-test
    log_level: warn
    db_name: lemonldap_ng
    enable_test: "true"
    db_type: auto
    workers: 2
    background_logout_exceptions: ""
  types:
    domain_prefix: string
    manager_domain_prefix: string
    test_domain_prefix: string
    log_level: string
    db_name: string
    enable_test: bool
    workers: int
    background_logout_exceptions: string
    db_type:
      enum: [auto, postgres, mariadb]
  # Endpoints this module publishes for its bound consumers. The runner checks
  # that every binding actually received them.
  exports:
    - ANAS_IAM_BINDING_*
    - ANAS_IAM_PORTAL_URL
  # Generic client registration requests from consumers (translated into this
  # module's private SAML SP / OIDC RP configuration during render_env), the app
  # launcher metadata, and the resolved database backend's real password.
  # Consumers publish these, so they are outside this module's closure.
  consumes:
    - SAMBA_DC_ADMIN_GROUP_NAME
    # The Compose mount and entrypoint need the shared certificate directory;
    # scoped environments do not inherit runner-owned TLS paths implicitly.
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - SAMBA_DC_ADMIN_GROUP_NAME
    - SAMBA_DC_BASE_GROUPS_DN
    - SAMBA_DC_BASE_GROUPS_ROLE_DN
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_LDAPS_PORT
    - SAMBA_DC_LDAPS_SERVER_URL
    - SAMBA_DC_PASSWORD_BIND_DN
    - SAMBA_DC_USER_CLASS_FILTER
    - SAMBA_DC_USER_COMPLEX_PASS
    - SAMBA_DC_USER_EMAIL
    - SAMBA_DC_USER_ENABLED_FILTER
    - SAMBA_DC_USER_MIN_PASS_LENGTH
    - SAMBA_DC_USER_NAME
    - SAMBA_DC_USER_PASSWORD_HISTORY
    - TRAEFIK_DOMAIN_FULL
    - TRAEFIK_FORWARDED_HEADERS_TRUSTED_IPS
    - TRAEFIK_HOSTNAME
    - ANAS_IDENTITY_OIDC_CLIENTS
    - ANAS_IDENTITY_SAML_CLIENTS
    - ANAS_DIRECTORY_EVENTS_DIR
    - ANAS_DIRECTORY_EVENTS_FILE_NAME
    - ANAS_IAM_CLIENT_*
    - SAMBA_DC_PASSWORD_BIND_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-llng-database
      description: Existing LLNG data must be migrated explicitly.
    domain_prefix:
      effect: reconcile
      apply: reconcile-llng-domain
      description: SAML/OIDC metadata, clients, and proxy routes must change together.
features:
  generated_secrets: true
  domain: true
  after_start: copy_portal_logos
logic:
  hook:
    command:
      - go
      - run
      - ./hook
