api_version: anas.module/v1
kind: Module
name: ddns_updater
version: 2.10.0
revision: 1
app_version: 2.10.0
abi:
  supports:
    - anas.module-hook/v1
title: DDNS Updater
description: Dynamic DNS updater for the base domain and wildcard host.
category: network
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
  # The web interface can rewrite every DNS record this deployment owns, and
  # ddns-updater has no login of its own, so the gate is not optional.
  requires_capabilities:
    - name: forward_auth
      interface_selected_by: forward_auth_interface
      interfaces:
        any_of:
          - http
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  required:
    - dns_provider
  defaults:
    domain_prefix: ddns
    forward_auth_interface: auto
    # How the public address is discovered. Unlike ddns-go there is no local
    # interface mode here: "http" asks an echo service over HTTPS, "dns" asks
    # a resolver, "all" cycles both.
    #
    # The provider lists default to ddns-updater's own "all", which cycles
    # every echo service on each request so that no single one sees enough
    # traffic to rate-limit the updater. Narrow them only for a reason -- a
    # service that is slow or unreachable from this host -- and note that a
    # list of one removes that protection entirely. Entries are provider names
    # (ipify, ifconfig, ipinfo, ident, icanhazip, ...) or an explicit endpoint
    # written as url:https://example.com/ip.
    publicip_fetchers: http
    publicip_providers: all
    publicip_ipv4_providers: all
    publicip_ipv6_providers: all
    publicip_dns_providers: all
    ttl: "300"
  # DNS vendor credentials need no claim here. The runner materialises them
  # under this module's own env prefix, where prefix ownership already scopes
  # them to ddns_updater alone. See internal/runner/dnscred.go. The middleware
  # name is the forward_auth provider's contract.
  consumes:
    - ANAS_FORWARD_AUTH_MIDDLEWARE
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
