api_version: anas.module/v1
kind: Module
name: samba_dc
version: 4.23.6
revision: 13
app_version: 4.23.6
abi:
  supports:
    - anas.module-hook/v1
title: Samba domain controller and DNS
description: Active Directory compatible domain controller, LDAP source, and BIND9-DLZ DNS server.
category: identity
status: release
applications_not_published: "Directory and DNS protocols only; administration is published by LAM."
identity:
  group_catalog: true
  groups:
    - id: platform-admin
      name: Admins
      parent_dn_from: SAMBA_DC_BASE_GROUPS_ROLE_DN
      managed: true
      when: SAMBA_DC_CREATE_STRUCTURE
      category: roles
      order: 10
      risk: normal
      display_name: {en: "ANAS administrators", zh-CN: "ANAS 管理员"}
      description: {en: "Manages ANAS applications and portal users. Domain operations still require the operator’s own AD permissions.", zh-CN: "管理 ANAS 应用与门户人员；域级操作仍要求操作者本人具备相应 AD 权限。"}
    - id: unix-admin
      name: Unix Admins
      parent_dn_from: SAMBA_DC_BASE_GROUPS_ROLE_DN
      managed: true
      when: SAMBA_DC_CREATE_STRUCTURE
      category: roles
      order: 20
      risk: domain
      display_name: {en: "Domain infrastructure administrators", zh-CN: "域基础设施管理员"}
      description: {en: "Nested in Administrators and granted disk operator rights. This grants domain and host infrastructure privileges.", zh-CN: "嵌套于 Administrators，并具有磁盘操作权限，授予域和主机基础设施管理能力。"}
    - id: file-admin
      name: FS Admins
      parent_dn_from: SAMBA_DC_BASE_GROUPS_ACCESS_DN
      managed: true
      when: SAMBA_DC_CREATE_STRUCTURE
      category: access
      order: 10
      risk: resource
      display_name: {en: "File administrators", zh-CN: "文件管理员"}
      description: {en: "Root-equivalent access to Samba file resources; may bypass ordinary file permissions.", zh-CN: "对 Samba 文件资源具有相当于 root 的访问权限，可能绕过普通文件权限。"}
    - id: share-write
      name: FS Share RW
      parent_dn_from: SAMBA_DC_BASE_GROUPS_ACCESS_DN
      managed: true
      when: SAMBA_DC_CREATE_STRUCTURE
      category: access
      order: 20
      risk: normal
      display_name: {en: "Shared files: read and write", zh-CN: "共享文件读写"}
      description: {en: "Read and write access to the shared data directory. Does not grant ANAS or domain administration.", zh-CN: "允许读写共享数据目录，不授予 ANAS 或域管理权限。"}
    - id: all-applications
      name: APP_all
      parent_dn_from: SAMBA_DC_BASE_APP_DN
      managed: true
      when: SAMBA_DC_APP_FILTER
      category: applications
      order: 0
      risk: normal
      display_name: {en: "All applications", zh-CN: "所有应用"}
      description: {en: "Grants entry to all current and future group-filtered applications. Application-specific administration is separate.", zh-CN: "允许进入当前及以后启用的所有按组过滤的应用；应用内部管理权限另行控制。"}
    - id: domain-admins
      name: Domain Admins
      domain_rid: 512
      managed: false
      category: system
      risk: domain
      display_name: {en: "Domain Admins", zh-CN: "Domain Admins"}
      description: {en: "Full administration of this AD domain.", zh-CN: "拥有当前 AD 域的完整管理权限。"}
    - id: domain-users
      name: Domain Users
      domain_rid: 513
      managed: false
      category: system
      risk: normal
      display_name: {en: "Domain Users", zh-CN: "Domain Users"}
      description: {en: "Default primary group for ordinary domain users. A primary group cannot be removed as direct membership.", zh-CN: "普通域用户的默认主要组；主要组不能按直接成员关系移除。"}
    - id: schema-admins
      name: Schema Admins
      domain_rid: 518
      managed: false
      category: system
      risk: domain
      display_name: {en: "Schema Admins", zh-CN: "Schema Admins"}
      description: {en: "May modify the AD forest schema; changes can affect the entire forest.", zh-CN: "可以修改 AD 林架构，变更可能影响整个林。"}
    - id: enterprise-admins
      name: Enterprise Admins
      domain_rid: 519
      managed: false
      category: system
      risk: domain
      display_name: {en: "Enterprise Admins", zh-CN: "Enterprise Admins"}
      description: {en: "Forest-wide administration across AD domains.", zh-CN: "具有跨 AD 域的林级管理权限。"}
    - id: policy-owners
      name: Group Policy Creator Owners
      domain_rid: 520
      managed: false
      category: system
      risk: domain
      display_name: {en: "Group Policy Creator Owners", zh-CN: "Group Policy Creator Owners"}
      description: {en: "Creates group policies; policies can change domain user and computer behavior.", zh-CN: "可以创建组策略，策略可能改变域用户与计算机行为。"}
    - id: builtin-admins
      name: Administrators
      sid: S-1-5-32-544
      managed: false
      category: system
      risk: domain
      display_name: {en: "Administrators", zh-CN: "Administrators"}
      description: {en: "Built-in administrators with broad control of the domain controller.", zh-CN: "内置管理员，对域控制器具有广泛控制权。"}
    - id: account-operators
      name: Account Operators
      sid: S-1-5-32-548
      managed: false
      category: system
      risk: domain
      display_name: {en: "Account Operators", zh-CN: "Account Operators"}
      description: {en: "Delegated management of directory accounts; may grant sensitive account control.", zh-CN: "可管理目录账号，可能取得敏感账号控制权。"}
    - id: server-operators
      name: Server Operators
      sid: S-1-5-32-549
      managed: false
      category: system
      risk: domain
      display_name: {en: "Server Operators", zh-CN: "Server Operators"}
      description: {en: "Administration of domain server operations.", zh-CN: "管理域服务器运行。"}
    - id: print-operators
      name: Print Operators
      sid: S-1-5-32-550
      managed: false
      category: system
      risk: domain
      display_name: {en: "Print Operators", zh-CN: "Print Operators"}
      description: {en: "Administration of domain printing services; may affect the host.", zh-CN: "管理域打印服务，可能影响主机。"}
    - id: backup-operators
      name: Backup Operators
      sid: S-1-5-32-551
      managed: false
      category: system
      risk: domain
      display_name: {en: "Backup Operators", zh-CN: "Backup Operators"}
      description: {en: "May back up and restore data while bypassing ordinary file permissions.", zh-CN: "备份和恢复数据时可能绕过普通文件权限。"}
  roles:
    platform_admin: SAMBA_DC_ADMIN_GROUP_NAME
  groups_from: SAMBA_DC_APPLICATION_CATALOG_GROUPS
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - lego
upgrade:
  # r11 replaces the deployed pre-PEN AD schema object. Older artifacts cannot
  # safely start against the migrated directory; rollback requires a snapshot
  # restore rather than an artifact-only downgrade.
  data_breaking: ["4.23.6"]
config:
  must_resolve:
    - domain
    - mail_domain
    - realm
    - netbios_name
    - admin_password
    - administrator_password
    - ldap_bind_password
    - password_bind_password
    - anchor_bind_password
  # The normalized directory-change stream. Subscribers bind to these generic
  # names rather than to this module, so nothing downstream needs to know the
  # events originate from Samba's dsdb audit log.
  exports:
    - ANAS_DIRECTORY_EVENTS_DIR
    - ANAS_DIRECTORY_EVENTS_FILE_NAME
  consumes:
    - DOMAINS
    - ANAS_DEPLOYMENT_ID
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - LEGO_CA_CERT_NAME
    - LEGO_CERTS_PATH
    - LEGO_CERT_NAME
    - LEGO_KEY_NAME
    - ANAS_IDENTITY_APP_CLIENTS
    - ANAS_IDENTITY_CAPABILITY_GROUPS
  defaults:
    mail_directory_enabled: false
    mail_management_policy: ""
    mail_initial_source_domain: ""
    mail_initial_snapshot_id: ""
    application_dns_mode: auto
    app_filter: "true"
    create_structure: "true"
    admin_name: admin
    # Bound on the bundled BIND resolver's cache. Raise it on a host with
    # memory to spare; BIND's own default is 90% of total host memory, which
    # over-commits badly when it shares a machine with every other module.
    dns_cache_size: 128M
    template_shell: /bin/false
    template_homedir: /home/%D/%U
    user_complex_pass: "false"
    user_max_pass_age: "90"
    user_min_pass_age: "1"
    user_min_pass_length: "8"
    user_password_history: "2"
    user_lockout_threshold: "10"
    user_lockout_duration: "30"
    user_lockout_reset_after: "30"
    admin_complex_pass: "true"
    admin_max_pass_age: "0"
    admin_min_pass_age: "1"
    admin_min_pass_length: "8"
    admin_password_history: "2"
    admin_lockout_threshold: "10"
    admin_lockout_duration: "30"
    admin_lockout_reset_after: "30"
    ldap_bind_name: svc_ldap
    password_bind_name: svc_password
    anchor_bind_name: svc_anchor
    anchor_scan_interval: "300"
    dns_debug: "false"
    dns_forwarders: ""
    dns_allowed_networks: ""
    log_level: "1"
    # Kilobytes, per log file, and the cap on the dsdb audit trail the anchor
    # worker reads: Samba renames to <path>.old at this size and keeps one
    # rotated generation, so the audit directory settles at roughly twice this.
    # Nothing archives that log -- the anchor worker republishes what matters
    # into the event journal, which has its own retention -- so the useful
    # setting is the smallest one that still leaves a reader room to catch up.
    # Must not be 0: that disables the reopen-after-rename check Samba relies
    # on to keep all of its processes writing to the current file.
    max_log_size: "2048"
  types:
    mail_directory_enabled: bool
    mail_management_policy: string
    mail_initial_source_domain: string
    mail_initial_snapshot_id: string
    mail_creator_bind_password:
      kind: string
      default_source: generated
    mail_address_bind_password:
      kind: string
      default_source: generated
    domain:
      kind: string
      constraints:
        format: dns_name
      default_source: inherited
    mail_domain:
      kind: string
      constraints:
        format: dns_name
      default_source: inherited
    application_dns_mode:
      enum:
        - auto
        - ad_zone
        - separate_zone
    app_filter: bool
    create_structure: bool
    admin_name: string
    dns_cache_size: string
    template_shell: string
    template_homedir: string
    user_complex_pass: bool
    user_max_pass_age: int
    user_min_pass_age: int
    user_min_pass_length: int
    user_password_history: int
    user_lockout_threshold: int
    user_lockout_duration: int
    user_lockout_reset_after: int
    admin_complex_pass: bool
    admin_max_pass_age: int
    admin_min_pass_age: int
    admin_min_pass_length: int
    admin_password_history: int
    admin_lockout_threshold: int
    admin_lockout_duration: int
    admin_lockout_reset_after: int
    ldap_bind_name: string
    password_bind_name: string
    anchor_bind_name: string
    anchor_scan_interval: int
    dns_debug: bool
    # Samba accepts composite logging expressions and list-like DNS values.
    log_level: string
    dns_forwarders: string
    dns_allowed_networks: string
    max_log_size:
      kind: int
      constraints:
        minimum: 1
    realm:
      kind: string
      default_source: inherited
    netbios_name:
      kind: string
      default_source: runtime
    admin_password:
      kind: string
      default_source: generated
    administrator_password:
      kind: string
      default_source: generated
    ldap_bind_password:
      kind: string
      default_source: generated
    password_bind_password:
      kind: string
      default_source: generated
    anchor_bind_password:
      kind: string
      default_source: generated
  changes:
    mail_initial_source_domain:
      effect: data_migrate
      apply: bootstrap-mail-directory
      description: Initial converged source domain; pinned by the completion marker and never repointed by normal restart.
    mail_initial_snapshot_id:
      effect: data_migrate
      apply: bootstrap-mail-directory
      description: Verified initial full snapshot reference; pinned after successful import.
    mail_directory_enabled:
      effect: data_migrate
      apply: bootstrap-mail-directory
      description: Enable only after a verified full snapshot and stopped external writers; installs non-login resources and imports converged primary addresses offline.
    mail_management_policy:
      effect: container_recreate
    mail_creator_bind_password:
      effect: credential_rotate
      apply: rotate-mail-creator-bind-password
      sensitive: true
    mail_address_bind_password:
      effect: credential_rotate
      apply: rotate-mail-address-bind-password
      sensitive: true
    mail_domain:
      effect: data_migrate
      apply: migrate-default-mail-addresses
      description: Primary email domain, inherited from the AD DNS domain unless configured; changing it reconciles primary addresses in the configured personnel OU without renaming the AD domain.
    domain:
      effect: immutable
      apply: replace-directory-domain
      description: The AD DNS domain is part of the provisioned directory identity and cannot be renamed in place.
    application_dns_mode:
      effect: data_migrate
      apply: migrate-application-dns-zone
      description: Switching the authoritative Samba zone moves persistent DNS records and requires a managed migration.
    realm:
      effect: immutable
      apply: replace-directory-domain
      description: The realm is derived from the provisioned AD DNS domain and is part of the directory identity.
    netbios_name:
      effect: immutable
      apply: replace-domain-controller
      description: Changing the DC machine identity requires a controlled replacement.
    admin_password:
      effect: credential_rotate
      apply: rotate-samba-admin-password
      sensitive: true
      description: The existing AD account must be updated explicitly.
    administrator_password:
      effect: credential_rotate
      apply: rotate-samba-administrator-password
      sensitive: true
      description: The provision password is not reapplied after initialization.
    ldap_bind_password:
      effect: credential_rotate
      apply: rotate-ldap-bind-password
      sensitive: true
      description: Update AD and all LDAP consumers as one transaction.
    password_bind_password:
      effect: credential_rotate
      apply: rotate-password-bind-password
      sensitive: true
      description: Update AD and password-capable applications as one transaction.
    anchor_bind_password:
      effect: credential_rotate
      apply: rotate-anchor-bind-password
      sensitive: true
      description: Update the AD service account and Anchor Worker as one transaction.
    anchor_scan_interval:
      effect: container_recreate
      apply: recreate-anchor-worker
      description: The reconciliation interval is consumed by the Anchor Worker process.
    user_complex_pass:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_min_pass_length:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_password_history:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_max_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_min_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_threshold:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_duration:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_reset_after:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    admin_complex_pass:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_min_pass_length:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_password_history:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_max_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_min_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_threshold:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_duration:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_reset_after:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    log_level:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated smb.conf is installed during container initialization.
    max_log_size:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated smb.conf is installed during container initialization.
    dns_debug:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The named process debug level is selected when the container starts.
    dns_forwarders:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated BIND configuration is installed during container initialization.
    dns_allowed_networks:
      effect: container_recreate
      apply: recreate-samba-dc
      description: BIND recursion and cache access are restricted to these networks.
features:
  ldap_provider: true
  kerberos_env: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
    phases:
      - validate
      - calculate
      - render_env
      - services
      - after_start
