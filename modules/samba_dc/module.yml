api_version: anas.module/v1
kind: Module
name: samba_dc
version: 4.23.6
revision: 10
app_version: 4.23.6
abi:
  supports:
    - anas.module-hook/v1
title: Samba domain controller and DNS
description: Active Directory compatible domain controller, LDAP source, and BIND9-DLZ DNS server.
category: identity
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - lego
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  must_resolve:
    - domain
    - realm
    - netbios_name
    - admin_password
    - administrator_password
    - ldap_bind_password
    - password_bind_password
    - anchor_bind_password
  # The normalized directory-change stream. Subscribers bind to these generic
  # names rather than to this module, so nothing downstream needs to know the
  # events originate from Samba's dsdb audit log.
  exports:
    - ANAS_DIRECTORY_EVENTS_DIR
    - ANAS_DIRECTORY_EVENTS_FILE_NAME
  consumes:
    - DOMAINS
    - ANAS_DEPLOYMENT_ID
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - ANAS_TLS_TRUST_BUNDLE_NAME
    - LEGO_CA_CERT_NAME
    - LEGO_CERTS_PATH
    - LEGO_CERT_NAME
    - LEGO_KEY_NAME
    - ANAS_IDENTITY_APP_CLIENTS
  defaults:
    application_dns_mode: auto
    app_filter: "true"
    create_structure: "true"
    admin_name: admin
    # Bound on the bundled BIND resolver's cache. Raise it on a host with
    # memory to spare; BIND's own default is 90% of total host memory, which
    # over-commits badly when it shares a machine with every other module.
    dns_cache_size: 128M
    template_shell: /bin/false
    template_homedir: /home/%D/%U
    user_complex_pass: "false"
    user_max_pass_age: "90"
    user_min_pass_age: "1"
    user_min_pass_length: "8"
    user_password_history: "2"
    user_lockout_threshold: "10"
    user_lockout_duration: "30"
    user_lockout_reset_after: "30"
    admin_complex_pass: "true"
    admin_max_pass_age: "0"
    admin_min_pass_age: "1"
    admin_min_pass_length: "8"
    admin_password_history: "2"
    admin_lockout_threshold: "10"
    admin_lockout_duration: "30"
    admin_lockout_reset_after: "30"
    ldap_bind_name: svc_ldap
    password_bind_name: svc_password
    anchor_bind_name: svc_anchor
    anchor_scan_interval: "300"
    dns_debug: "false"
    dns_forwarders: ""
    dns_allowed_networks: ""
    log_level: "1"
    # Kilobytes, per log file, and the cap on the dsdb audit trail the anchor
    # worker reads: Samba renames to <path>.old at this size and keeps one
    # rotated generation, so the audit directory settles at roughly twice this.
    # Nothing archives that log -- the anchor worker republishes what matters
    # into the event journal, which has its own retention -- so the useful
    # setting is the smallest one that still leaves a reader room to catch up.
    # Must not be 0: that disables the reopen-after-rename check Samba relies
    # on to keep all of its processes writing to the current file.
    max_log_size: "2048"
  types:
    domain:
      kind: string
      constraints:
        format: dns_name
      default_source: inherited
    application_dns_mode:
      enum:
        - auto
        - ad_zone
        - separate_zone
    app_filter: bool
    create_structure: bool
    admin_name: string
    dns_cache_size: string
    template_shell: string
    template_homedir: string
    user_complex_pass: bool
    user_max_pass_age: int
    user_min_pass_age: int
    user_min_pass_length: int
    user_password_history: int
    user_lockout_threshold: int
    user_lockout_duration: int
    user_lockout_reset_after: int
    admin_complex_pass: bool
    admin_max_pass_age: int
    admin_min_pass_age: int
    admin_min_pass_length: int
    admin_password_history: int
    admin_lockout_threshold: int
    admin_lockout_duration: int
    admin_lockout_reset_after: int
    ldap_bind_name: string
    password_bind_name: string
    anchor_bind_name: string
    anchor_scan_interval: int
    dns_debug: bool
    # Samba accepts composite logging expressions and list-like DNS values.
    log_level: string
    dns_forwarders: string
    dns_allowed_networks: string
    max_log_size:
      kind: int
      constraints:
        minimum: 1
    realm:
      kind: string
      default_source: inherited
    netbios_name:
      kind: string
      default_source: runtime
    admin_password:
      kind: string
      default_source: generated
    administrator_password:
      kind: string
      default_source: generated
    ldap_bind_password:
      kind: string
      default_source: generated
    password_bind_password:
      kind: string
      default_source: generated
    anchor_bind_password:
      kind: string
      default_source: generated
  changes:
    domain:
      effect: immutable
      apply: replace-directory-domain
      description: The AD DNS domain is part of the provisioned directory identity and cannot be renamed in place.
    application_dns_mode:
      effect: data_migrate
      apply: migrate-application-dns-zone
      description: Switching the authoritative Samba zone moves persistent DNS records and requires a managed migration.
    realm:
      effect: immutable
      apply: replace-directory-domain
      description: The realm is derived from the provisioned AD DNS domain and is part of the directory identity.
    netbios_name:
      effect: immutable
      apply: replace-domain-controller
      description: Changing the DC machine identity requires a controlled replacement.
    admin_password:
      effect: credential_rotate
      apply: rotate-samba-admin-password
      sensitive: true
      description: The existing AD account must be updated explicitly.
    administrator_password:
      effect: credential_rotate
      apply: rotate-samba-administrator-password
      sensitive: true
      description: The provision password is not reapplied after initialization.
    ldap_bind_password:
      effect: credential_rotate
      apply: rotate-ldap-bind-password
      sensitive: true
      description: Update AD and all LDAP consumers as one transaction.
    password_bind_password:
      effect: credential_rotate
      apply: rotate-password-bind-password
      sensitive: true
      description: Update AD and password-capable applications as one transaction.
    anchor_bind_password:
      effect: credential_rotate
      apply: rotate-anchor-bind-password
      sensitive: true
      description: Update the AD service account and Anchor Worker as one transaction.
    anchor_scan_interval:
      effect: container_recreate
      apply: recreate-anchor-worker
      description: The reconciliation interval is consumed by the Anchor Worker process.
    user_complex_pass:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_min_pass_length:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_password_history:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_max_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_min_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_threshold:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_duration:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    user_lockout_reset_after:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the domain policy without restarting Samba.
    admin_complex_pass:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_min_pass_length:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_password_history:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_max_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_min_pass_age:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_threshold:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_duration:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    admin_lockout_reset_after:
      effect: hot_reload
      apply: samba-password-policy
      description: samba-tool can update the privileged PSO without restarting Samba.
    log_level:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated smb.conf is installed during container initialization.
    max_log_size:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated smb.conf is installed during container initialization.
    dns_debug:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The named process debug level is selected when the container starts.
    dns_forwarders:
      effect: container_recreate
      apply: recreate-samba-dc
      description: The generated BIND configuration is installed during container initialization.
    dns_allowed_networks:
      effect: container_recreate
      apply: recreate-samba-dc
      description: BIND recursion and cache access are restricted to these networks.
features:
  ldap_provider: true
  kerberos_env: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
    phases:
      - validate
      - calculate
      - render_env
      - services
      - after_start
