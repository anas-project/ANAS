services:
  anas_meshcentral:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-meshcentral:1.2.4-r5
    build:
      context: ./${MODULE_NAME}
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        NPM_REGISTRY_URL: ${NPM_REGISTRY_URL:-https://registry.npmjs.org}
        GHCR_REGISTRY: ${GHCR_REGISTRY:-ghcr.io}
    restart: unless-stopped
    init: true
    dns:
      - ${LOCAL_DNS_SERVER}
    ports:
      # the port of Intel" AMT CIRA (Client Initiated Remote Access) connections, MpsPort
      - ${MESHCENTRAL_MPS_PORT}:${MESHCENTRAL_MPS_PORT}
    env_file:
      - .env
    tmpfs:
      - /run/anas:mode=0700,size=1m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${TRAEFIK_BASE_PORT}/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - "${ANAS_TLS_CERTS_DIR}/${ANAS_TLS_INTERNAL_CA_NAME}:/usr/local/share/ca-certificates/anas-internal-ca.crt:ro"
      - "${DATA_PATH}/meshcentral/meshcentral-data:/opt/meshcentral/meshcentral-data"
      - "${DATA_PATH}/meshcentral/meshcentral-files:/opt/meshcentral/meshcentral-files"
      - "${DATA_PATH}/meshcentral/meshcentral-web:/opt/meshcentral/meshcentral-web"
      - "${DATA_PATH}/meshcentral/meshcentral-backups:/opt/meshcentral/meshcentral-backups"
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.meshcentral.entrypoints=https"
      - "traefik.http.routers.meshcentral.rule=Host(`${MESHCENTRAL_DOMAIN}`)"
      - "traefik.http.routers.meshcentral.tls=true"
      - "traefik.http.services.meshcentral.loadbalancer.server.port=${TRAEFIK_BASE_PORT}"
    networks:
      - db
      - traefik
networks:
  db:
    name: ${MESHCENTRAL_NETWORK_DB}
    external: true
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
