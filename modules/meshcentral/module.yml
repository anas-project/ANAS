api_version: anas.module/v1
kind: Module
name: meshcentral
version: 1.2.4
revision: 2
app_version: 1.2.4
abi:
  supports:
    - anas.module-hook/v1
title: MeshCentral
description: Remote device management service using LDAP authentication.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - samba_dc
  contracts:
    - name: relational_database
      version: ">=1.0.0 <2.0.0"
      selected_by: db_type
      interfaces:
        - postgres
        - mariadb
      default: postgres
resources:
  requires:
    - id: primary_database
      contract: relational_database
      binding: db_type
      spec_from:
        name: db_name
      spec:
        principal: meshcentral
        credential:
          policy: generated
        deletion_policy: retain
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: meshcentral
    mps_port: "4433"
    db_name: meshcentral
    db_type: auto
  # The container connects to the resolved database and binds to LDAP with
  # these real credentials directly. Its entrypoint derives config.json in
  # /run/anas.
  consumes:
    - SAMBA_DC_ADMIN_GROUP_DN
    - SAMBA_DC_ADMIN_NAME
    - SAMBA_DC_APP_ALL_DN
    - SAMBA_DC_APP_FILTER
    - SAMBA_DC_BASE_APP_DN
    - SAMBA_DC_BASE_GROUPS_ROLE_DN
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_GROUP_CLASS_FILTER
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - SAMBA_DC_LDAPS_SERVER_URL_PORT
    - SAMBA_DC_LDAP_BIND_DN
    - SAMBA_DC_USER_CLASS_FILTER
    - SAMBA_DC_USER_DISPLAY_NAME
    - SAMBA_DC_USER_EMAIL
    - SAMBA_DC_USER_ENABLED_FILTER
    - SAMBA_DC_USER_LOGIN_ATTRS
    - TRAEFIK_BASE_PORT
    - TRAEFIK_DOMAIN
    - TRAEFIK_DOMAIN_FULL
    - TRAEFIK_HOSTNAME
    - SAMBA_DC_LDAP_BIND_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-meshcentral-database
      description: Changing the selected database does not migrate existing MeshCentral data.
    db_name:
      effect: data_migrate
      apply: migrate-meshcentral-database
      description: The database name is materialized when the database is initialized.
identity:
  interfaces:
    - ldaps
  application_group: true
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
