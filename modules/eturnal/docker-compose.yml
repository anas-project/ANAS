services:
  anas_eturnal:
    image: ${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/anas-eturnal:1.12.2-r6
    build:
      context: ./eturnal
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        GHCR_REGISTRY: ${GHCR_REGISTRY:-ghcr.io}
    container_name: ${CONTAINER_PREFIX}eturnal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    tmpfs:
      - /run/anas:mode=0700,uid=9000,gid=9000,size=1m
      # The upstream image declares its application release as a volume. The
      # entrypoint restores the baked seed here; no state survives recreation.
      # Docker mounts tmpfs with noexec unless exec is requested explicitly.
      # The upstream release stored here contains the eturnal executables.
      - /opt/eturnal:exec,mode=2755,uid=9000,gid=9000,size=64m
