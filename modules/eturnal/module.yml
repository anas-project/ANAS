api_version: anas.module/v1
kind: Module
name: eturnal
version: 1.12.2
revision: 3
app_version: 1.12.2
abi:
  supports:
    - anas.module-hook/v1
title: Eturnal TURN
description: TURN service used by realtime communication modules.
category: communication
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  env_prefix: TURN
  defaults:
    port: "3478"
    domain_prefix: turn
features:
  generated_secrets: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
