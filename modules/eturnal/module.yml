api_version: anas.module/v1
kind: Module
name: eturnal
version: 1.12.2
revision: 6
app_version: 1.12.2
abi:
  supports:
    - anas.module-hook/v1
title: Eturnal TURN
description: TURN service used by realtime communication modules.
category: communication
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
credentials:
  provides:
    - id: eturnal.secret
      secret_key: TURN_SECRET
      type: shared_secret
      rotation_mode: reconcile
      generation:
        kind: hex
        length: 16
      lifecycle:
        probe: probe-eturnal-secret
        reconcile: reconcile-eturnal-secret
        verify: verify-eturnal-secret
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  env_prefix: TURN
  defaults:
    port: "3478"
    domain_prefix: turn
  types:
    port:
      kind: int
      constraints:
        minimum: 1
        maximum: 65535
    domain_prefix: string
features:
  generated_secrets: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
    phases:
      - calculate
      - render_env
      - services
      - after_start
      - credential_probe
      - credential_reconcile
      - credential_verify
