api_version: anas.module/v1
kind: Module
name: postgres
version: 18.4.0
revision: 4
app_version: 18.4.0
abi:
  supports:
    - anas.module-hook/v1
title: PostgreSQL
description: PostgreSQL database service with optional Adminer UI.
category: database
status: release
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
  # Only while the Adminer console exists. Adminer authenticates against the
  # database itself, but its sign-in form accepts an arbitrary target host, so a
  # publicly routed one is a way into the internal Docker network rather than
  # merely an unguarded page.
  #
  # ordering: any because the gateway needs an IAM, the IAM needs a relational
  # database, and that database is this module -- a strong edge here is a cycle
  # in every single-database deployment. The provider stays mandatory; only the
  # ordering is given up, and nothing here reads it before rendering.
  requires_capabilities:
    - name: forward_auth
      enabled_by: adminer_enabled
      ordering: any
      interface_selected_by: forward_auth_interface
      interfaces:
        any_of:
          - http
contracts:
  provides:
    - name: relational_database
      version: 1.0.0
      interface: postgres
      implementation: providers/relational_database/provider.yml
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  must_resolve:
    - password
  defaults:
    username: postgres
    adminer_enabled: "false"
    forward_auth_interface: auto
  types:
    username: string
    password:
      kind: string
      default_source: generated
    adminer_enabled: bool
    forward_auth_interface:
      enum: [auto, http]
  # Required, not merely tidy: an unordered dependency drops its provider from
  # this module's dependency closure, so closure and prefix visibility no longer
  # reach anything oauth2_proxy publishes. This claim is the only route left.
  consumes:
    - ANAS_FORWARD_AUTH_MIDDLEWARE
  changes:
    username:
      effect: data_migrate
      apply: migrate-postgres-owner
      description: POSTGRES_USER only initializes an empty data directory.
    password:
      effect: credential_rotate
      apply: rotate-postgres-password
      sensitive: true
      description: Change the database role and consumers before recreating containers.
    adminer_enabled:
      effect: container_recreate
      apply: recreate-postgres-project
      description: The optional Compose service set changes.
    forward_auth_interface:
      effect: container_recreate
      apply: recreate-postgres-project
      description: The gateway binding changes with the selected interface.
services:
  optional:
    - name: postgres_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
