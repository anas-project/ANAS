api_version: anas.provider/v1
kind: ContractProvider
contract: compute
contract_version: 1.0.0
interface: incus_container
operations:
  ensure:
    runtime: compose_run
    service: anas_incus_provision
    command: [ensure, --isolation, container]
  inspect:
    runtime: compose_run
    service: anas_incus_provision
    command: [inspect, --isolation, container]
  revoke:
    runtime: compose_run
    service: anas_incus_provision
    command: [revoke, --isolation, container]
