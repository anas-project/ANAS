api_version: anas.module/v1
kind: Module
name: netbird
version: 0.76.1
revision: 6
app_version: 0.76.1
abi:
  supports:
    - anas.module-hook/v1
title: NetBird
description: Incomplete WireGuard overlay network scaffold; excluded from recommended deployments.
category: network
status: developing
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - eturnal
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - oidc
        prefer:
          - oidc
credentials:
  consumes:
    - credential: eturnal.secret
      projection: TURN_SECRET
upgrade:
  # Empty, not absent: no release of this module has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: netbird
    adminer_enabled: "false"
    iam_protocol: auto
  types:
    domain_prefix: string
    adminer_enabled: bool
    iam_protocol:
      enum: [auto, oidc, saml]
  # Generic client registration and app-launcher metadata published to
  # whichever IAM the deployment selected.
  exports:
    - ANAS_IAM_CLIENT__NETBIRD__*
    - APPS_LIST*
  # This module's own IAM binding. It reads no other consumer's binding and no
  # IAM-implementation variable.
  consumes:
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
    - NETBIRD_SIGNAL_PORT
    - SAMBA_DC_ADMIN_GROUP_NAME
    - SAMBA_DC_APP_FILTER
    - TRAEFIK_BASE_PORT
    - TRAEFIK_HOSTNAME
    - TURN_DOMAIN_PORT
    - ANAS_IAM_BINDING__NETBIRD__*
    - TURN_SECRET
  changes:
    iam_protocol:
      effect: container_recreate
      apply: recreate-netbird
      description: The OIDC issuer and client configuration change together.
identity:
  application_group: true
features:
  generated_secrets: true
  domain: true
services:
  optional:
    - name: NETBIRD_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
