api_version: anas.contract/v1
kind: Contract
name: compute
version: 1.0.0
interfaces:
  - incus_vm
  - incus_container
resource:
  schema: schemas/resource.yml
  identity:
    - consumer
    - resource_id
operations:
  ensure:
    request_schema: schemas/ensure-request.yml
    result_schema: schemas/sandbox-result.yml
    required: true
  inspect:
    request_schema: schemas/inspect-request.yml
    result_schema: schemas/inspect-result.yml
    required: true
  revoke:
    request_schema: schemas/revoke-request.yml
    result_schema: schemas/revoke-result.yml
    required: false
