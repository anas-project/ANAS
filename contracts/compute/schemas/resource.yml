type: object
additional_properties: false
required: [sandbox, instance_prefix, quota, image_allowlist, credential, deletion_policy]
properties:
  # The restricted provider-side project that fences this consumer in. One
  # lease owns exactly one project; two consumers never share one.
  sandbox:
    type: string
    pattern: "^[a-z][a-z0-9-]{0,62}$"
  # Every instance the consumer creates must carry this prefix. list and
  # reclaim are filtered by it, so a lease can never enumerate or destroy
  # another lease's instances even inside the same project.
  instance_prefix:
    type: string
    pattern: "^anas-[a-z0-9-]{1,50}$"
  # Enforced by the provider on the project itself, not by the consumer. A
  # compromised consumer still cannot exceed these.
  quota:
    type: object
    additional_properties: false
    required: [max_instances, cpu, memory_mib, disk_gib]
    properties:
      max_instances: {type: integer, minimum: 1, maximum: 256}
      cpu: {type: integer, minimum: 1, maximum: 64}
      memory_mib: {type: integer, minimum: 512, maximum: 262144}
      disk_gib: {type: integer, minimum: 4, maximum: 2048}
  # Reserved opening, not yet implemented. "pinned" (the default) means the
  # allowlist below is the complete set of images this lease may boot. "any"
  # is refused today: it would empty the one constraint in this contract the
  # daemon does not backstop, so it needs its own visible switch and its own
  # acceptance before it can be honoured.
  image_policy:
    enum: [pinned, any]
  # Pinned SHA-256 image fingerprints. Tags, aliases and remote URLs are not
  # accepted: the set of things a lease can boot is fixed at apply time.
  image_allowlist:
    type: array
    min_items: 1
    items:
      one_of:
        - type: object
          additional_properties: false
          required: [fingerprint]
          properties:
            fingerprint:
              type: string
              pattern: "^[a-f0-9]{64}$"
        - type: object
          additional_properties: false
          required: [catalog, name, revision]
          properties:
            catalog:
              enum: [anas]
            name:
              type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
            revision:
              type: string
              pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"
  credential:
    type: object
    additional_properties: false
    required: [policy]
    properties:
      policy:
        enum: [generated]
  deletion_policy:
    enum: [retain, delete]
  # Declaration/freezing only until real-host acceptance. Runtime publishing
  # stays disabled; omission grants no HTTP publication authority.
  ingress:
    type: object
    additional_properties: false
    required: [allowed_ports, domain]
    properties:
      allowed_ports:
        type: array
        min_items: 1
        max_items: 64
        unique_items: true
        items: {type: integer, minimum: 1, maximum: 65535}
      # Default none. Unpredictable URLs are not access control: SNI, Referer
      # and logs can disclose them. Do not expose sensitive or writable services.
      auth:
        enum: [none, forward_auth]
      domain:
        type: object
        additional_properties: false
        required: [mode, prefix]
        properties:
          mode:
            enum: [fixed, named, random]
          # Core additionally limits named prefixes to 61 and random to 30.
          prefix:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
