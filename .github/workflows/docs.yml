name: Documentation

on:
  pull_request:
  workflow_run:
    workflows: [Module and container artifacts, ANAS release]
    types: [completed]
    branches: [image-release, anas-release]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && 'master' || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm ci

      - name: Validate documentation sources
        run: |
          go run ./cmd/gen-module-docs --check
          go run ./cmd/gen-contract-docs --check
          go test ./cmd/materialize-module-docs

      - name: Build with VitePress
        env:
          DOCS_PUBLISH_RELEASES: ${{ (github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
        run: |
          npm run docs:test-versions
          npm run docs:build

      - name: Setup GitHub Pages
        id: pages
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy documentation
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
