name: Sync repository to CNB

on:
  push:
    branches: ["**"]
    tags: ["**"]
  delete:
  workflow_run:
    workflows: ["ANAS release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnb-sync
  cancel-in-progress: false

jobs:
  mirror:
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror branches and tags
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$CNB_TOKEN" ]]; then
            echo "Repository secret CNB_TOKEN is required" >&2
            exit 1
          fi

          printf 'machine cnb.cool\nlogin cnb\npassword %s\n' "$CNB_TOKEN" >"$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git remote add cnb https://cnb.cool/anas.dev/ANAS.git
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git update-ref -d refs/remotes/origin/HEAD || true
          git push --prune cnb 'refs/remotes/origin/*:refs/heads/*'
          git push --prune cnb 'refs/tags/*:refs/tags/*'
