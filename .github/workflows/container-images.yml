name: Module and container artifacts

on:
  pull_request:
    branches: [image-release]
    paths:
      - ".github/images.json"
      - ".github/mirrors.json"
      - ".github/modules.json"
      - ".github/workflows/container-images.yml"
      - "cmd/package-module/**"
      - "cmd/gen-module-docs/**"
      - "contracts/**"
      - "internal/config/config.go"
      - "internal/configschema/**"
      - "internal/localization/**"
      - "internal/moduledocs/**"
      - "internal/modulepackage/**"
      - "internal/runner/**"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/runtime-image.sh"
      - "scripts/ci/scan-image.sh"
      - "scripts/ci/install-crane.sh"
      - "scripts/ci/module-revisions.sh"
      - "scripts/ci/module-revisions-test.sh"
      - "modules/**"
  push:
    branches: [image-release]
    paths:
      - ".github/images.json"
      - ".github/mirrors.json"
      - ".github/modules.json"
      - ".github/workflows/container-images.yml"
      - "cmd/package-module/**"
      - "cmd/gen-module-docs/**"
      - "contracts/**"
      - "internal/config/config.go"
      - "internal/configschema/**"
      - "internal/localization/**"
      - "internal/moduledocs/**"
      - "internal/modulepackage/**"
      - "internal/runner/**"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/runtime-image.sh"
      - "scripts/ci/scan-image.sh"
      - "scripts/ci/install-crane.sh"
      - "scripts/ci/module-revisions.sh"
      - "scripts/ci/module-revisions-test.sh"
      - "modules/**"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish, or all for the initial release"
        required: true
        default: all

permissions:
  contents: write
  packages: write

concurrency:
  group: module-artifacts-${{ github.event.pull_request.number || 'image-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      mirror_matrix: ${{ steps.matrix.outputs.mirror_matrix }}
      mirror_count: ${{ steps.matrix.outputs.mirror_count }}
      package_matrix: ${{ steps.packages.outputs.matrix }}
      package_count: ${{ steps.packages.outputs.count }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      base_sha: ${{ steps.release.outputs.base_sha }}
      first_release: ${{ steps.release.outputs.first_release }}
      finalize: ${{ steps.release.outputs.finalize }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test revision calculator
        run: |
          bash scripts/ci/module-revisions-test.sh
          go test ./internal/modulepackage ./cmd/gen-module-docs ./cmd/materialize-module-docs

      - name: Calculate and commit release revisions
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          release_branch=image-release
          first_release=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            if [[ "$REF_NAME" != "$release_branch" ]]; then
              echo "Container releases must run from the $release_branch branch" >&2
              exit 1
            fi

            last_release_tag=''
            while IFS= read -r candidate; do
              if git merge-base --is-ancestor "$candidate" HEAD; then
                last_release_tag="$candidate"
                break
              fi
            done < <(git for-each-ref --sort=-version:refname --format='%(refname:short)' 'refs/tags/image-release/*')

            if [[ -n "$last_release_tag" ]]; then
              base_sha="$(git rev-list -n1 "$last_release_tag")"
              echo "Using successful release $last_release_tag at $base_sha"
            else
              first_release=true
              zero_sha=0000000000000000000000000000000000000000
              if [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "$zero_sha" ]] &&
                 git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
                base_sha="$EVENT_BEFORE"
              else
                base_sha="$(git rev-parse HEAD)"
              fi
              echo "No successful image-release tag exists; using $base_sha as the bootstrap base"
            fi
          fi

          if ! git merge-base --is-ancestor "$base_sha" HEAD; then
            echo "Release base $base_sha is not an ancestor of HEAD" >&2
            exit 1
          fi

          bash scripts/ci/module-revisions.sh --base "$base_sha" --write
          go run ./cmd/gen-module-docs
          bash scripts/ci/module-revisions.sh --base "$base_sha" --check
          go run ./cmd/gen-module-docs --check

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            while IFS= read -r module; do
              git add -- "modules/${module}/module.yml" "modules/${module}/docker-compose.yml"
              if [[ -f "modules/${module}/localization.yml" ]]; then
                git add -- "modules/${module}/localization.yml"
              fi
            done < <(jq -r '.[].module' .github/modules.json | LC_ALL=C sort -u)

            while IFS= read -r generated_file; do
              git add -- "$generated_file"
            done < <(go run ./cmd/gen-module-docs --print-managed-files)

            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "chore(release): update Module metadata and generated docs"
            fi

            release_status="$(git status --porcelain)"
            if [[ -n "$release_status" ]]; then
              echo "Release preparation left uncommitted files:" >&2
              printf '%s\n' "$release_status" >&2
              exit 1
            fi
            go run ./cmd/gen-module-docs --check

            if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
              git push origin HEAD:refs/heads/image-release
            fi
          fi

          release_sha="$(git rev-parse HEAD)"
          finalize=false
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && ( -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ) ) ]]; then
            finalize=true
          fi
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "first_release=$first_release" >>"$GITHUB_OUTPUT"
          echo "finalize=$finalize" >>"$GITHUB_OUTPUT"

      - name: Select images
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          HEAD_SHA: ${{ steps.release.outputs.release_sha }}
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REQUESTED_MODULE" && "$REQUESTED_MODULE" != "all" ]] &&
             ! jq -e --arg module "$REQUESTED_MODULE" 'any(.[]; .module == $module)' .github/modules.json >/dev/null; then
            echo "Unknown Module: $REQUESTED_MODULE" >&2
            exit 1
          fi

          jq -e 'type == "array" and length > 0' .github/images.json >/dev/null
          actual="$(find modules -type f -name Dockerfile | LC_ALL=C sort)"
          registered="$(jq -r '.[].dockerfile' .github/images.json | LC_ALL=C sort)"
          if ! diff -u <(printf '%s\n' "$actual") <(printf '%s\n' "$registered"); then
            echo "Every Dockerfile must appear exactly once in .github/images.json" >&2
            exit 1
          fi

          while IFS=$'\t' read -r module image; do
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            expected='${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/'"${image}:${version}-r${revision}"
            if ! grep -Fq "image: ${expected}" "modules/${module}/docker-compose.yml"; then
              echo "${module}/docker-compose.yml must reference ${expected}" >&2
              exit 1
            fi
          done < <(jq -r '.[] | [.module, .image] | @tsv' .github/images.json)

          jq -e '
            type == "array" and length > 0 and
            all(.[ ];
              (.modules | type == "array" and length > 0) and
              (.image | test("^anas-mirror-[a-z0-9-]+$")) and
              (.tag | type == "string" and length > 0 and . != "latest") and
              (.source | type == "string" and length > 0) and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.platforms | test("^linux/(amd64|arm64)(,linux/(amd64|arm64))*$"))
            ) and
            ([.[].image] | length == (unique | length))
          ' .github/mirrors.json >/dev/null

          mirror_is_dockerfile_base() {
            local module="$1" expected="$2" dockerfile
            while IFS= read -r dockerfile; do
              if awk -v expected="$expected" '
                toupper($1) == "FROM" {
                  for (field = 2; field <= NF; field++) {
                    if ($field == expected) found = 1
                  }
                }
                END { exit !found }
              ' "$dockerfile"; then
                return 0
              fi
            done < <(jq -r --arg module "$module" '.[] | select(.module == $module) | .dockerfile' .github/images.json)
            return 1
          }

          while IFS= read -r item; do
            image="$(jq -r '.image' <<<"$item")"
            tag="$(jq -r '.tag' <<<"$item")"
            expected='${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/'"${image}:${tag}"
            dockerfile_expected='${ANAS_IMAGE_REGISTRY}/'"${image}:${tag}"
            while IFS= read -r module; do
              if grep -Fq "image: ${expected}" "modules/${module}/docker-compose.yml"; then
                continue
              fi
              if mirror_is_dockerfile_base "$module" "$dockerfile_expected"; then
                continue
              fi
              echo "${module} must reference ${expected} as a Compose image or ${dockerfile_expected} in a registered Dockerfile FROM" >&2
              exit 1
            done < <(jq -r '.modules[]' <<<"$item")
          done < <(jq -c '.[]' .github/mirrors.json)

          changed=''
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          selected='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              selected="$(jq -c '.' .github/images.json)"
            else
              selected="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.module == $module)]' .github/images.json)"
            fi
          elif [[ "$FIRST_RELEASE" == "true" ]]; then
            selected="$(jq -c '.' .github/images.json)"
          else
            release_modules='[]'
            while IFS=$'\t' read -r module release reason; do
              if [[ "$reason" != "unchanged" ]]; then
                release_modules="$(jq -c --arg module "$module" '. + [$module] | unique' <<<"$release_modules")"
              fi
            done < <(bash scripts/ci/module-revisions.sh --base "$BASE_SHA" --print)
            selected="$(jq -c --argjson modules "$release_modules" '[.[] | select(.module as $module | $modules | index($module))]' .github/images.json)"
          fi

          enriched='[]'
          while IFS= read -r item; do
            module="$(jq -r '.module' <<<"$item")"
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            if [[ -z "$version" || ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
              echo "$manifest must contain a version and a positive integer revision" >&2
              exit 1
            fi

            previous_version="$(git show "${BASE_SHA}:${manifest}" 2>/dev/null | awk '$1 == "version:" { print $2; exit }')"
            previous_revision="$(git show "${BASE_SHA}:${manifest}" 2>/dev/null | awk '$1 == "revision:" { print $2; exit }')"
            previous_tag=''
            if [[ -n "$previous_version" && "$previous_revision" =~ ^[1-9][0-9]*$ ]]; then
              previous_tag="${previous_version}-r${previous_revision}"
            fi

            build_required=false
            context="$(jq -r '.context' <<<"$item")"
            image="$(jq -r '.image' <<<"$item")"
            before_entry="$(git show "${BASE_SHA}:.github/images.json" 2>/dev/null | jq -cS --arg image "$image" '.[] | select(.image == $image)' 2>/dev/null || true)"
            after_entry="$(jq -cS --arg image "$image" '.[] | select(.image == $image)' .github/images.json)"
            if [[ "$FIRST_RELEASE" == "true" || -z "$previous_tag" || "$previous_version" != "$version" || "$before_entry" != "$after_entry" ]] ||
               ! git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- "$context"; then
              build_required=true
            fi

            item="$(jq -c \
              --arg version "$version" \
              --argjson revision "$revision" \
              --arg tag "${version}-r${revision}" \
              --arg previous_tag "$previous_tag" \
              --argjson build_required "$build_required" \
              '. + {version: $version, revision: $revision, tag: $tag, previous_tag: $previous_tag, build_required: $build_required}' \
              <<<"$item")"
            enriched="$(jq -c --argjson item "$item" '. + [$item]' <<<"$enriched")"
          done < <(jq -c '.[]' <<<"$selected")

          mirror_selected='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              mirror_selected="$(jq -c '.' .github/mirrors.json)"
            else
              mirror_selected="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.modules | index($module))]' .github/mirrors.json)"
            fi
          elif [[ "$FIRST_RELEASE" == "true" ]]; then
            mirror_selected="$(jq -c '.' .github/mirrors.json)"
          else
            if grep -Eq '^(\.github/mirrors\.json|\.github/workflows/container-images\.yml|scripts/ci/(runtime-image|install-crane)\.sh)$' <<<"$changed"; then
              mirror_selected="$(jq -c '.' .github/mirrors.json)"
            else
              mirror_selected="$(jq -c --argjson modules "$release_modules" '[.[] | select(any(.modules[]; . as $module | $modules | index($module)))]' .github/mirrors.json)"
            fi
          fi

          matrix="$(jq -c '{include: .}' <<<"$enriched")"
          mirror_matrix="$(jq -c '{include: .}' <<<"$mirror_selected")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$enriched")" >>"$GITHUB_OUTPUT"
          echo "mirror_matrix=$mirror_matrix" >>"$GITHUB_OUTPUT"
          echo "mirror_count=$(jq 'length' <<<"$mirror_selected")" >>"$GITHUB_OUTPUT"

      - name: Select Module packages
        id: packages
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          first_package_release=true
          while IFS= read -r candidate; do
            if git merge-base --is-ancestor "$candidate" HEAD; then
              first_package_release=false
              break
            fi
          done < <(git for-each-ref --sort=-version:refname --format='%(refname:short)' 'refs/tags/module-release/*')

          selected_modules='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              selected_modules="$(jq -c '[.[].module]' .github/modules.json)"
            else
              selected_modules="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.module == $module) | .module]' .github/modules.json)"
            fi
          elif [[ "$first_package_release" == true ]]; then
            selected_modules="$(jq -c '[.[].module]' .github/modules.json)"
          else
            while IFS=$'\t' read -r module release reason; do
              if [[ "$reason" != "unchanged" ]]; then
                selected_modules="$(jq -c --arg module "$module" '. + [$module] | unique' <<<"$selected_modules")"
              fi
            done < <(bash scripts/ci/module-revisions.sh --base "$BASE_SHA" --print)
          fi

          selected="$(jq -c --argjson modules "$selected_modules" '[.[] | select(.module as $module | $modules | index($module))]' .github/modules.json)"
          enriched='[]'
          while IFS= read -r item; do
            module="$(jq -r '.module' <<<"$item")"
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            item="$(jq -c --arg version "$version" --argjson revision "$revision" --arg tag "${version}-r${revision}" '. + {version: $version, revision: $revision, tag: $tag}' <<<"$item")"
            enriched="$(jq -c --argjson item "$item" '. + [$item]' <<<"$enriched")"
          done < <(jq -c '.[]' <<<"$selected")

          echo "matrix=$(jq -c '{include: .}' <<<"$enriched")" >>"$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$enriched")" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Install crane
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash scripts/ci/install-crane.sh "$RUNNER_TEMP/anas-bin"
          echo "$RUNNER_TEMP/anas-bin" >>"$GITHUB_PATH"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Inspect release state
        id: release_state
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
          PREVIOUS_GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.previous_tag }}
          PREVIOUS_CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.previous_tag }}
          BUILD_REQUIRED: ${{ matrix.build_required }}
          CURRENT_TAG: ${{ matrix.tag }}
          PREVIOUS_TAG: ${{ matrix.previous_tag }}
        run: |
          set -euo pipefail

          ghcr_exists=false
          cnb_exists=false
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1 && ghcr_exists=true
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null 2>&1 && cnb_exists=true

          if [[ "$ghcr_exists" == true && "$cnb_exists" == true ]]; then
            mode=complete
          elif [[ "$ghcr_exists" == true ]]; then
            mode=mirror_to_cnb
          elif [[ "$cnb_exists" == true ]]; then
            mode=mirror_to_ghcr
          elif [[ "$BUILD_REQUIRED" != "true" && -n "$PREVIOUS_TAG" && "$PREVIOUS_TAG" != "$CURRENT_TAG" ]] &&
               docker buildx imagetools inspect "$PREVIOUS_GHCR_IMAGE" >/dev/null 2>&1; then
            mode=reuse_previous_ghcr
          elif [[ "$BUILD_REQUIRED" != "true" && -n "$PREVIOUS_TAG" && "$PREVIOUS_TAG" != "$CURRENT_TAG" ]] &&
               docker buildx imagetools inspect "$PREVIOUS_CNB_IMAGE" >/dev/null 2>&1; then
            mode=reuse_previous_cnb
          else
            mode=build
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Release state: GHCR=$ghcr_exists CNB=$cnb_exists mode=$mode"

      - name: Mirror the existing CNB image to GHCR
        if: steps.release_state.outputs.mode == 'mirror_to_ghcr'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$CNB_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Re-tag the previous GHCR image for a metadata-only Module release
        if: steps.release_state.outputs.mode == 'reuse_previous_ghcr'
        env:
          SOURCE_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.previous_tag }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$SOURCE_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Restore and re-tag the previous CNB image for a metadata-only Module release
        if: steps.release_state.outputs.mode == 'reuse_previous_cnb'
        env:
          SOURCE_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.previous_tag }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$SOURCE_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Build and publish
        if: (github.event_name == 'pull_request' && matrix.build_required == true) || steps.release_state.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
            dev.anas.module=${{ matrix.module }}
            dev.anas.module.revision=${{ matrix.revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Mirror the GHCR runtime image to CNB
        if: steps.release_state.outputs.mode == 'mirror_to_cnb' || steps.release_state.outputs.mode == 'build' || steps.release_state.outputs.mode == 'reuse_previous_ghcr' || steps.release_state.outputs.mode == 'reuse_previous_cnb'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$GHCR_IMAGE" "$CNB_IMAGE" "${{ matrix.platforms }}"

      - name: Verify the published release
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null

      # Reporting only, and deliberately after publish rather than before: the
      # image this scans is the one that shipped, and a scanner failure must not
      # be able to abort a release. See scripts/ci/scan-image.sh for the switch
      # that turns it into a gate.
      - name: Scan the published image for known vulnerabilities
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/scan-image.sh "$GHCR_IMAGE"

  mirror:
    needs: prepare
    if: needs.prepare.outputs.mirror_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.mirror_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Install crane
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash scripts/ci/install-crane.sh "$RUNNER_TEMP/anas-bin"
          echo "$RUNNER_TEMP/anas-bin" >>"$GITHUB_PATH"

      - name: Validate the pinned upstream manifest
        env:
          SOURCE_IMAGE: ${{ matrix.source }}@${{ matrix.digest }}
        run: bash scripts/ci/runtime-image.sh validate "$SOURCE_IMAGE" "${{ matrix.platforms }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Inspect mirror state
        id: mirror_state
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          ghcr_exists=false
          cnb_exists=false
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1 && ghcr_exists=true
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null 2>&1 && cnb_exists=true
          if [[ "$ghcr_exists" == true && "$cnb_exists" == true ]]; then
            mode=complete
          elif [[ "$ghcr_exists" == true ]]; then
            mode=mirror_to_cnb
          elif [[ "$cnb_exists" == true ]]; then
            mode=mirror_to_ghcr
          else
            mode=publish
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Mirror state: GHCR=$ghcr_exists CNB=$cnb_exists mode=$mode"

      - name: Restore GHCR from CNB
        if: steps.mirror_state.outputs.mode == 'mirror_to_ghcr'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$CNB_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Publish pinned upstream image to GHCR
        if: steps.mirror_state.outputs.mode == 'publish'
        env:
          SOURCE_IMAGE: ${{ matrix.source }}@${{ matrix.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$SOURCE_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Publish mirror to CNB
        if: steps.mirror_state.outputs.mode == 'publish' || steps.mirror_state.outputs.mode == 'mirror_to_cnb'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$GHCR_IMAGE" "$CNB_IMAGE" "${{ matrix.platforms }}"

      - name: Verify published mirrors
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          bash scripts/ci/runtime-image.sh validate "$GHCR_IMAGE" "${{ matrix.platforms }}"
          bash scripts/ci/runtime-image.sh validate "$CNB_IMAGE" "${{ matrix.platforms }}"

      # Reporting only, and deliberately after publish rather than before: the
      # image this scans is the one that shipped, and a scanner failure must not
      # be able to abort a release. See scripts/ci/scan-image.sh for the switch
      # that turns it into a gate.
      - name: Scan the published image for known vulnerabilities
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/scan-image.sh "$GHCR_IMAGE"

  package:
    needs: [prepare, build, mirror]
    if: |
      always() &&
      needs.prepare.outputs.package_count != '0' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          # Candidate metadata is calculated against the previous successful
          # release commit, so the package job needs that history locally.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize candidate revision metadata
        if: github.event_name == 'pull_request'
        run: bash scripts/ci/module-revisions.sh --base "${{ needs.prepare.outputs.base_sha }}" --write

      - name: Build the reproducible Module bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./cmd/package-module \
            --module "${{ matrix.module }}" \
            --platform all \
            --output "dist/${{ matrix.module }}-${{ matrix.tag }}.tar.gz"

      - name: Upload pull-request validation bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: anas-module-${{ matrix.module }}-${{ matrix.tag }}
          path: dist/${{ matrix.module }}-${{ matrix.tag }}.tar.gz
          if-no-files-found: error

      - uses: oras-project/setup-oras@v2.0.1
        if: github.event_name != 'pull_request'
        with:
          version: 1.3.2

      - name: Log in to Module registries
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_REGISTRY_TOKEN: ${{ secrets.CNB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          printf '%s' "$CNB_REGISTRY_TOKEN" | oras login docker.cnb.cool --username cnb --password-stdin

      - name: Publish immutable Module artifact to GHCR and CNB
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GHCR_REF: ghcr.io/${{ github.repository_owner }}/${{ matrix.repository }}:${{ matrix.tag }}
          CNB_REF: docker.cnb.cool/anas.dev/anas/${{ matrix.repository }}:${{ matrix.tag }}
          BUNDLE: dist/${{ matrix.module }}-${{ matrix.tag }}.tar.gz
        run: |
          set -euo pipefail

          ghcr_exists=false
          cnb_exists=false
          oras manifest fetch "$GHCR_REF" >/dev/null 2>&1 && ghcr_exists=true
          oras manifest fetch "$CNB_REF" >/dev/null 2>&1 && cnb_exists=true

          if [[ "$ghcr_exists" == false && "$cnb_exists" == false ]]; then
            oras push \
              --artifact-type application/vnd.anas.module.v1 \
              --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}" \
              --annotation "org.opencontainers.image.version=${{ matrix.tag }}" \
              --annotation "dev.anas.module=${{ matrix.module }}" \
              "$GHCR_REF" \
              "$BUNDLE:application/vnd.anas.module.bundle.v1.tar+gzip"
            oras cp "$GHCR_REF" "$CNB_REF"
          elif [[ "$ghcr_exists" == true && "$cnb_exists" == false ]]; then
            oras cp "$GHCR_REF" "$CNB_REF"
          elif [[ "$ghcr_exists" == false && "$cnb_exists" == true ]]; then
            oras cp "$CNB_REF" "$GHCR_REF"
          fi

          for ref in "$GHCR_REF" "$CNB_REF"; do
            oras manifest fetch "$ref" |
              jq -e '
                .artifactType == "application/vnd.anas.module.v1" and
                (.layers | length == 1) and
                .layers[0].mediaType == "application/vnd.anas.module.bundle.v1.tar+gzip"
              ' >/dev/null
          done
          ghcr_digest="$(oras resolve "$GHCR_REF")"
          cnb_digest="$(oras resolve "$CNB_REF")"
          if [[ "$ghcr_digest" != "$cnb_digest" ]]; then
            echo "Module artifact digest mismatch: GHCR=$ghcr_digest CNB=$cnb_digest" >&2
            exit 1
          fi

  catalog:
    needs: [prepare, package]
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      needs.prepare.outputs.finalize == 'true' &&
      needs.prepare.outputs.package_count != '0' &&
      needs.prepare.result == 'success' &&
      needs.package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: oras-project/setup-oras@v2.0.1
        with:
          version: 1.3.2

      - name: Build Module discovery catalog
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          modules='[]'
          while IFS= read -r item; do
            module="$(jq -r '.module' <<<"$item")"
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            item="$(jq -c --arg release "${version}-r${revision}" '. + {release: $release}' <<<"$item")"
            modules="$(jq -c --argjson item "$item" '. + [$item]' <<<"$modules")"
          done < <(jq -c '.[]' .github/modules.json)
          jq -n \
            --arg api_version anas.module-catalog/v1 \
            --arg source_commit "$RELEASE_SHA" \
            --argjson modules "$modules" \
            '{api_version: $api_version, source_commit: $source_commit, modules: $modules}' \
            >module-catalog.json

      - name: Log in to catalog registries
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CNB_REGISTRY_TOKEN: ${{ secrets.CNB_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          printf '%s' "$CNB_REGISTRY_TOKEN" | oras login docker.cnb.cool --username cnb --password-stdin

      - name: Publish immutable catalog and move the discovery pointer
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          GHCR_REPOSITORY: ghcr.io/${{ github.repository_owner }}/anas-module-catalog
          CNB_REPOSITORY: docker.cnb.cool/anas.dev/anas/anas-module-catalog
        run: |
          set -euo pipefail
          immutable_tag="sha-${RELEASE_SHA}"
          ghcr_immutable="${GHCR_REPOSITORY}:${immutable_tag}"
          cnb_immutable="${CNB_REPOSITORY}:${immutable_tag}"

          if ! oras manifest fetch "$ghcr_immutable" >/dev/null 2>&1; then
            oras push \
              --artifact-type application/vnd.anas.module.catalog.v1 \
              --annotation "org.opencontainers.image.revision=${RELEASE_SHA}" \
              "$ghcr_immutable" \
              module-catalog.json:application/vnd.anas.module.catalog.v1+json
          fi
          if ! oras manifest fetch "$cnb_immutable" >/dev/null 2>&1; then
            oras cp "$ghcr_immutable" "$cnb_immutable"
          fi

          for ref in "$ghcr_immutable" "$cnb_immutable"; do
            oras manifest fetch "$ref" |
              jq -e '
                .artifactType == "application/vnd.anas.module.catalog.v1" and
                (.layers | length == 1) and
                .layers[0].mediaType == "application/vnd.anas.module.catalog.v1+json"
              ' >/dev/null
          done

          oras tag "$ghcr_immutable" stable
          oras tag "$cnb_immutable" stable
          ghcr_digest="$(oras resolve "${GHCR_REPOSITORY}:stable")"
          cnb_digest="$(oras resolve "${CNB_REPOSITORY}:stable")"
          if [[ "$ghcr_digest" != "$cnb_digest" ]]; then
            echo "Module catalog digest mismatch: GHCR=$ghcr_digest CNB=$cnb_digest" >&2
            exit 1
          fi

  finalize:
    needs: [prepare, build, mirror, package, catalog]
    if: |
      always() &&
      needs.prepare.outputs.finalize == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped') &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      (needs.catalog.result == 'success' || needs.catalog.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Record the successful release
        id: release_tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          PACKAGE_MATRIX: ${{ needs.prepare.outputs.package_matrix }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          image_release_tag="image-release/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          module_release_tag="module-release/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$image_release_tag" "$RELEASE_SHA" -m "Successful container release at $RELEASE_SHA"
          git tag -a "$module_release_tag" "$RELEASE_SHA" -m "Successful Module release at $RELEASE_SHA"

          tag_refs=(
            "refs/tags/${image_release_tag}:refs/tags/${image_release_tag}"
            "refs/tags/${module_release_tag}:refs/tags/${module_release_tag}"
          )
          while IFS=$'\t' read -r module tag; do
            [[ -z "$module" ]] && continue
            module_tag="module/${module}/${tag}"
            if git rev-parse --verify --quiet "refs/tags/${module_tag}" >/dev/null; then
              existing_sha="$(git rev-list -n1 "$module_tag")"
              if [[ "$existing_sha" != "$RELEASE_SHA" ]]; then
                echo "Immutable Module tag $module_tag already points to $existing_sha" >&2
                exit 1
              fi
            else
              git tag -a "$module_tag" "$RELEASE_SHA" -m "Module ${module} ${tag}"
            fi
            tag_refs+=("refs/tags/${module_tag}:refs/tags/${module_tag}")
          done < <(jq -r '.include[] | [.module, .tag] | @tsv' <<<"$PACKAGE_MATRIX")

          git push --atomic origin "${tag_refs[@]}"
          echo "image_release_tag=$image_release_tag" >>"$GITHUB_OUTPUT"
          echo "module_release_tag=$module_release_tag" >>"$GITHUB_OUTPUT"

      - name: Fast-forward master when the release branch is unchanged
        id: sync_master
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/image-release:refs/remotes/origin/image-release' '+refs/heads/master:refs/remotes/origin/master'
          release_head="$(git rev-parse refs/remotes/origin/image-release)"
          if [[ "$release_head" != "$RELEASE_SHA" ]]; then
            echo "image-release advanced to $release_head while $RELEASE_SHA was building; the queued release will synchronize master"
            echo "branches_synced=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          master_head="$(git rev-parse refs/remotes/origin/master)"
          if ! git merge-base --is-ancestor "$master_head" "$RELEASE_SHA"; then
            echo "master advanced independently; merge master into image-release before synchronizing it back" >&2
            exit 1
          fi
          git push origin "$RELEASE_SHA:refs/heads/master"
          echo "branches_synced=true" >>"$GITHUB_OUTPUT"

      - name: Synchronize released refs to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          IMAGE_RELEASE_TAG: ${{ steps.release_tag.outputs.image_release_tag }}
          MODULE_RELEASE_TAG: ${{ steps.release_tag.outputs.module_release_tag }}
          BRANCHES_SYNCED: ${{ steps.sync_master.outputs.branches_synced }}
        run: |
          set -euo pipefail
          if [[ -z "$CNB_TOKEN" ]]; then
            echo "Repository secret CNB_TOKEN is required" >&2
            exit 1
          fi
          printf 'machine cnb.cool\nlogin cnb\npassword %s\n' "$CNB_TOKEN" >"$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git remote add cnb https://cnb.cool/anas.dev/ANAS.git
          tag_refs=(
            "refs/tags/${IMAGE_RELEASE_TAG}:refs/tags/${IMAGE_RELEASE_TAG}"
            "refs/tags/${MODULE_RELEASE_TAG}:refs/tags/${MODULE_RELEASE_TAG}"
          )
          while IFS= read -r module_tag; do
            [[ -z "$module_tag" ]] && continue
            if [[ "$(git rev-list -n1 "$module_tag")" == "$RELEASE_SHA" ]]; then
              tag_refs+=("refs/tags/${module_tag}:refs/tags/${module_tag}")
            fi
          done < <(git for-each-ref --format='%(refname:short)' 'refs/tags/module/*')
          git push --atomic cnb "${tag_refs[@]}"
          if [[ "$BRANCHES_SYNCED" == "true" ]]; then
            git push cnb \
              "$RELEASE_SHA:refs/heads/image-release" \
              "$RELEASE_SHA:refs/heads/master"
          fi
