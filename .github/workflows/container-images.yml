name: Container images

on:
  pull_request:
    branches: [image-release]
    paths:
      - ".github/images.json"
      - ".github/mirrors.json"
      - ".github/workflows/container-images.yml"
      - "scripts/ci/runtime-image.sh"
      - "scripts/ci/install-crane.sh"
      - "scripts/ci/module-revisions.sh"
      - "scripts/ci/module-revisions-test.sh"
      - "modules/**"
  push:
    branches: [image-release]
    paths:
      - ".github/images.json"
      - ".github/mirrors.json"
      - ".github/workflows/container-images.yml"
      - "scripts/ci/runtime-image.sh"
      - "scripts/ci/install-crane.sh"
      - "scripts/ci/module-revisions.sh"
      - "scripts/ci/module-revisions-test.sh"
      - "modules/**"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish, or all for the initial release"
        required: true
        default: all

permissions:
  contents: write
  packages: write

concurrency:
  group: container-images-${{ github.event.pull_request.number || 'image-release' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      mirror_matrix: ${{ steps.matrix.outputs.mirror_matrix }}
      mirror_count: ${{ steps.matrix.outputs.mirror_count }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      base_sha: ${{ steps.release.outputs.base_sha }}
      first_release: ${{ steps.release.outputs.first_release }}
      finalize: ${{ steps.release.outputs.finalize }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test revision calculator
        run: bash scripts/ci/module-revisions-test.sh

      - name: Calculate and commit release revisions
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          release_branch=image-release
          first_release=false
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            if [[ "$REF_NAME" != "$release_branch" ]]; then
              echo "Container releases must run from the $release_branch branch" >&2
              exit 1
            fi

            last_release_tag=''
            while IFS= read -r candidate; do
              if git merge-base --is-ancestor "$candidate" HEAD; then
                last_release_tag="$candidate"
                break
              fi
            done < <(git for-each-ref --sort=-version:refname --format='%(refname:short)' 'refs/tags/image-release/*')

            if [[ -n "$last_release_tag" ]]; then
              base_sha="$(git rev-list -n1 "$last_release_tag")"
              echo "Using successful release $last_release_tag at $base_sha"
            else
              first_release=true
              zero_sha=0000000000000000000000000000000000000000
              if [[ "$EVENT_NAME" == "push" && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "$zero_sha" ]] &&
                 git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
                base_sha="$EVENT_BEFORE"
              else
                base_sha="$(git rev-parse HEAD)"
              fi
              echo "No successful image-release tag exists; using $base_sha as the bootstrap base"
            fi
          fi

          if ! git merge-base --is-ancestor "$base_sha" HEAD; then
            echo "Release base $base_sha is not an ancestor of HEAD" >&2
            exit 1
          fi

          bash scripts/ci/module-revisions.sh --base "$base_sha" --write

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            while IFS= read -r module; do
              git add -- "modules/${module}/module.yml" "modules/${module}/docker-compose.yml"
              if [[ -f "modules/${module}/localization.yml" ]]; then
                git add -- "modules/${module}/localization.yml"
              fi
            done < <(jq -r '.[].module' .github/images.json | LC_ALL=C sort -u)

            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m "chore(images): calculate release revisions"
              git push origin HEAD:refs/heads/image-release
            fi
          fi

          release_sha="$(git rev-parse HEAD)"
          finalize=false
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "workflow_dispatch" && ( -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ) ) ]]; then
            finalize=true
          fi
          echo "base_sha=$base_sha" >>"$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >>"$GITHUB_OUTPUT"
          echo "first_release=$first_release" >>"$GITHUB_OUTPUT"
          echo "finalize=$finalize" >>"$GITHUB_OUTPUT"

      - name: Select images
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.release.outputs.base_sha }}
          HEAD_SHA: ${{ steps.release.outputs.release_sha }}
          FIRST_RELEASE: ${{ steps.release.outputs.first_release }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          jq -e 'type == "array" and length > 0' .github/images.json >/dev/null
          actual="$(find modules -type f -name Dockerfile | LC_ALL=C sort)"
          registered="$(jq -r '.[].dockerfile' .github/images.json | LC_ALL=C sort)"
          if ! diff -u <(printf '%s\n' "$actual") <(printf '%s\n' "$registered"); then
            echo "Every Dockerfile must appear exactly once in .github/images.json" >&2
            exit 1
          fi

          while IFS=$'\t' read -r module image; do
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            expected='${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/'"${image}:${version}-r${revision}"
            if ! grep -Fq "image: ${expected}" "modules/${module}/docker-compose.yml"; then
              echo "${module}/docker-compose.yml must reference ${expected}" >&2
              exit 1
            fi
          done < <(jq -r '.[] | [.module, .image] | @tsv' .github/images.json)

          jq -e '
            type == "array" and length > 0 and
            all(.[ ];
              (.modules | type == "array" and length > 0) and
              (.image | test("^anas-mirror-[a-z0-9-]+$")) and
              (.tag | type == "string" and length > 0 and . != "latest") and
              (.source | type == "string" and length > 0) and
              (.digest | test("^sha256:[0-9a-f]{64}$")) and
              (.platforms | test("^linux/(amd64|arm64)(,linux/(amd64|arm64))*$"))
            ) and
            ([.[].image] | length == (unique | length))
          ' .github/mirrors.json >/dev/null
          while IFS= read -r item; do
            image="$(jq -r '.image' <<<"$item")"
            tag="$(jq -r '.tag' <<<"$item")"
            expected='${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/'"${image}:${tag}"
            while IFS= read -r module; do
              if ! grep -Fq "image: ${expected}" "modules/${module}/docker-compose.yml"; then
                echo "${module}/docker-compose.yml must reference ${expected}" >&2
                exit 1
              fi
            done < <(jq -r '.modules[]' <<<"$item")
          done < <(jq -c '.[]' .github/mirrors.json)

          changed=''
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          selected='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              selected="$(jq -c '.' .github/images.json)"
            else
              selected="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.module == $module)]' .github/images.json)"
            fi
          elif [[ "$FIRST_RELEASE" == "true" ]]; then
            selected="$(jq -c '.' .github/images.json)"
          else
            changed_modules='[]'
            while IFS= read -r context; do
              if grep -q "^${context}/" <<<"$changed"; then
                module="$(jq -r --arg context "$context" '.[] | select(.context == $context) | .module' .github/images.json)"
                changed_modules="$(jq -c --arg module "$module" '. + [$module] | unique' <<<"$changed_modules")"
              fi
            done < <(jq -r '.[].context' .github/images.json)
            if grep -Eq '^(\.github/images\.json|\.github/workflows/container-images\.yml|scripts/ci/(runtime-image|install-crane)\.sh)$' <<<"$changed"; then
              selected="$(jq -c '.' .github/images.json)"
            else
              selected="$(jq -c --argjson modules "$changed_modules" '[.[] | select(.module as $module | $modules | index($module))]' .github/images.json)"
            fi
          fi

          enriched='[]'
          while IFS= read -r item; do
            module="$(jq -r '.module' <<<"$item")"
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            if [[ -z "$version" || ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
              echo "$manifest must contain a version and a positive integer revision" >&2
              exit 1
            fi
            item="$(jq -c --arg version "$version" --argjson revision "$revision" --arg tag "${version}-r${revision}" '. + {version: $version, revision: $revision, tag: $tag}' <<<"$item")"
            enriched="$(jq -c --argjson item "$item" '. + [$item]' <<<"$enriched")"
          done < <(jq -c '.[]' <<<"$selected")

          mirror_selected='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              mirror_selected="$(jq -c '.' .github/mirrors.json)"
            else
              mirror_selected="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.modules | index($module))]' .github/mirrors.json)"
              if [[ "$(jq 'length' <<<"$selected")" == "0" && "$(jq 'length' <<<"$mirror_selected")" == "0" ]]; then
                echo "Unknown or image-less module: $REQUESTED_MODULE" >&2
                exit 1
              fi
            fi
          elif [[ "$FIRST_RELEASE" == "true" ]]; then
            mirror_selected="$(jq -c '.' .github/mirrors.json)"
          else
            if grep -Eq '^(\.github/mirrors\.json|\.github/workflows/container-images\.yml|scripts/ci/(runtime-image|install-crane)\.sh)$' <<<"$changed"; then
              mirror_selected="$(jq -c '.' .github/mirrors.json)"
            else
              changed_runtime_modules="$(awk -F/ '$1 == "modules" {print $2}' <<<"$changed" | LC_ALL=C sort -u | jq -Rsc 'split("\n") | map(select(length > 0))')"
              mirror_selected="$(jq -c --argjson modules "$changed_runtime_modules" '[.[] | select(any(.modules[]; . as $module | $modules | index($module)))]' .github/mirrors.json)"
            fi
          fi

          matrix="$(jq -c '{include: .}' <<<"$enriched")"
          mirror_matrix="$(jq -c '{include: .}' <<<"$mirror_selected")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$enriched")" >>"$GITHUB_OUTPUT"
          echo "mirror_matrix=$mirror_matrix" >>"$GITHUB_OUTPUT"
          echo "mirror_count=$(jq 'length' <<<"$mirror_selected")" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Install crane
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash scripts/ci/install-crane.sh "$RUNNER_TEMP/anas-bin"
          echo "$RUNNER_TEMP/anas-bin" >>"$GITHUB_PATH"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Inspect release state
        id: release_state
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail

          ghcr_exists=false
          cnb_exists=false
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1 && ghcr_exists=true
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null 2>&1 && cnb_exists=true

          if [[ "$ghcr_exists" == true && "$cnb_exists" == true ]]; then
            mode=complete
          elif [[ "$ghcr_exists" == true ]]; then
            mode=mirror_to_cnb
          elif [[ "$cnb_exists" == true ]]; then
            mode=mirror_to_ghcr
          else
            mode=build
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Release state: GHCR=$ghcr_exists CNB=$cnb_exists mode=$mode"

      - name: Mirror the existing CNB image to GHCR
        if: steps.release_state.outputs.mode == 'mirror_to_ghcr'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$CNB_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Build and publish
        if: github.event_name == 'pull_request' || steps.release_state.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
            dev.anas.module=${{ matrix.module }}
            dev.anas.module.revision=${{ matrix.revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Mirror the GHCR runtime image to CNB
        if: steps.release_state.outputs.mode == 'mirror_to_cnb' || steps.release_state.outputs.mode == 'build'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$GHCR_IMAGE" "$CNB_IMAGE" "${{ matrix.platforms }}"

      - name: Verify the published release
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null

  mirror:
    needs: prepare
    if: needs.prepare.outputs.mirror_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.mirror_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Install crane
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash scripts/ci/install-crane.sh "$RUNNER_TEMP/anas-bin"
          echo "$RUNNER_TEMP/anas-bin" >>"$GITHUB_PATH"

      - name: Validate the pinned upstream manifest
        env:
          SOURCE_IMAGE: ${{ matrix.source }}@${{ matrix.digest }}
        run: bash scripts/ci/runtime-image.sh validate "$SOURCE_IMAGE" "${{ matrix.platforms }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Inspect mirror state
        id: mirror_state
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          ghcr_exists=false
          cnb_exists=false
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1 && ghcr_exists=true
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null 2>&1 && cnb_exists=true
          if [[ "$ghcr_exists" == true && "$cnb_exists" == true ]]; then
            mode=complete
          elif [[ "$ghcr_exists" == true ]]; then
            mode=mirror_to_cnb
          elif [[ "$cnb_exists" == true ]]; then
            mode=mirror_to_ghcr
          else
            mode=publish
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Mirror state: GHCR=$ghcr_exists CNB=$cnb_exists mode=$mode"

      - name: Restore GHCR from CNB
        if: steps.mirror_state.outputs.mode == 'mirror_to_ghcr'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$CNB_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Publish pinned upstream image to GHCR
        if: steps.mirror_state.outputs.mode == 'publish'
        env:
          SOURCE_IMAGE: ${{ matrix.source }}@${{ matrix.digest }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$SOURCE_IMAGE" "$GHCR_IMAGE" "${{ matrix.platforms }}"

      - name: Publish mirror to CNB
        if: steps.mirror_state.outputs.mode == 'publish' || steps.mirror_state.outputs.mode == 'mirror_to_cnb'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: bash scripts/ci/runtime-image.sh copy "$GHCR_IMAGE" "$CNB_IMAGE" "${{ matrix.platforms }}"

      - name: Verify published mirrors
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          bash scripts/ci/runtime-image.sh validate "$GHCR_IMAGE" "${{ matrix.platforms }}"
          bash scripts/ci/runtime-image.sh validate "$CNB_IMAGE" "${{ matrix.platforms }}"

  finalize:
    needs: [prepare, build, mirror]
    if: |
      always() &&
      needs.prepare.outputs.finalize == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.mirror.result == 'success' || needs.mirror.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Record the successful release
        id: release_tag
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          release_tag="image-release/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          git tag -a "$release_tag" "$RELEASE_SHA" -m "Successful container release at $RELEASE_SHA"
          git push origin "refs/tags/${release_tag}:refs/tags/${release_tag}"
          echo "release_tag=$release_tag" >>"$GITHUB_OUTPUT"

      - name: Fast-forward master when the release branch is unchanged
        id: sync_master
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/image-release:refs/remotes/origin/image-release' '+refs/heads/master:refs/remotes/origin/master'
          release_head="$(git rev-parse refs/remotes/origin/image-release)"
          if [[ "$release_head" != "$RELEASE_SHA" ]]; then
            echo "image-release advanced to $release_head while $RELEASE_SHA was building; the queued release will synchronize master"
            echo "branches_synced=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          master_head="$(git rev-parse refs/remotes/origin/master)"
          if ! git merge-base --is-ancestor "$master_head" "$RELEASE_SHA"; then
            echo "master advanced independently; merge master into image-release before synchronizing it back" >&2
            exit 1
          fi
          git push origin "$RELEASE_SHA:refs/heads/master"
          echo "branches_synced=true" >>"$GITHUB_OUTPUT"

      - name: Synchronize released refs to CNB
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.release_tag }}
          BRANCHES_SYNCED: ${{ steps.sync_master.outputs.branches_synced }}
        run: |
          set -euo pipefail
          if [[ -z "$CNB_TOKEN" ]]; then
            echo "Repository secret CNB_TOKEN is required" >&2
            exit 1
          fi
          printf 'machine cnb.cool\nlogin cnb\npassword %s\n' "$CNB_TOKEN" >"$HOME/.netrc"
          chmod 600 "$HOME/.netrc"
          git remote add cnb https://cnb.cool/anas.dev/ANAS.git
          git push cnb "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [[ "$BRANCHES_SYNCED" == "true" ]]; then
            git push cnb \
              "$RELEASE_SHA:refs/heads/image-release" \
              "$RELEASE_SHA:refs/heads/master"
          fi
