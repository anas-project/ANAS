name: Container images

on:
  pull_request:
    paths:
      - ".github/images.json"
      - ".github/workflows/container-images.yml"
      - "modules/**"
  push:
    branches: [master]
    paths:
      - ".github/images.json"
      - ".github/workflows/container-images.yml"
      - "modules/**"
  workflow_dispatch:
    inputs:
      module:
        description: "Module to publish, or all for the initial release"
        required: true
        default: all

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select images
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          set -euo pipefail

          jq -e 'type == "array" and length > 0' .github/images.json >/dev/null
          actual="$(find modules -type f -name Dockerfile | LC_ALL=C sort)"
          registered="$(jq -r '.[].dockerfile' .github/images.json | LC_ALL=C sort)"
          if ! diff -u <(printf '%s\n' "$actual") <(printf '%s\n' "$registered"); then
            echo "Every Dockerfile must appear exactly once in .github/images.json" >&2
            exit 1
          fi

          while IFS=$'\t' read -r module image; do
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            expected='${ANAS_IMAGE_REGISTRY:-ghcr.io/anas-project}/'"${image}:${version}-r${revision}"
            if ! grep -Fq "image: ${expected}" "modules/${module}/docker-compose.yml"; then
              echo "${module}/docker-compose.yml must reference ${expected}" >&2
              exit 1
            fi
          done < <(jq -r '.[] | [.module, .image] | @tsv' .github/images.json)

          selected='[]'
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$REQUESTED_MODULE" || "$REQUESTED_MODULE" == "all" ]]; then
              selected="$(jq -c '.' .github/images.json)"
            else
              selected="$(jq -c --arg module "$REQUESTED_MODULE" '[.[] | select(.module == $module)]' .github/images.json)"
              if [[ "$(jq 'length' <<<"$selected")" == "0" ]]; then
                echo "Unknown or image-less module: $REQUESTED_MODULE" >&2
                exit 1
              fi
            fi
          else
            changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
            changed_modules='[]'
            while IFS= read -r context; do
              if grep -q "^${context}/" <<<"$changed"; then
                module="$(jq -r --arg context "$context" '.[] | select(.context == $context) | .module' .github/images.json)"
                changed_modules="$(jq -c --arg module "$module" '. + [$module] | unique' <<<"$changed_modules")"
              fi
            done < <(jq -r '.[].context' .github/images.json)
            selected="$(jq -c --argjson modules "$changed_modules" '[.[] | select(.module as $module | $modules | index($module))]' .github/images.json)"
          fi

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            while IFS= read -r module; do
              manifest="modules/${module}/module.yml"
              if ! old_manifest="$(git show "${BASE_SHA}:${manifest}" 2>/dev/null)"; then
                continue
              fi
              old_version="$(awk '$1 == "version:" { print $2; exit }' <<<"$old_manifest")"
              old_revision="$(awk '$1 == "revision:" { print $2; exit }' <<<"$old_manifest")"
              old_revision="${old_revision:-0}"
              new_version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
              new_revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
              if [[ "$new_version" == "$old_version" ]]; then
                expected=$((old_revision + 1))
                if [[ "$new_revision" != "$expected" ]]; then
                  echo "$module container changed without revision $expected" >&2
                  exit 1
                fi
              elif [[ "$new_revision" != "1" ]]; then
                echo "$module changed version from $old_version to $new_version, so revision must reset to 1" >&2
                exit 1
              fi
            done < <(jq -r '.[].module' <<<"$selected" | LC_ALL=C sort -u)
          fi

          enriched='[]'
          while IFS= read -r item; do
            module="$(jq -r '.module' <<<"$item")"
            manifest="modules/${module}/module.yml"
            version="$(awk '$1 == "version:" { print $2; exit }' "$manifest")"
            revision="$(awk '$1 == "revision:" { print $2; exit }' "$manifest")"
            if [[ -z "$version" || ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
              echo "$manifest must contain a version and a positive integer revision" >&2
              exit 1
            fi
            item="$(jq -c --arg version "$version" --argjson revision "$revision" --arg tag "${version}-r${revision}" '. + {version: $version, revision: $revision, tag: $tag}' <<<"$item")"
            enriched="$(jq -c --argjson item "$item" '. + [$item]' <<<"$enriched")"
          done < <(jq -c '.[]' <<<"$selected")

          matrix="$(jq -c '{include: .}' <<<"$enriched")"
          echo "matrix=$matrix" >>"$GITHUB_OUTPUT"
          echo "count=$(jq 'length' <<<"$enriched")" >>"$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to CNB registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_REGISTRY_TOKEN }}

      - name: Inspect release state
        id: release_state
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail

          ghcr_exists=false
          cnb_exists=false
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null 2>&1 && ghcr_exists=true
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null 2>&1 && cnb_exists=true

          if [[ "$ghcr_exists" == true && "$cnb_exists" == true ]]; then
            mode=complete
          elif [[ "$ghcr_exists" == true ]]; then
            mode=mirror_to_cnb
          elif [[ "$cnb_exists" == true ]]; then
            mode=mirror_to_ghcr
          else
            mode=build
          fi
          echo "mode=$mode" >>"$GITHUB_OUTPUT"
          echo "Release state: GHCR=$ghcr_exists CNB=$cnb_exists mode=$mode"

      - name: Mirror the existing CNB image to GHCR
        if: steps.release_state.outputs.mode == 'mirror_to_ghcr'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: docker buildx imagetools create --tag "$GHCR_IMAGE" "$CNB_IMAGE"

      - name: Build and publish
        if: github.event_name == 'pull_request' || steps.release_state.outputs.mode == 'build'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
            dev.anas.module=${{ matrix.module }}
            dev.anas.module.revision=${{ matrix.revision }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Mirror the GHCR runtime image to CNB
        if: steps.release_state.outputs.mode == 'mirror_to_cnb' || steps.release_state.outputs.mode == 'build'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail

          raw_manifest="$(docker buildx imagetools inspect --raw "$GHCR_IMAGE")"
          source_ref="${GHCR_IMAGE%:*}"
          sources=()
          index_bytes="$(printf '%s' "$raw_manifest" | wc -c | tr -d ' ')"
          echo "OCI index: ${index_bytes} bytes"
          while IFS= read -r digest; do
            sources+=("${source_ref}@${digest}")

            platform_manifest="$(docker buildx imagetools inspect --raw "${source_ref}@${digest}")"
            manifest_bytes="$(printf '%s' "$platform_manifest" | wc -c | tr -d ' ')"
            config_bytes="$(jq -r '.config.size // 0' <<<"$platform_manifest")"
            layer_count="$(jq -r '.layers | length' <<<"$platform_manifest")"
            annotations_bytes="$(jq -c '.annotations // {}' <<<"$platform_manifest" | wc -c | tr -d ' ')"
            image_config="$(docker buildx imagetools inspect --format '{{json .Image}}' "${source_ref}@${digest}")"
            history_bytes="$(jq -c '.history // []' <<<"$image_config" | wc -c | tr -d ' ')"
            runtime_config_bytes="$(jq -c '.config // {}' <<<"$image_config" | wc -c | tr -d ' ')"
            rootfs_bytes="$(jq -c '.rootfs // {}' <<<"$image_config" | wc -c | tr -d ' ')"
            history_count="$(jq -r '.history | length' <<<"$image_config")"
            platform="$(jq -r --arg digest "$digest" '
              .manifests[]
              | select(.digest == $digest)
              | "\(.platform.os)/\(.platform.architecture)"
            ' <<<"$raw_manifest")"
            echo "Runtime manifest ${digest} (${platform}): ${manifest_bytes} bytes; config: ${config_bytes} bytes; layers: ${layer_count}; annotations JSON: ${annotations_bytes} bytes"
            echo "Image config breakdown (${platform}): history=${history_bytes} bytes (${history_count} entries); runtime config=${runtime_config_bytes} bytes; rootfs=${rootfs_bytes} bytes"
            jq -r '
              [.history[]? | {bytes: ((.created_by // "") | length), command: ((.created_by // "") | gsub("[[:space:]]+"; " ") | .[0:160])}]
              | sort_by(-.bytes)
              | .[0:5][]
              | "Largest history entry: \(.bytes) bytes; prefix=\(.command)"
            ' <<<"$image_config"
          done < <(jq -r '
            .manifests[]?
            | select(.platform.os != "unknown" and .platform.architecture != "unknown")
            | .digest
          ' <<<"$raw_manifest")
          if [[ "${#sources[@]}" == 0 ]]; then
            sources+=("$GHCR_IMAGE")
          fi
          docker buildx imagetools create --tag "$CNB_IMAGE" "${sources[@]}"

      - name: Verify the published release
        if: github.event_name != 'pull_request'
        env:
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          CNB_IMAGE: docker.cnb.cool/anas.dev/anas/${{ matrix.image }}:${{ matrix.tag }}
        run: |
          docker buildx imagetools inspect "$GHCR_IMAGE" >/dev/null
          docker buildx imagetools inspect "$CNB_IMAGE" >/dev/null
