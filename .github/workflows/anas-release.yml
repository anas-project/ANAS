name: ANAS release

on:
  push:
    branches: [anas-release]
    paths:
      - "cmd/anas/**"
      - "cmd/anas-helper/**"
      - "cmd/anasd/**"
      - "cmd/gen-contract-docs/**"
      - "contracts/**"
      - "internal/**"
      - "web/**"
      - "api/openapi.yaml"
      - "packaging/**"
      - "install.sh"
      - "go.mod"
      - "go.sum"
      - "scripts/ci/build-anas-release.sh"
      - "scripts/ci/build-console-web.sh"
      - "scripts/ci/console-web-reproducibility-test.sh"
      - "scripts/ci/anas-release-version.sh"
      - "scripts/ci/anas-release-version-test.sh"
      - "scripts/ci/install-test.sh"
      - "scripts/ci/verify-anas-release.sh"
      - "scripts/ci/verify-anas-release-test.sh"
      - ".github/workflows/anas-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact SemVer without v; leave empty to increment"
        required: false
        default: ""
      bump:
        description: "Increment used when version is empty"
        type: choice
        options: [patch, minor, major]
        required: true
        default: patch
      prerelease:
        description: "Publish as a GitHub prerelease"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: anas-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      reason: ${{ steps.release.outputs.reason }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      build_date: ${{ steps.release.outputs.build_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Test release version calculator
        run: bash scripts/ci/anas-release-version-test.sh

      - name: Test installer
        run: |
          bash scripts/ci/install-test.sh
          bash scripts/ci/verify-anas-release-test.sh

      - name: Validate release identity
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail

          commit="$(git rev-parse HEAD)"
          build_date="$(git show -s --format=%cI "$commit")"
          skip_release() {
            echo "ANAS release skipped: $1"
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "reason=$1" >>"$GITHUB_OUTPUT"
            echo "commit=$commit" >>"$GITHUB_OUTPUT"
            echo "build_date=$build_date" >>"$GITHUB_OUTPUT"
            exit 0
          }

          if [[ "$EVENT_NAME" == workflow_dispatch && "$DISPATCH_REF_NAME" != anas-release ]]; then
            echo "ANAS releases must be dispatched from anas-release" >&2
            exit 1
          fi

          bump="${BUMP:-patch}"
          args=(--commit "$commit" --initial 0.1.0 --bump "$bump")
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            args+=(--version "$REQUESTED_VERSION")
          fi
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            args+=(--automatic)
          fi
          decision="$(bash scripts/ci/anas-release-version.sh "${args[@]}")"
          if [[ "$decision" == skip:* ]]; then
            skip_release "${decision#skip:}"
          fi
          if [[ "$decision" != release:* ]]; then
            echo "unexpected release decision: $decision" >&2
            exit 1
          fi
          version="${decision#release:}"
          tag="v${version}"

          echo "publish=true" >>"$GITHUB_OUTPUT"
          echo "reason=release" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
          echo "build_date=$build_date" >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.release.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Test release commit
        if: steps.release.outputs.publish == 'true'
        run: |
          go run ./cmd/gen-module-docs --check
          go run ./cmd/gen-contract-docs --check
          go test ./...

  web:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix web ci

      - name: Build frontend twice and verify reproducibility
        run: bash scripts/ci/console-web-reproducibility-test.sh

      - uses: actions/upload-artifact@v4
        with:
          name: anas-console-web
          path: internal/webui/dist
          if-no-files-found: error

  build:
    needs: [validate, web]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: anas-console-web
          path: internal/webui/dist

      - uses: docker/setup-qemu-action@v3
        if: matrix.goarch == 'arm64'
        with:
          platforms: arm64

      - name: Build Linux archive
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          BUILD_DATE: ${{ needs.validate.outputs.build_date }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/build-anas-release.sh "$VERSION" "$COMMIT" "$BUILD_DATE" "$GOARCH" dist
          bash scripts/ci/verify-anas-release.sh \
            "$VERSION" "$COMMIT" "$BUILD_DATE" "$GOARCH" \
            "dist/anas_linux_${GOARCH}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: anas-linux-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: anas-linux-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          BUILD_DATE: ${{ needs.validate.outputs.build_date }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find dist -maxdepth 1 -type f -name 'anas_linux_*.tar.gz' -print | LC_ALL=C sort)
          [[ "${#archives[@]}" -eq 2 ]] || {
            echo "expected exactly two ANAS release archives, found ${#archives[@]}" >&2
            exit 1
          }
          for arch in amd64 arm64; do
            archive="dist/anas_linux_${arch}.tar.gz"
            bash scripts/ci/verify-anas-release.sh \
              "$VERSION" "$COMMIT" "$BUILD_DATE" "$arch" "$archive" --manifest-only
          done
          (cd dist && sha256sum anas_linux_*.tar.gz >SHA256SUMS)

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          COMMIT: ${{ needs.validate.outputs.commit }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        shell: bash
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --target "$COMMIT" \
            --title "ANAS ${VERSION}" \
            --generate-notes \
            "${prerelease[@]}"

  sync-cnb:
    needs: [validate, publish]
    if: needs.validate.outputs.publish == 'true'
    uses: ./.github/workflows/anas-cnb-release.yml
    with:
      tag: ${{ needs.validate.outputs.tag }}
      commit: ${{ needs.validate.outputs.commit }}
    secrets: inherit
