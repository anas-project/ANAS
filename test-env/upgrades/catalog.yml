api_version: anas.upgrade-tests/v1

# Core/Web transitions are release-to-worktree because their final SemVer is
# assigned by the release workflow. Module transitions use exact version-rN
# identities because those releases are independently immutable.
products:
  core:
    current: worktree
    transitions:
      - id: core-v0-1-0-to-worktree
        from: v0.1.0
        from_ref: v0.1.0
        to: worktree
        suite: core-workspace-compatibility
      - id: core-v0-1-1-to-worktree
        from: v0.1.1
        from_ref: v0.1.1
        to: worktree
        suite: core-workspace-compatibility
  web:
    current: worktree
    baselines:
      - id: web-first-release-worktree
        version: worktree
        suite: web-first-release-browser

modules:
  - name: authentik
    current: 2026.5.6-r14
    transitions:
      - {id: authentik-r8-r14, from: 2026.5.6-r8, to: 2026.5.6-r14, suite: modules-authentik}
  - name: casdoor
    current: 3.143.0-r8
    baseline: {id: casdoor-first-release-r8, version: 3.143.0-r8, reason: no_prior_release}
  - name: collabora
    current: 26.4.2-r5
    transitions:
      - {id: collabora-r4-r5, from: 26.4.2-r4, to: 26.4.2-r5, suite: modules-app}
  - name: ddns_go
    current: 6.17.4-r6
    transitions:
      - {id: ddns-go-r5-r6, from: 6.17.4-r5, to: 6.17.4-r6, suite: modules-ddns}
  - name: ddns_updater
    current: 2.10.0-r4
    transitions:
      - {id: ddns-updater-r3-r4, from: 2.10.0-r3, to: 2.10.0-r4, suite: modules-ddns}
  - name: eturnal
    current: 1.12.2-r6
    transitions:
      - {id: eturnal-r5-r6, from: 1.12.2-r5, to: 1.12.2-r6, suite: modules-authentik}
  - name: forgejo
    current: 15.0.7-r1
    baseline: {id: forgejo-first-release-r1, version: 15.0.7-r1, reason: no_prior_release}
  - name: freeradius
    current: 3.2.10-r4
    transitions:
      - {id: freeradius-r3-r4, from: 3.2.10-r3, to: 3.2.10-r4, suite: modules-base}
  - name: incus
    current: 7.3.0-r1
    baseline: {id: incus-first-release-r1, version: 7.3.0-r1, reason: no_prior_release}
  - name: lam
    current: 9.6.0-r8
    transitions:
      - {id: lam-r7-r8, from: 9.6.0-r7, to: 9.6.0-r8, suite: modules-app}
  - name: lego
    current: 5.3.1-r5
    transitions:
      - {id: lego-r4-r5, from: 5.3.1-r4, to: 5.3.1-r5, suite: modules-ddns}
  - name: llng
    current: 2.23.2-r11
    transitions:
      - {id: llng-r9-r11, from: 2.23.2-r9, to: 2.23.2-r11, suite: modules-app}
  - name: mariadb
    current: 12.3.2-r4
    transitions:
      - {id: mariadb-r3-r4, from: 12.3.2-r3, to: 12.3.2-r4, suite: modules-base}
  - name: meshcentral
    current: 1.2.4-r8
    transitions:
      - {id: meshcentral-r6-r8, from: 1.2.4-r6, to: 1.2.4-r8, suite: modules-app}
  - name: netbird
    current: 0.76.1-r5
    transitions:
      - {id: netbird-r4-r5, from: 0.76.1-r4, to: 0.76.1-r5, suite: modules-authentik}
  - name: nextcloud
    current: 34.0.2-r9
    transitions:
      - {id: nextcloud-r7-r9, from: 34.0.2-r7, to: 34.0.2-r9, suite: modules-app}
  - name: oauth2_proxy
    current: 7.15.3-r5
    transitions:
      - {id: oauth2-proxy-r3-r5, from: 7.15.3-r3, to: 7.15.3-r5, suite: modules-ddns}
  - name: postgres
    current: 18.4.0-r4
    transitions:
      - {id: postgres-r3-r4, from: 18.4.0-r3, to: 18.4.0-r4, suite: modules-app}
  - name: samba_dc
    current: 4.23.6-r11
    transitions:
      - {id: samba-dc-r7-r11, from: 4.23.6-r7, to: 4.23.6-r11, suite: modules-app}
  - name: samba_fs
    current: 4.23.6-r6
    transitions:
      - {id: samba-fs-r5-r6, from: 4.23.6-r5, to: 4.23.6-r6, suite: modules-base}
  - name: traefik
    current: 3.7.10-r6
    transitions:
      - {id: traefik-r4-r6, from: 3.7.10-r4, to: 3.7.10-r6, suite: modules-app}
  - name: versitygw
    current: 1.7.0-r3
    baseline: {id: versitygw-first-release-r3, version: 1.7.0-r3, reason: no_prior_release}
  - name: vikunja
    current: 2.4.0-r4
    baseline: {id: vikunja-first-release-r4, version: 2.4.0-r4, reason: no_prior_release}

suites:
  - id: core-workspace-compatibility
    kind: core
    runner: scripts/ci/core-upgrade-e2e.sh
  - id: web-first-release-browser
    kind: web
    runner: test-env/scripts/server-console-m1c-browser-e2e.sh
  - id: modules-base
    kind: module
    runner: test-env/scripts/server-module-upgrade-e2e.sh
    config: test-env/upgrades/configs/modules-base.yml
    targets: test-env/upgrades/configs/modules-base.targets
    seed: test-env/scripts/server-upgrade-seed-markers.sh
    verify: test-env/scripts/server-upgrade-verify-markers.sh
    report: test-env/scripts/server-upgrade-write-report.sh
    modules: [freeradius, mariadb, samba_fs]
  - id: modules-app
    kind: module
    runner: test-env/scripts/server-module-upgrade-e2e.sh
    config: test-env/upgrades/configs/modules-app.yml
    targets: test-env/upgrades/configs/modules-app.targets
    seed: test-env/scripts/server-upgrade-seed-markers.sh
    verify: test-env/scripts/server-upgrade-verify-app.sh
    report: test-env/scripts/server-upgrade-write-report.sh
    modules: [collabora, lam, llng, meshcentral, nextcloud, postgres, samba_dc, traefik]
  - id: modules-authentik
    kind: module
    runner: test-env/scripts/server-module-upgrade-e2e.sh
    config: test-env/upgrades/configs/modules-authentik.yml
    targets: test-env/upgrades/configs/modules-authentik.targets
    seed: test-env/scripts/server-upgrade-seed-markers.sh
    verify: test-env/scripts/server-upgrade-verify-authentik.sh
    report: test-env/scripts/server-upgrade-write-report.sh
    modules: [authentik, eturnal, netbird]
  - id: modules-ddns
    kind: module
    runner: test-env/scripts/server-module-upgrade-e2e.sh
    config: test-env/upgrades/configs/modules-ddns.yml
    targets: test-env/upgrades/configs/modules-ddns.targets
    seed: test-env/scripts/server-upgrade-seed-markers.sh
    verify: test-env/scripts/server-upgrade-verify-markers.sh
    report: test-env/scripts/server-upgrade-write-report.sh
    modules: [ddns_go, ddns_updater, lego, oauth2_proxy]
