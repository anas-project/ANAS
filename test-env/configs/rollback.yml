# Configuration for the rollback end-to-end test.
#
# Everything nameable is prefixed `anasrb_` and the entrypoint port is moved off
# the default. The test is meant to run on a host that may already be running a
# real deployment, and a shared `anas_` prefix would make `docker compose up`
# recreate the live containers instead of the test ones. Isolation here is
# structural rather than a matter of remembering to point it somewhere safe.
modules:
  - traefik

global:
  domain: rollback.test
  email: admin@rollback.test
  timezone: Asia/Shanghai
  virtual_domain: true
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
  CONTAINER_PREFIX: anasrb_
  IMAGE_PREFIX: anasrb_
  NETWORK_PREFIX: anasrb_
  TRAEFIK_BASE_PORT: "19443"
