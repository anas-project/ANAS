# Configuration for the whole-lifecycle test.
#
# Its own prefix and port, like the other end-to-end configs: the suite runs on
# hosts that are already running a real deployment, and a shared `anas_` prefix
# would make `docker compose up` recreate the live containers instead of these.
modules:
  - traefik

global:
  domain: lifecycle.test
  email: admin@lifecycle.test
  timezone: Asia/Shanghai
  virtual_domain: true
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
  CONTAINER_PREFIX: anaslc_
  IMAGE_PREFIX: anaslc_
  NETWORK_PREFIX: anaslc_
  TRAEFIK_BASE_PORT: "19446"
