# Deterministic credential-rotation E2E fixture. The script copies the real
# Eturnal module into a temporary module root and removes only its unrelated
# Traefik dependency, then uses the test-only Docker command boundary. It needs
# no daemon and must never be pointed at a server runtime.
modules:
  eturnal:
    config:
      port: "43478"
global:
  base_domain: credential-rotation.invalid
  email: admin@credential-rotation.invalid
  timezone: Asia/Shanghai
  virtual_domain: true
env:
  CONTAINER_PREFIX: anas_cred_
  NETWORK_PREFIX: anas_cred_
  TRAEFIK_BASE_PORT: "19478"
