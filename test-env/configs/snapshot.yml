# Configuration for the Btrfs data-snapshot test.
#
# Its own prefixes and port, for the same reason as rollback.yml: the test may
# run on a host already running a real deployment, and a shared `anas_` prefix
# would make `docker compose up` recreate the live containers. Distinct from
# rollback.yml's prefix so the two tests cannot collide with each other either.
modules:
  traefik: {}
global:
  chinese_speedup: true
  chinese_build_speedup: true
  base_domain: snapshot.test
  email: admin@snapshot.test
  timezone: Asia/Shanghai
  virtual_domain: true
rollback:
  snapshot:
    # source defaults to <workspace>/data and root to <workspace>/snapshots;
    # leaving both unset is what the test is checking.
    backend: btrfs
env:
  CONTAINER_PREFIX: anassn_
  NETWORK_PREFIX: anassn_
  TRAEFIK_BASE_PORT: "19444"
  # This suite namespaces everything it creates so it can run beside other
  # deployments on the same host, and the Docker network is part of that.
  #
  # The pin sits outside 172.17.0.0/12, which is where Docker assigns bridge
  # subnets by itself. Anything inside that range is a range Docker may hand to
  # a sibling network first -- the module's own lego network took 172.31 that way
  # -- and the pinned one then collides with a network this same deployment
  # just created.
