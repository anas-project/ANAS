# Casdoor is the primary IAM provider. This render matrix validates native
# catalog objects and OIDC registration without claiming browser acceptance.
modules:
  samba_dc: {}
  postgres: {}
  nextcloud: {}
identity:
  iam:
    provider: casdoor
global:
  base_domain: casdoor.example.test
  email: admin@casdoor.example.test
  timezone: Asia/Shanghai
  default_language: zh-CN
  virtual_domain: true
