# nextcloud consumes the iam capability, so an identity provider has to be
# present for this matrix to resolve at all.
modules:
  postgres: {}
  mariadb: {}
  samba_dc: {}
  authentik: {}
  nextcloud: {}
  collabora: {}
  meshcentral: {}
identity:
  iam:
    provider: authentik
global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
env:
  BASICAUTH_USER: admin
