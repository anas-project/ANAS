# nextcloud consumes the iam capability, so an identity provider has to be
# present for this matrix to resolve at all.
modules:
  postgres: {}
  mariadb: {}
  samba_dc: {}
  casdoor: {}
  nextcloud: {}
  collabora: {}
  forgejo: {}
  meshcentral: {}
  vikunja: {}
identity:
  iam:
    provider: casdoor
global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
