# nextcloud consumes the iam capability, so an identity provider has to be
# present for this matrix to resolve at all.
modules:
  - postgres
  - mariadb
  - samba_dc
  - authentik
  - nextcloud
  - collabora
  - meshcentral

iam:
  provider: authentik

global:
  domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  dns_provider: manual
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
