# netbird consumes the iam capability, which pulls in an identity provider and
# its database. That widens the matrix beyond networking, but dropping netbird
# to keep the label tidy would remove the most intricate cask here from
# coverage, which is the opposite of what the matrix is for.
modules:
  - traefik
  - lego
  - samba_dc
  - postgres
  - authentik
  - ddns
  - eturnal
  - netbird
  - freeradius

iam:
  provider: authentik

global:
  domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  dns_provider: manual
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
