# The widest module set that can run together. It uses authentik because that
# is what real deployments run; llng is covered by matrix-auth.yml. Only one
# IAM can be active at a time, so the two providers cannot share a config.
modules:
  - samba_dc
  - samba_fs
  - postgres
  - mariadb
  - authentik
  - nextcloud
  - collabora
  - meshcentral
  - netbird
  - lam
  - ddns
  - eturnal
  - freeradius

iam:
  provider: authentik

global:
  domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  dns_provider: manual
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
