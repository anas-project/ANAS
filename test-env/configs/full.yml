# The widest module set that can run together. It uses authentik because that
# is what real deployments run; llng is covered by matrix-auth.yml. Only one
# IAM can be active at a time, so the two providers cannot share a config.
modules:
  - samba_dc
  - samba_fs
  - postgres
  - mariadb
  - authentik
  - nextcloud
  - collabora
  - meshcentral
  - netbird
  - lam
  - ddns_updater
  - eturnal
  - freeradius

iam:
  provider: authentik

global:
  domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin

# One credential, two engines: Cloudflare uses the same API token for the ACME
# DNS-01 challenge and for record updates, so this covers the shared path.
services:
  lego:
    env:
      dns_provider: cloudflare
  ddns_updater:
    env:
      dns_provider: cloudflare

secrets:
  cloudflare_dns_api_token: test-token-not-a-real-credential
