# The llng identity path. authentik is exercised by full.yml and the other
# matrices, so this is where the alternative provider stays covered.
modules:
  samba_dc: {}
  mariadb: {}
  llng:
    config:
      # full.yml covers PostgreSQL consumers; this matrix keeps LLNG's
      # MariaDB driver, resource binding, and external DB network exercised.
      db_type: mariadb
  lam: {}
identity:
  iam:
    provider: llng
global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
env:
  BASICAUTH_USER: admin
