modules:
  - samba_dc
  - samba_fs
  - postgres
  - mariadb
  - llng
  - keycloak
  - nextcloud
  - collabora
  - meshcentral
  - netbird
  - lam
  - ddns_updater
  - eturnal
  - freeradius

global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
  default_service_root_password: change-me-now

env:
  BASICAUTH_USER: admin
  CONTAINER_PREFIX: anas_test_
  IMAGE_PREFIX: anas_
  NETWORK_PREFIX: anas_test_
  CHINESE_SPEEDUP: "true"
  APT_MIRROR_URL: https://mirrors.aliyun.com
  APK_MIRROR_URL: https://mirrors.aliyun.com
  NPM_REGISTRY_URL: https://registry.npmmirror.com
  DOCKER_SOCKET_PATH: /run/anas-docker-test.sock

# A DNS vendor is now chosen per engine rather than deployment-wide. Cloudflare
# uses a single API token, so this also covers the token-shaped credential.
services:
  ddns_updater:
    env:
      dns_provider: cloudflare

secrets:
  cloudflare_dns_api_token: test-token-not-a-real-credential
