modules:
  samba_dc: {}
  samba_fs: {}
  postgres: {}
  mariadb: {}
  keycloak: {}
  nextcloud: {}
  meshcentral: {}
  netbird: {}
  lam: {}
  ddns_updater:
    config:
      dns_provider: cloudflare
      zone_identifier: test-zone-id
  eturnal: {}
  freeradius: {}
global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
env:
  BASICAUTH_USER: admin
  CONTAINER_PREFIX: anas_test_
  IMAGE_PREFIX: anas_
  NETWORK_PREFIX: anas_test_
  CHINESE_SPEEDUP: "true"
  CHINESE_BUILD_SPEEDUP: "true"
  APT_MIRROR_URL: https://mirrors.aliyun.com
  APK_MIRROR_URL: https://mirrors.aliyun.com
  NPM_REGISTRY_URL: https://registry.npmmirror.com
  NEXTCLOUD_NOTIFY_PUSH_ALLOW_SELF_SIGNED: "true"
  LDAPTLS_REQCERT: never
  DOCKER_SOCKET_PATH: /run/anas-docker-test.sock
  NETWORK_NAMESPACE_PATH: /run/netns/anas-test
  HOST_IP: 10.254.0.2
  INTERFACE: anas-test-peer
  DEFAULT_GATEWAY_IP: 10.254.0.1
  HOST_SUBNET_MASK: "24"
  LOCAL_DNS_SERVER: 10.254.0.1
  SAMBA_DC_HOST_IP: 10.254.0.1
  SAMBA_DC_INTERFACES: anas-test-host
  SAMBA_FS_DNS_SERVER: 10.254.0.1
secrets:
  cloudflare_dns_api_token: test-token-not-a-real-credential
