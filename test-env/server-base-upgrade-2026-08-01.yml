modules:
  - samba_dc
  - samba_fs
  - postgres
  - mariadb
  - ddns_updater
  - eturnal
  - freeradius

global:
  base_domain: nas.test
  email: admin@nas.test
  timezone: Asia/Shanghai
  virtual_domain: true
  default_service_root_password: AnasTest1!

env:
  BASICAUTH_USER: admin
  CONTAINER_PREFIX: anas_base_
  IMAGE_PREFIX: anas_base_
  NETWORK_PREFIX: anas_base_
  CHINESE_SPEEDUP: "true"
  APT_MIRROR_URL: https://mirrors.aliyun.com
  APK_MIRROR_URL: https://mirrors.aliyun.com
  DDNS_CONFIG: '{"settings":[]}'
  DOCKER_SOCKET_PATH: /run/anas-base-docker.sock
  NETWORK_NAMESPACE_PATH: /run/netns/anas-base
  HOST_IP: 10.253.0.2
  INTERFACE: anas-b-peer
  DEFAULT_GATEWAY_IP: 10.253.0.1
  HOST_SUBNET_MASK: "24"
  LOCAL_DNS_SERVER: 10.253.0.2
  SAMBA_DC_HOST_IP: 10.253.0.2
  SAMBA_DC_INTERFACES: anas-b-peer
  SAMBA_FS_DNS_SERVER: 10.253.0.2

# A DNS vendor is now chosen per engine rather than deployment-wide. Cloudflare
# uses a single API token, so this also covers the token-shaped credential.
services:
  ddns_updater:
    env:
      dns_provider: cloudflare

secrets:
  cloudflare_dns_api_token: test-token-not-a-real-credential
