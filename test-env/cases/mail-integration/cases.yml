      "steps": [
        "先独立验证真实证书链与域名，再启动仅信任该叶 SPKI 的隔离浏览器",
        "通过实际 IAM 密码表单登录门户，确认 /api/me 成功",
        "从门户实际 ANAS Mail 应用卡片进入 Go，等待自动登录与本人 ready 邮箱",
        "点击邮箱进入实际 Roundcube，核对三次导航 POST 来源及消息列表"
      ],
      "implementation": {
        "files": [
          "test-env/playwright/mail-formal-sso.mjs"
        ],
        "commands": [
          "node test-env/playwright/mail-formal-sso.mjs"
        ]
      },
      "assertions": [
        "门户实际应用卡片使用正式邮件入口，同一 Module 的 Go/DMS/Roundcube 和共享 IAM/AD/PG 实际可协作",
        "人员密码仅提交到 IAM 一次；Go 和 Roundcube 均不要求再次输入或点击已有账号选择",
        "正式 /api/mailboxes 返回本人已确认邮箱，实际 Roundcube 消息列表可见",
        "交接码和短期凭据不进入 Webmail URL；三次表单 POST 保留固定 Origin，Referer 不含路径或查询",
        "独立 HTTPS 探针校验 CA 链和主机名，不使用全局跳过证书校验"
      ],
      "oracle": {
        "sources": [
          "ui",
          "network",
          "api"
        ]
      },
      "negative_cases": [
        "IAM 停在账号选择或密码表单，Go 邮箱列表不能出现，应超时失败",
        "Origin: null 或交接返回 401，不能以 Go 页面可用替代 Roundcube 登录成功",
        "人员密码发送到非 IAM、再次提交密码或 Webmail URL 出现 code/token/signature 必须失败"
      ],
      "validity": {
        "method": "counterexample",
        "commands": [
          "node test-env/playwright/mail-formal-sso.mjs"
        ],
        "evidence": "第 30 轮真实浏览器在缺少 enableAutoSignin 时停留账号选择，手工选择后因 no-referrer 产生 Origin: null，Roundcube 401；两阶段均未误报成功，原始私有证据与修正版基线见配套计划 §4.25"
      },
      "cleanup": [
        "关闭隔离浏览器；调用夹具完成信号后由服务器停止该 run，关闭 SSH 转发并删除两端临时凭据；保留私有结果和校验和"
      ],
      "sensitive_data": "不记录密码、OAuth token、交接正文或 URL 查询；失败信息脱敏，截图遮盖输入框，结果留在 Git 忽略的私有证据目录",
      "timeout": "5m"
    },
