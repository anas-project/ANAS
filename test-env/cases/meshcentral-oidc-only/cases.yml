cases:
  - id: MCO-T-001
    title: 服务端补丁失败关闭与 E2E fixture 配置契约
    status: active
    level: unit
    requirements: [MCO-R-001, MCO-R-005]
    requirement_digest: sha256:c8ccbc50102245fdb2d2fd903b6a3cc0b620eabf9f87c8df49f47f7078a34f06
    fixture: 固定 MeshCentral 上游登录处理器片段与仓库双 Provider YAML fixture
    capabilities: [node, go, module-manifest]
    preconditions: []
    steps:
      - 对固定上游片段应用 OIDC-only 补丁并注入锚点变化和重复应用
      - 加载 Authentik 与 LLNG fixture 并执行配置导入所有权校验
    implementation:
      files:
        - modules/meshcentral/meshcentral/enforce-oidc-only.test.js
        - internal/runner/server_identity_fixture_test.go
      commands:
        - node modules/meshcentral/meshcentral/enforce-oidc-only.test.js
        - go test ./internal/runner -run TestServerIdentityFixturesUsePublicConfiguration
    assertions:
      - 密码认证器和 HTTP handler 同时被阻断，未知锚点与重复补丁失败
      - 双 Provider fixture 不包含 Runner-owned 原始网络输入并可被当前 Module registry 导入
    negative_cases:
      - 缺少固定上游锚点时补丁拒绝构建
      - fixture 注入 Runner-owned key 时导入拒绝
    cleanup: [单元测试只使用临时目录]
    timeout: 10m
    sensitive_data: 只使用合成源码片段和无 Secret 的 fixture
  - id: MCO-T-002
    title: Authentik OIDC-only 与账号映射
    status: active
    level: e2e
    requirements: [MCO-R-002, MCO-R-003, MCO-R-005]
    requirement_digest: sha256:6c24c448188d47a57f8163acd4ad26e352a748e1a2e5c00fc6907b3c88355ab7
    fixture: finance 专用 Docker daemon 中的 Samba AD、PostgreSQL、Authentik、MeshCentral 与 Traefik
    capabilities: [docker, authentik, oidc, postgres]
    preconditions: [专用 network namespace、Docker socket、data root 和 workspace 已准备]
    steps:
      - 验证匿名首页、登录页 OIDC 策略和密码 POST 拒绝
      - 使用目录管理员完成 Authentik Authorization Code 登录
      - 查询 MeshCentral 持久化账号并比对 identity anchor、显示名和 site-admin
    implementation:
      files:
        - test-env/scripts/server-authentik-oidc-login-e2e.sh
        - test-env/scripts/server-meshcentral-oidc-only-e2e-lib.sh
      commands: [bash test-env/scripts/server-authentik-oidc-login-e2e.sh]
    assertions:
      - 密码登录返回 404 且只公开 OIDC
      - 真实回调建立会话，账号 identity anchor、显示名与目录一致
      - 管理员组映射为 MeshCentral site-admin
    negative_cases: [构造的本地密码 POST 必须拒绝]
    cleanup: [停止 Authentik deployment；保留 0600 脱敏报告]
    timeout: 2h
    sensitive_data: 管理员密码只从容器环境传入子进程，不写报告
  - id: MCO-T-003
    title: LLNG OIDC-only 与账号映射
    status: active
    level: e2e
    requirements: [MCO-R-002, MCO-R-004, MCO-R-005]
    requirement_digest: sha256:be4c2735a5f3b086fb7f248491063fad8e02057cc38e9717118271946b7bd5b2
    fixture: finance 专用 Docker daemon 中的 Samba AD、PostgreSQL、LLNG、MeshCentral 与 Traefik
    capabilities: [docker, llng, oidc, postgres]
    preconditions: [Authentik deployment 已停止且 LLNG 使用独立 workspace 和容器前缀]
    steps:
      - 验证匿名首页、登录页 OIDC 策略和密码 POST 拒绝
      - 使用目录管理员完成 LLNG Authorization Code 登录
      - 查询 MeshCentral 持久化账号并比对 identity anchor、显示名和 site-admin
    implementation:
      files:
        - test-env/scripts/server-llng-oidc-login-e2e.sh
        - test-env/scripts/server-meshcentral-oidc-only-e2e-lib.sh
      commands: [bash test-env/scripts/server-llng-oidc-login-e2e.sh]
    assertions:
      - 密码登录返回 404 且只公开 OIDC
      - 真实回调建立会话，账号 identity anchor、显示名与目录一致
      - 管理员组映射为 MeshCentral site-admin
    negative_cases: [构造的本地密码 POST 必须拒绝]
    cleanup: [停止 LLNG deployment；恢复测试副本 revision；保留 0600 脱敏报告]
    timeout: 2h
    sensitive_data: 管理员密码只从容器环境传入子进程，不写报告
