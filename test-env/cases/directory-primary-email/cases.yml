  - id: "MAIL-T-001"
    title: "地址规则与生产初始化参数"
    status: "active"
    level: "unit"
    requirements: ["MAIL-R-001", "MAIL-R-002", "MAIL-R-006"]
    requirement_digest: "sha256:e1b8b75fece9acf3a17e2c49d60ea4c3b1ec071dd4c0cd239120fcb707675f05"
    implementation_digest: "sha256:8e9f0674dc598f42719afd3826d9c1e387dd7819c029e345efafb1275243c07a"
    fixture: "原生用例仅使用用户已授权 finance 测试栈的临时 OU/账号；凭据保留在同机私有文件"
    capabilities: ["go", "bash"]
    preconditions: ["e2e 必须核对私有输入、候选源码和镜像基线；设置 PORTAL_MAIL_ROOT/PORTAL_ACCOUNT_ROOT；T-005 在选定 Samba DC 容器执行，可经标准输入传送同一源码；迁移实验先于生产 Worker 激活执行"]
    steps: ["执行固定入口，核对正反例及目录回读结果"]
    implementation:
      files: ["internal/directorymail/address_test.go", "modules/samba_dc/hook/mail_defaults_test.go"]
      commands: ["go test ./internal/directorymail ./modules/samba_dc/hook"]
    assertions: ["非法域名/用户名失败，后缀不改 AD 身份；实际初始化区块新建才传入 mail"]
    oracle:
      sources: ["return-value", "runtime", "report"]
    negative_cases: ["非法域名/用户名失败，后缀不改 AD 身份；实际初始化区块新建才传入 mail"]
    validity:
      method: "counterexample"
      commands: ["go test ./internal/directorymail ./modules/samba_dc/hook"]
      evidence: "非法域名/用户名失败，后缀不改 AD 身份；实际初始化区块新建才传入 mail"
    cleanup: ["临时主体按私有稳定引用清理，恢复测试范围外字段；保留无凭据结果和源码摘要"]
    timeout: "10m"
    sensitive_data: "密码/令牌/绑定凭据仅在 0700/0600 私有文件和同机输入处理，不进入 Git、截图或报告"
