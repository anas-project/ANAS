cases:
  - id: TESTAUTO-T-001
    title: 用例 schema、稳定 ID 与需求覆盖
    status: active
    level: unit
    requirements: [TESTAUTO-R-002, TESTAUTO-R-003, TESTAUTO-R-004]
    requirement_digest: sha256:cddf7bd5e986bd30b8cd12b0345a9539abadf5177a057bccacf032e10840ea0c
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 临时仓库中的需求矩阵、计划和 cases.yml
    capabilities: [go, filesystem]
    preconditions: []
    steps: [加载需求矩阵和严格 YAML catalog 后执行结构、ID 与 scope 校验]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - 严格 schema 接受完整用例并拒绝未知字段
      - 稳定用例 ID 使用需求前缀且不能跨 catalog 重复
      - 纳入 scope 的自动验证需求必须由 active 用例覆盖
    oracle:
      sources: [error-contract, filesystem]
    negative_cases:
      - 删除必填字段、使用未知字段或让 e2e 需求仅由 unit 用例覆盖
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试构造缺字段、未知字段、重复 ID 和覆盖层级错误的 catalog，并要求校验器逐项拒绝
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-002
    title: 用例到实现文件和执行命令的双向发现
    status: active
    level: unit
    requirements: [TESTAUTO-R-005, TESTAUTO-R-006]
    requirement_digest: sha256:76f8dc8d79ef0f639a6e5c925c2ee276edc8024aa39d72dbae6eb5686b5b39d3
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 带 TEST_CASES 标记和可发现命令的临时仓库
    capabilities: [go, filesystem]
    preconditions: []
    steps: [扫描实现文件标记并解析 catalog 中的每个执行命令]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - catalog 引用的实现文件存在且反向声明同一用例 ID
      - npm、Go 和脚本命令必须解析到仓库中的真实入口
      - 实现文件声明不存在或未反向引用的用例 ID 时校验失败
    oracle:
      sources: [error-contract, filesystem]
    negative_cases:
      - 删除 TEST_CASES 标记并加入不存在的用例 ID
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试删除反向标记、加入悬空 ID 和不存在命令，并要求校验器失败
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-003
    title: 人类可读用例文档生成和陈旧检查
    status: active
    level: unit
    requirements: [TESTAUTO-R-007]
    requirement_digest: sha256:cd6c1645cdf9ea27694d84edbb6c906a466bd3acc7adb963147a89f99f7da09f
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 可生成 README 的临时用例 catalog
    capabilities: [go, filesystem]
    preconditions: []
    steps: [生成 README、执行 --check，再注入一次手工漂移]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - README 包含生成来源、覆盖总览、断言、反例、清理和执行入口
      - README 与 cases.yml 一致时 --check 通过
    oracle:
      sources: [filesystem, error-contract]
    negative_cases:
      - 手工修改生成 README 后 --check 必须失败
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试先生成 README，再注入手工漂移并要求 --check 返回错误
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-004
    title: 需求变更触发用例复核
    status: active
    level: unit
    requirements: [TESTAUTO-R-008]
    requirement_digest: sha256:5ac5cd27bd4e9a3828c722a52a56590588a2249ced5fb1164ed01496bf649d07
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 已记录逐用例需求摘要的临时 catalog
    capabilities: [go, sha256, filesystem]
    preconditions: []
    steps: [修改用例引用的需求正文并分别执行 --check 与 --print-digests]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - 摘要只由该用例引用的需求 ID、正文和验证方式计算
      - --print-digests 能给出显式复核所需的新摘要但不改写 catalog
    oracle:
      sources: [return-value, error-contract]
    negative_cases:
      - 修改需求正文而不更新摘要时 --check 必须失败并要求复核
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试改变需求正文并证明旧摘要失败，同时只读摘要命令仍可输出候选值
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-005
    title: Agent 完整测试生成采用统一验收门禁
    status: active
    level: ci
    requirements: [TESTAUTO-R-009, TESTAUTO-R-010]
    requirement_digest: sha256:9026ea47af3e93372dc297407d2bd96e86c807a87cd59d2ea005cf089011cb56
    implementation_digest: sha256:c6b1fb391124e64346d898ac23f2c861250ef59ce7914fc810ad0315e7ab3165
    fixture: Agent 提交的完整 Go、Shell、Python 或 Playwright 测试补丁
    capabilities: [go, git, ci]
    preconditions: [需求与用例已经明确，生成代码仍处于普通工作区 diff 中]
    steps:
      - 由 Agent 直接生成或修改完整测试实现及断言，不创建仅含 TODO 的脚手架
      - 执行与人工测试相同的编译、静态检查、catalog 溯源和测试命令
      - 通过 review diff 审阅需求、用例与测试代码的对应关系
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog ./cmd/gen-test-case-docs]
    assertions:
      - 流程允许完整测试代码进入普通补丁并由同一 CI 门禁验证
      - 生成来源不会绕过编译、静态、溯源、执行或审阅要求
    oracle:
      sources: [error-contract, report]
    negative_cases: [缺少实现文件、执行入口或双向标记的生成结果被 catalog 门禁拒绝]
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: fixture 中缺失文件、命令和标记的完整用例均导致与人工代码相同的校验失败
    cleanup: [单元测试删除临时仓库；Agent 保留普通 Git diff 供审阅]
    timeout: 2m
    sensitive_data: 不把真实数据或 Secret 放入生成输入、测试代码和 diff
  - id: TESTAUTO-T-006
    title: 实现摘要与三层 review diff 防止静默覆盖
    status: active
    level: unit
    requirements: [TESTAUTO-R-011]
    requirement_digest: sha256:d8c3c1304989f5b959a601b87abf4d18a3f7674e5495efc71d099b2534f5def2
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 已提交基线以及分别修改过的需求、cases.yml 和测试实现
    capabilities: [go, git, sha256, filesystem]
    preconditions: []
    steps:
      - 修改已审阅测试实现但保留旧 implementation_digest 并执行 --check
      - 从 HEAD 生成需求差异、用例差异和测试代码差异三段式审阅补丁
      - 审阅补丁后才使用 --print-digests 更新摘要
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - 任一实现文件或执行命令变化都会使旧实现摘要失效
      - review diff 同时包含需求、用例和测试代码段，并包含未跟踪实现文件
    oracle:
      sources: [filesystem, error-contract, report]
    negative_cases: [改变已审阅断言但不更新 implementation_digest 时门禁失败]
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试直接改变实现文件并要求摘要门禁失败，再检查三层 diff 包含全部改动
    cleanup: [Go 测试框架删除临时 Git 仓库]
    timeout: 2m
    sensitive_data: 审阅补丁只处理仓库文件，不读取 Git ignored Secret
  - id: TESTAUTO-T-007
    title: 外部可观察 oracle 拒绝弱断言
    status: active
    level: unit
    requirements: [TESTAUTO-R-012]
    requirement_digest: sha256:f0ea19e1a1c398a054387067f67e82288a86e52f9217fd94d17990026fb0e87f
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 分别声明强 oracle 和仅退出码/日志 oracle 的临时 catalog
    capabilities: [go]
    preconditions: []
    steps: [校验 oracle source 枚举，并判断每个 active 用例至少包含一个外部可观察来源]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - API、数据库、文件、UI、运行时、报告或返回契约可作为行为 oracle
      - 退出码、日志或生成动作可以辅助诊断，但不能单独证明功能通过
    oracle:
      sources: [error-contract]
    negative_cases: [把 oracle 改为仅 exit-status、logs 和 generation 时校验失败]
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试将强 oracle 替换为 exit-status 与 logs 并要求门禁拒绝
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-008
    title: 风险需求必须具备反例或故障注入覆盖
    status: active
    level: unit
    requirements: [TESTAUTO-R-013]
    requirement_digest: sha256:bfbaf16ebef3200e3e60e5fce7b474ad9e8fdabdce30ad52e9d7548e252c02f2
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 包含拒绝、安全、回滚、故障降级和恢复措辞的需求矩阵
    capabilities: [go]
    preconditions: []
    steps: [解析采用范围内的风险需求，并检查是否至少有覆盖它且声明 negative_cases 的 active 用例]
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions: [每项风险需求至少由一个反例或故障注入用例覆盖]
    oracle:
      sources: [error-contract]
    negative_cases: [清空风险需求对应的 negative_cases 后校验必须失败]
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试清空拒绝需求的负向场景并要求覆盖门禁报告准确需求 ID
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-009
    title: 变异、反例、故障注入或人工理由有效性证明
    status: active
    level: unit
    requirements: [TESTAUTO-R-014]
    requirement_digest: sha256:2a3feb7cf8e5e66226cf78b720309288cc005fcecba0cfbd3dda865a9889f7f0
    implementation_digest: sha256:1e355d4f0164eec52b852bab1774c8bea539e6df74be9169fff5752189a89a3e
    fixture: 使用四种 validity method 的临时 catalog
    capabilities: [go]
    preconditions: []
    steps:
      - 校验自动有效性证明包含可发现命令和行为破坏证据说明
      - 校验无法自动验证时必须使用 manual 并记录具体复核理由
    implementation:
      files: [internal/testcasecatalog/catalog_test.go]
      commands: [go test ./internal/testcasecatalog]
    assertions:
      - mutation、counterexample 和 fault-injection 都必须有可执行入口与证据
      - manual 不能伪装成自动证据且不能缺少人工复核理由
    oracle:
      sources: [error-contract]
    negative_cases: [删除自动证据命令或 manual_review_reason 时门禁失败]
    validity:
      method: counterexample
      commands: [go test ./internal/testcasecatalog]
      evidence: 单元测试分别移除自动命令和人工理由并要求门禁拒绝
    cleanup: [Go 测试框架删除临时仓库]
    timeout: 1m
    sensitive_data: 不使用敏感数据
  - id: TESTAUTO-T-010
    title: Git ignored target profile 与严格 SSH host-key 契约
    status: active
    level: contract
    requirements: [TESTAUTO-R-015, TESTAUTO-R-016]
    requirement_digest: sha256:bd5a39d2c3abc16df55b071b80e60c9f57c82d8c05ab2cc9fc3ba3ef16b5af3f
    implementation_digest: sha256:12ce25394c0d2c95014f0a47d7c6b9bec10f9ca9ae5a205dc97c537cb82d2195
    fixture: 临时 Git 仓库中的 0600 targets.local.yml、SSH config 展开结果与 known_hosts
    capabilities: [go, git, ssh]
    preconditions: []
    steps:
      - 严格解析只含 alias、远端根、能力和并发的本地 target profile
      - 校验文件位于 test-env/remote、被 Git ignore 且权限为 0600
      - 用 ssh -G 展开 alias，强制 BatchMode 和 StrictHostKeyChecking 并核对 known-host 绑定
    implementation:
      files: [internal/remotetest/profile_test.go]
      commands: [npm run test-remote-contract]
    assertions:
      - profile 的未知字段、认证材料、user@host、宽泛路径、宽松权限和被 Git 跟踪状态均被拒绝
      - SSH 命令不含私钥参数、未知 host 自动接受或 /dev/null known-host 绕过
    oracle:
      sources: [filesystem, error-contract]
    negative_cases: [注入 password 字段、root@example、默认 Docker 式宽泛路径和关闭 host-key 校验]
    validity:
      method: counterexample
      commands: [go test ./internal/remotetest]
      evidence: 契约测试逐项构造不安全 profile 与 SSH 展开结果并要求解析或命令构造失败
    cleanup: [Go 测试框架删除临时 Git 仓库和 known_hosts]
    timeout: 2m
    sensitive_data: 只使用 example.invalid 和伪造公钥；不读取操作者真实 SSH 配置
  - id: TESTAUTO-T-011
    title: 已登记目标与本次显式目标授权
    status: active
    level: e2e
    requirements: [TESTAUTO-R-017]
    requirement_digest: sha256:ba57b7823fe1c1e00fd4b81d19362a430bb519df4e99ea12010caacf4b6e54c1
    implementation_digest: sha256:55d1c9bd071650f20c8659015239e2a5ee2908ace51c4500e185619e7e6618b0
    fixture: 同一进程中的已登记目标、未登记目标和本次显式授权请求
    capabilities: [go]
    preconditions: []
    steps:
      - 用 profile 名称解析已登记目标
      - 用 ssh-target、authorize-target、远端根、能力和并发解析单次目标
      - 分别省略授权、混合两种来源和让两个显式 alias 不一致
    implementation:
      files: [internal/remotetest/profile_test.go]
      commands: [go test ./internal/remotetest]
    assertions:
      - 只有已登记目标或当前调用中被准确重复的显式 alias 可以进入预检
      - 单次显式目标不会写回 profile，生产目标也不会绕过后续隔离与容量校验
    oracle:
      sources: [return-value, error-contract]
    negative_cases: [无授权来源、两种来源同时出现或复用不同 alias 时拒绝]
    validity:
      method: counterexample
      commands: [go test ./internal/remotetest]
      evidence: 进程级测试覆盖两种成功授权和三种失败组合，不读取任何历史运行状态
    cleanup: [全部请求只存在于测试进程内]
    timeout: 1m
    sensitive_data: alias 与路径均为合成值
  - id: TESTAUTO-T-012
    title: 固定特权 helper 与部署前综合预检
    status: active
    level: contract
    requirements: [TESTAUTO-R-018, TESTAUTO-R-022]
    requirement_digest: sha256:a5239e18d3f9d8405af3791ee4b443d4128d4a7538ca8f5300069d967250b0a6
    implementation_digest: sha256:4948a4b0ddd5638537e2e971964283e4d95afb1a0e72e97c5cc53808cd3a9fe2
    fixture: root-owned helper 配置契约、合成 host facts 与只读 preflight CLI
    capabilities: [go, ssh, sudo, docker]
    preconditions: [真实服务器使用安装脚本把 helper、配置和既有 Docker guard 固定到 root-owned 路径]
    steps:
      - 通过固定 sudo helper preflight 动词收集架构、容量、端口、DNS、路由、能力与配额
      - 审计 SSH 账号 UID、组、任意 sudo、helper owner/mode，并要求既有 Docker 与 Compose guard 状态
      - 任一检查失败时在本地生成源包和任何远端部署动作之前结束
    implementation:
      files:
        - internal/remotetest/preflight_test.go
        - cmd/remote-test/main.go
        - cmd/anas-test-helper/main.go
        - test-env/scripts/install-remote-test-helper.sh
      commands: [npm run test-remote-contract]
    assertions:
      - helper 只接受固定 preflight 动词和具名标量，不接受 shell、远端路径或位置参数
      - root 账号、docker/root/wheel/sudo/admin 组、任意 passwordless sudo、非 root-owned helper 均拒绝
      - 架构、磁盘、内存、端口、DNS、路由、能力、并发和两层隔离全部通过后才返回 allocation
    oracle:
      sources: [error-contract, report, runtime]
    negative_cases: [同时破坏容量、网络、能力、配额、账号权限和隔离状态并要求聚合失败]
    validity:
      method: counterexample
      commands: [go test ./internal/remotetest]
      evidence: 单元契约注入完整的不安全 host facts，证明预检在 allocation 和源包阶段前失败
    cleanup: [契约测试不连接服务器；安装脚本仅由服务器管理员显式执行]
    timeout: 2m
    sensitive_data: host facts 只含能力与容量，不含地址、凭据或私有连接信息
  - id: TESTAUTO-T-013
    title: commit 与 base commit 加 worktree patch 源包往返
    status: active
    level: e2e
    requirements: [TESTAUTO-R-019]
    requirement_digest: sha256:7a9bcaa3f014f57f53181b024578428bdeebc4100d71290b073ca95925448ac4
    implementation_digest: sha256:d7141f6a2bde46e54ee28f12eae9b3f1304b470846a310f6347e4b40a650cf50
    fixture: 含已提交文件、已修改跟踪文件和未跟踪文件的临时 Git 仓库
    capabilities: [go, git, tar, sha256]
    preconditions: []
    steps:
      - 分别构建 committed bundle 与 base commit 加 binary patch/untracked tar 的 worktree bundle
