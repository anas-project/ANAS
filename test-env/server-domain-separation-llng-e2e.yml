# WP4 unrelated-domain runtime fixture. Web applications use
# apps.example.test while Samba AD owns ad.example.test; auto therefore creates
# and reconciles a separate application DNS zone.
# Its pinned addresses belong to a dedicated network namespace and Docker
# daemon; the runner detects the remaining host facts from that namespace.
# Never apply this fixture to a production host.
modules:
  samba_dc:
    config:
      domain: ad.example.test
      application_dns_mode: auto
      netbios_name: LLNGDC
  samba_fs: {}
  postgres: {}
  llng:
    config:
      enable_test: "false"
  nextcloud:
    config:
      talk_enabled: "false"
      memories_enabled: "false"
  # These two consumers keep the existing LLNG login-matrix probe usable from
  # the domain-separation wrapper.
  meshcentral: {}
  netbird: {}
  lam: {}
  traefik: {}
identity:
  iam:
    provider: llng
global:
  base_domain: apps.example.test
  email: admin@apps.example.test
  timezone: Asia/Shanghai
  virtual_domain: true
  container_prefix: anas_ds_llng_
  network_prefix: anas_ds_llng_
  host_ip: 10.252.11.2
  host_lan_ip: 10.252.11.250
  host_lan_bridge_ip: 10.252.11.249
