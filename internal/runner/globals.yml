# Parameters that belong to the deployment rather than to any module.
#
# This is a schema, not a bundle. It has no version, no digest and no ABI,
# because nothing ships it: it is compiled into the runner, which is the only
# thing that reads it. It used to be the config block of a "core" module, which
# gave these parameters a version number nobody could bump, a hook directory
# that produced nothing, and an owner name that every scoping rule had to
# special-case alongside the real global scope.
#
# Every key here is published with global ownership, so every module sees it.
api_version: anas.dev/v1
kind: GlobalConfig
config:
  required:
    - base_domain
    - email
  defaults:
    container_prefix: anas_
    network_prefix: anas_
    chinese_speedup: "false"
    chinese_build_speedup: "false"
    ipv4: "true"
    ipv6: "true"
    dns_server: 223.5.5.5
  changes:
    base_domain:
      effect: immutable
      apply: migrate-domain
      description: Samba realm, SSO issuers, certificates, and application URLs depend on it.
    timezone:
      effect: container_recreate
      apply: recreate-affected-containers
      description: Containers receive the timezone through their environment.
    default_language:
      effect: reconcile
      apply: reconcile-module-localization
      description: Modules reconcile this according to their localization inventory; browser-only and fixed-language applications may not consume it.
    default_locale:
      effect: reconcile
      apply: reconcile-module-localization
      description: Regional date, number, and formatting defaults are reconciled separately from UI language.
    dns_server:
      effect: container_recreate
      apply: recreate-affected-containers
      description: DNS settings are injected when containers are created.
    chinese_speedup:
      effect: container_recreate
      apply: render-pull-and-recreate
      description: Selects published CNB images and runtime download mirrors; no local image build is required.
    chinese_build_speedup:
      effect: image_rebuild
      apply: apply-with-build
      description: Changes Dockerfile and hook build inputs; run anas apply --build to regenerate images before recreating containers.
    # Declared here and not under `defaults` on purpose. A default -- even an
    # empty one -- is written into every rendered .env, so seeding these would
    # add a line to every module of every deployment, including the ones that
    # have no host-LAN module at all. Declaring them as changes is what makes
    # them addressable by `anas config set` and gives them a policy, without
    # publishing anything until somebody sets a value.
    host_lan_ip:
      effect: container_recreate
      apply: recreate-and-reregister-dns
      description: The container's LAN address is fixed at creation; the directory's A record has to be re-registered with it.
    host_lan_bridge_ip:
      effect: container_recreate
      apply: recreate-affected-containers
      description: The host-side macvlan bridge address is configured when the bridge is created.
    host_lan_arp_check:
      effect: container_recreate
      apply: recreate-affected-containers
      description: Whether the runner probes a LAN address for an existing occupant before taking it. Unset means the probe runs.
    virtual_domain:
      effect: reconcile
      apply: reissue-certificates
      description: Switching between ACME and the internal CA replaces the certificate every service presents, and clients must re-trust it.
