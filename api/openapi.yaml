openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ANAS Web API
  version: 0.8.0-m5
  description: |
    M2 API for the ANAS administration daemon. This contract is versioned
    independently from the CLI JSON contract: HTTP responses use
    `anas.dev/api/v1`, while the CLI continues to use `anas.dev/cli/v1`.

    Workspaces are registered when `anasd` starts. Callers address them only by
    opaque workspace ID; request and response DTOs never contain host filesystem
    paths. M1A adds bootstrap exchange and local-owner authentication while the
    workspace surface remains read-only. Route visibility and transport are
    state-dependent. M1B adds durable job history and event replay, the
    certificate-bound bootstrap-to-enrollment handoff and initial local-owner
    creation, synchronous managed-configuration read/validation/atomic save,
    audited typed deployment planning, bootstrap first-apply jobs, and local
    owner step-up for full-state direct apply. M1C adds a separately built Vue
    console shell plus an independent recovery bundle, both served from
    immutable assets embedded in `anasd`. M1.5 adds a
    separate mTLS trusted-proxy listener whose verified OIDC directory identity
    receives the same management capabilities while local-account routes remain
    direct-listener only. M2 adds live container health, dependency-expanded
    Module lifecycle previews and durable start/stop/restart/rollback jobs.
    M3 adds typed Module catalog, configuration and update operations. M4 adds
    the non-privileged snapshot, backup planning/listing and local-administrator
    surface plus server-generated terminal-only action descriptors. M5 closes
    the required API surface and applies opaque cursor pagination to every list.
    Saving desired configuration does not apply it. A disallowed
    state, listener, or transport is deliberately indistinguishable from an
    unknown path and returns 404.
servers:
  - url: http://{host}:8080
    description: Bootstrap plaintext listener on the fixed default management port.
    variables:
      host:
        default: 127.0.0.1
        description: A numeric local address accepted by the configured Host policy.
  - url: https://{host}:8080
    description: TLS listener on the same fixed management port after a certificate is available.
    variables:
      host:
        default: anas.example
        description: A DNS name or numeric local address accepted by the configured Host policy.
security: []
tags:
  - name: Service
  - name: Console
  - name: Authentication
  - name: Jobs
  - name: Workspace
  - name: Configuration
  - name: Deployments
  - name: Modules
  - name: Maintenance
paths:
  /:
    get:
      operationId: getConsole
      summary: Serve the console shell or redirect an enrolled plaintext request
      description: |
        M0/bootstrap plaintext and all allowed TLS requests receive the embedded
        main console shell. Enrollment/full plaintext requests are redirected to
        the canonical HTTPS origin from root-owned service configuration.
        Credentialed/body-carrying full plaintext requests remain hidden with
        404, and no query or user-controlled host value is propagated.
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [plaintext, tls]}
        full: {authentication: none, transports: [plaintext, tls]}
      responses:
        "200":
          description: Embedded main console HTML.
          content:
            text/html:
              schema:
                type: string
        "308":
          description: Redirect to the configured canonical HTTPS origin root.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /assets/main.js:
    get:
      operationId: getConsoleMainJavaScript
      summary: Read the embedded main console JavaScript bundle
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Embedded ECMAScript module.
          content:
            text/javascript:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /assets/main.css:
    get:
      operationId: getConsoleMainStyles
      summary: Read the embedded main console stylesheet
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Embedded main console stylesheet.
          content:
            text/css:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /emergency:
    get:
      operationId: getConsoleRecovery
      summary: Serve the independent recovery interface
      description: This package uses browser APIs only and does not import the main Vue bundle.
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Embedded recovery HTML.
          content:
            text/html:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /assets/emergency.js:
    get:
      operationId: getConsoleRecoveryJavaScript
      summary: Read the independent recovery JavaScript bundle
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Embedded recovery ECMAScript module.
          content:
            text/javascript:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /assets/emergency.css:
    get:
      operationId: getConsoleRecoveryStyles
      summary: Read the independent recovery stylesheet
      tags: [Console]
      security: []
      x-anas-permission: console.ui.read
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Embedded recovery stylesheet.
          content:
            text/css:
              schema: {type: string}
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /healthz:
    get:
      operationId: getHealth
      summary: Check whether the daemon is alive
      description: Does not inspect Docker, Btrfs, tools, or any workspace.
      tags: [Service]
      security: []
      x-anas-permission: public
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [plaintext, tls]}
        full: {authentication: none, transports: [plaintext, tls]}
      responses:
        "200":
          description: The daemon is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/system:
    get:
      operationId: getSystem
      summary: Read daemon build information and current capabilities
      tags: [Service]
      security: []
      x-anas-permission: public
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        m0: {authentication: none, transports: [plaintext, tls]}
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [plaintext, tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: Build information, capability flags, and registered workspace IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "408":
          $ref: "#/components/responses/RequestCanceledProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/DeadlineProblem"
  /api/v1/system/ca:
    get:
      operationId: downloadInternalCA
      summary: Download the validated public ANAS internal CA
      description: |
        Returns only the independently configured and TLS-manager-validated
        `anas-internal-ca.crt`; no filesystem path or private material is
        exposed. The CA remains available when the serving issuer is ACME.
      tags: [Service]
      security:
        - {}
        - localSessionCookie: []
      x-anas-permission: system.ca.read
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        enrollment: {authentication: none, transports: [plaintext, tls]}
        full: {authentication: owner, transports: [tls]}
      responses:
        "200":
          description: The public internal trust anchor.
          headers:
            Content-Disposition:
              required: true
              schema:
                type: string
                const: 'attachment; filename="anas-internal-ca.crt"'
          content:
            application/pem-certificate-chain:
              schema:
                type: string
                contentMediaType: application/pem-certificate-chain
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/csrf:
    get:
      operationId: issuePreAuthCSRF
      summary: Issue a short-lived pre-authentication CSRF token
      description: |
        Sets a host-only, HttpOnly, SameSite=Strict `anas_preauth_csrf`
        cookie and returns the same value in `csrf_token`. The caller must send
        both values, unchanged, when exchanging a bootstrap token or logging in.
        The cookie is Secure in enrollment and full states, but is intentionally
        not Secure during plaintext bootstrap.
      tags: [Authentication]
      security: []
      x-anas-permission: auth.csrf
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
        full: {authentication: none, transports: [tls]}
      responses:
        "200":
          description: A pre-authentication CSRF token valid for ten minutes.
          headers:
            Set-Cookie:
              description: Host-only `anas_preauth_csrf`; HttpOnly; SameSite=Strict; Path=/; no Domain; Secure except during bootstrap.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CSRFResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/auth/session:
    get:
      operationId: refreshAuthSession
      summary: Recover an authenticated browser session and rotate its CSRF token
      description: |
        Uses only the host-only HttpOnly bootstrap or local-owner session cookie.
        The exact request origin must still match the durable session binding.
        On success, atomically invalidates the previous SPA-visible CSRF value,
        returns a replacement, and extends only the idle lifetime without
        changing the absolute session expiry. The response is never cacheable.
      tags: [Authentication]
      security:
        - bootstrapSessionCookie: []
        - localSessionCookie: []
      x-anas-permission: auth.session.refresh
      x-anas-scope: service
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        bootstrap: {authentication: bootstrap, transports: [plaintext, tls]}
        enrollment: {authentication: bootstrap, transports: [plaintext, tls]}
        full: {authentication: owner, transports: [tls]}
      responses:
        "200":
          description: The existing authenticated session was recovered and its CSRF token was rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/GetMethodNotAllowedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/bootstrap/exchange:
    post:
      operationId: exchangeBootstrapToken
      summary: Atomically exchange a one-use bootstrap token for a session
      description: |
        Requires an exact same-origin `Origin` header plus the same CSRF value
        in the `anas_preauth_csrf` cookie and `X-CSRF-Token` header. On success,
        consumes the bootstrap token, deletes the pre-authentication cookie, and
        sets the host-only `anas_bootstrap_session` cookie. The session token is
        never returned in the JSON response.
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - preAuthCSRFCookie: []
          csrfHeader: []
      x-anas-permission: auth.bootstrap.exchange
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        bootstrap: {authentication: none, transports: [plaintext, tls]}
        enrollment: {authentication: none, transports: [tls]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapExchangeRequest"
      responses:
        "200":
          description: The bootstrap session was created and the one-use token was consumed.
          headers:
            Set-Cookie:
              description: Host-only `anas_bootstrap_session` plus deletion of `anas_preauth_csrf`; HttpOnly; SameSite=Strict; Path=/; no Domain; Secure in enrollment.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/PostMethodNotAllowedProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeProblem"
        "429":
          $ref: "#/components/responses/TooManyRequestsProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/enrollment/handoffs:
    post:
      operationId: issueEnrollmentHandoff
      summary: Issue a one-use handoff bound to the validated TLS endpoint
      description: |
        Requires the promoted bootstrap session, its session-bound CSRF token,
        and the exact source Origin. The server selects the validated target
        origin and certificate SPKI digest; clients cannot override either
        binding. The returned handoff is short-lived and shown only once.
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - bootstrapSessionCookie: []
          csrfHeader: []
      x-anas-permission: auth.enrollment.handoff
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        enrollment: {authentication: bootstrap, transports: [plaintext, tls]}
      responses:
        "201":
          description: A certificate-bound, one-use enrollment handoff was issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentHandoffResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/PostMethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/enrollment/exchange:
    post:
      operationId: exchangeEnrollmentHandoff
      summary: Exchange a certificate-bound handoff for an enrollment session
      description: |
        Accepts only a form-encoded handoff and an exact canonical source Origin.
        Cookies, Authorization headers, query parameters, target-origin input,
        and SPKI input are rejected. The request must arrive at the validated TLS
        origin to which the handoff was bound. Success sets both an HttpOnly
        enrollment session cookie and a separate same-origin SPA-readable CSRF
        cookie, then redirects to the target origin root. No credential is
        returned in the URL or a JSON response.
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/Origin"
      security: []
      x-anas-permission: auth.enrollment.exchange
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        enrollment: {authentication: none, transports: [tls]}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/EnrollmentHandoffExchangeRequest"
      responses:
        "303":
          description: The handoff was consumed, a TLS-only enrollment session was created, and the browser is redirected to the target origin root.
          headers:
            Set-Cookie:
              description: >-
                Two host-only cookies: HttpOnly `__Host-anas_enrollment_session`
                and SPA-readable `__Host-anas_enrollment_csrf`; both Secure;
                SameSite=Strict; Path=/; no Domain.
              schema:
                type: string
            Location:
              description: Absolute URL of the validated target origin root.
              schema:
                type: string
                format: uri
                pattern: "^https://[^/]+/$"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/PostMethodNotAllowedProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "415":
          $ref: "#/components/responses/UnsupportedFormMediaTypeProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/enrollment/owner:
    post:
      operationId: createInitialLocalOwner
      summary: Atomically create the initial local owner and enter full mode
      description: |
        Requires the TLS-only enrollment session, an exact match between the
        SPA-readable enrollment CSRF cookie and `X-CSRF-Token`, validation of
        that CSRF value against the server-side session digest, the exact
        enrollment transaction, and an exact same-origin Origin.
        Owner persistence, credential revocation, and the state transition use a
        recoverable commit so a restart cannot expose a partial result.
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - enrollmentSessionCookie: []
          enrollmentCSRFCookie: []
          csrfHeader: []
      x-anas-permission: auth.enrollment.owner
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        enrollment: {authentication: enrollment, transports: [tls]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentOwnerRequest"
      responses:
        "201":
          description: The initial owner was created, enrollment credentials were revoked, and full mode was published.
          headers:
            Set-Cookie:
              description: Deletion of the enrollment session, enrollment CSRF, and promoted bootstrap session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentOwnerResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/PostMethodNotAllowedProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/auth/login:
    post:
      operationId: loginLocalOwner
      summary: Create a local-owner session on the direct TLS listener
      description: |
        Requires an exact same-origin `Origin` header and pre-authentication
        double-submit CSRF. On success, deletes the pre-authentication cookie and
        sets a host-only, Secure, HttpOnly, SameSite=Strict
        `__Host-anas_local_session` cookie. The session token is never returned in JSON.
      tags: [Authentication]
      parameters:
        - $ref: "#/components/parameters/Origin"
      security:
        - preAuthCSRFCookie: []
          csrfHeader: []
      x-anas-permission: auth.local.login
      x-anas-scope: service
      x-anas-listeners: [direct]
      x-anas-state-access:
        full: {authentication: none, transports: [tls]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalLoginRequest"
      responses:
        "200":
          description: A local-owner session was created.
          headers:
            Set-Cookie:
              description: Host-only `__Host-anas_local_session` plus deletion of `anas_preauth_csrf`; Secure; HttpOnly; SameSite=Strict; Path=/; no Domain.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
