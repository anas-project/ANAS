components:
  securitySchemes:
    preAuthCSRFCookie:
      type: apiKey
      in: cookie
      name: anas_preauth_csrf
      description: |
        Host-only double-submit cookie issued by `GET /api/v1/auth/csrf`.
        Its value must exactly match `X-CSRF-Token`.
      x-anas-cookie-attributes:
        host_only: true
        http_only: true
        same_site: Strict
        path: /
        secure: state-dependent
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: The matching pre-authentication/session CSRF value; enrollment reads it from the dedicated same-origin CSRF cookie rather than a JSON exchange response.
    bootstrapSessionCookie:
      type: apiKey
      in: cookie
      name: anas_bootstrap_session
      description: |
        Host-only bootstrap session credential issued by token exchange. It is
        HttpOnly and SameSite=Strict, has Path=/ and no Domain, and is Secure
        when issued in enrollment. A promoted session authorizes only the
        enrollment handoff route for its original transaction.
      x-anas-cookie-attributes:
        host_only: true
        http_only: true
        same_site: Strict
        path: /
        secure: state-dependent
    enrollmentSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-anas_enrollment_session
      description: |
        Host-only enrollment credential issued only at the validated TLS target.
        It is Secure, HttpOnly and SameSite=Strict, has Path=/ and no Domain.
      x-anas-cookie-attributes:
        host_only: true
        http_only: true
        same_site: Strict
        path: /
        secure: always
    enrollmentCSRFCookie:
      type: apiKey
      in: cookie
      name: __Host-anas_enrollment_csrf
      description: |
        Host-only double-submit credential issued only at the validated TLS
        target. It is Secure and SameSite=Strict, has Path=/ and no Domain, and
        is intentionally not HttpOnly so the same-origin SPA can copy it into
        `X-CSRF-Token`. The server also validates its digest as part of the
        HttpOnly enrollment session.
      x-anas-cookie-attributes:
        host_only: true
        http_only: false
        same_site: Strict
        path: /
        secure: always
    localSessionCookie:
      type: apiKey
      in: cookie
      name: __Host-anas_local_session
      description: |
        Host-only local-owner session credential. It is Secure, HttpOnly and
        SameSite=Strict, has Path=/ and no Domain.
      x-anas-cookie-attributes:
        host_only: true
        http_only: true
        same_site: Strict
        path: /
        secure: always
    proxySessionCookie:
      type: apiKey
      in: cookie
      name: __Host-anas_proxy_session
      description: |
        Host-only, Secure, HttpOnly and SameSite=Strict session bound to the
        stable issuer+subject received on the mTLS trusted-proxy listener.
      x-anas-cookie-attributes:
        host_only: true
        http_only: true
        same_site: Strict
        path: /
        secure: always
  headers:
    CacheControlNoStore:
      description: This representation contains administrative state and must not be stored by browsers or intermediaries.
      schema:
        type: string
        const: no-store
    ManagedConfigETag:
      description: |
        Strong opaque 256-bit random generation validator. It is absent from GET
        only while the workspace has no managed configuration, and is always
        present after a successful PUT. Weak validators are never emitted, and
        the internal config.yml content digest is never exposed.
      schema:
        type: string
        pattern: '^"cfgv-[0-9a-f]{64}"$'
  parameters:
    Origin:
      name: Origin
      in: header
      required: true
      description: Exactly one canonical origin equal to the current request scheme and Host.
      schema:
        type: string
        format: uri
    WorkspaceID:
      name: ws
      in: path
      required: true
      description: Opaque ID of a workspace registered when the daemon started; never a filesystem path.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    DeploymentID:
      name: id
      in: path
      required: true
      description: Deployment artifact ID, not a path.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    ModuleName:
      name: module
      in: path
      required: true
      description: Module name in the active deployment.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]*$"
    SnapshotID:
      name: id
      in: path
      required: true
      description: Snapshot ID selected from the workspace snapshot list, never a path.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: "^[A-Za-z0-9._-]+$"
    SnapshotAction:
      name: action
      in: path
      required: true
      schema:
        type: string
        enum: [pin, unpin, verify]
    LocalAdminAccount:
      name: account
      in: path
      required: true
      description: Stable local-administrator record ID, never a username or password.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._-]+$"
    BackupTargetIDQuery:
      name: target_id
      in: query
      required: true
      description: ID of a backup target configured in the root-owned daemon service configuration.
      schema:
        $ref: "#/components/schemas/BackupTargetID"
    ModuleCommandID:
      name: command
      in: path
      required: true
      description: Stable Module-local command ID.
      schema:
        type: string
        minLength: 1
        maxLength: 63
        pattern: "^[a-z][a-z0-9-]{0,62}$"
    JobID:
      name: id
      in: path
      required: true
      description: Opaque durable job ID, never a workspace path or command argument.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    LastEventID:
      name: Last-Event-ID
      in: header
      required: false
      description: Durable decimal event ID after which replay resumes.
      schema:
        type: string
        pattern: "^(0|[1-9][0-9]{0,19})$"
        maxLength: 20
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of list items to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor returned as `next_cursor` by the preceding page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque caller-selected key scoped to principal, method, canonical path, and workspace.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[!-~]+$"
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Required when a confirmed preview is submitted for job creation; omit for preview-only requests.
      schema:
        type: string
        minLength: 1
        maxLength: 256
        pattern: "^[!-~]+$"
    ConfigIfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Required only when replacing an existing managed configuration. Supply
        exactly one strong ETag returned by GET. Lists, weak tags, and `*` are
        rejected; do not send this header together with If-None-Match.
      schema:
        type: string
        pattern: '^"cfgv-[0-9a-f]{64}"$'
    ConfigIfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Required only for the first managed configuration and must be exactly
        `*`. Do not send this header together with If-Match.
      schema:
        type: string
        const: "*"
    ModuleConfigIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong managed-configuration ETag returned by the Module list; weak tags, lists, and `*` are rejected.
      schema:
        type: string
        pattern: '^"cfgv-[0-9a-f]{64}"$'
  responses:
    AcceptedJob:
      description: The job was durably queued, or an identical existing job was returned.
      headers:
        Location:
          required: true
          description: Relative URL of the durable job resource.
          schema:
            type: string
            pattern: "^/api/v1/jobs/[^/]+$"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DeploymentApplyResponse"
    BadRequestProblem:
      description: The Host or Origin is invalid, a path or body value is invalid, or the query string is malformed or unsupported.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnauthorizedProblem:
      description: The credential is missing, expired, invalid, or otherwise unauthenticated.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ForbiddenProblem:
      description: Origin, CSRF, or authorization validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFoundProblem:
      description: The resource does not exist, or the route is hidden for the current state, listener, or transport.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictProblem:
      description: The validated enrollment certificate or another required state transition prerequisite is not ready.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionProblem:
      description: A supplied entity validator is not strong and current, or persisted state fails its required integrity precondition.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequiredProblem:
      description: The condition header required for the current managed-config lifecycle state is missing or the wrong header family was used.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    GetMethodNotAllowedProblem:
      description: The route only accepts GET in the current state and transport.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PostMethodNotAllowedProblem:
      description: The route only accepts POST in the current state and transport.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: POST
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConfigMethodNotAllowedProblem:
      description: The configuration resource only accepts GET or PUT in the current state and transport.
      headers:
        Allow:
          required: true
          schema:
            type: string
            const: GET, PUT
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLargeProblem:
      description: The request body exceeds the route-specific bounded input limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaTypeProblem:
      description: The request Content-Type is not application/json.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedFormMediaTypeProblem:
      description: The request Content-Type is not application/x-www-form-urlencoded.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotAcceptableProblem:
      description: The requested representation does not allow text/event-stream.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    EventGapProblem:
      description: Last-Event-ID refers to events no longer retained for this job.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/EventGapProblem"
    TooManyRequestsProblem:
      description: An authentication rate limit or the global SSE connection limit was reached.
      headers:
        Retry-After:
          required: true
          description: Seconds until another attempt should be made.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestCanceledProblem:
      description: Request processing was canceled.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalProblem:
      description: The daemon could not read state, authorize, map, or encode the response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailableProblem:
      description: Authentication state, persistence, or auditing is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConfigPutServiceUnavailableProblem:
      description: |
        Configuration persistence or auditing is unavailable. A problem whose
        `code` is `config_recovery_required` has an indeterminate commit result:
        the redo WAL may already be durable and a later supported reader may
        finish rolling it forward. The client must GET the configuration and
        inspect its current ETag/state before deciding whether to retry. Other
        503 codes describe a write that was not published.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    DeadlineProblem:
      description: The request deadline expired before the query completed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    APIVersion:
      type: string
      const: anas.dev/api/v1
    NextCursor:
      type: [string, "null"]
      minLength: 1
      maxLength: 512
    EmptyObject:
      type: object
      additionalProperties: false
    BackupTargetID:
      type: string
      minLength: 1
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
      description: Opaque root-configured backup destination ID, never a host path.
    MaintenanceSnapshotID:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9._-]+$"
    BackupID:
      type: string
      minLength: 1
      maxLength: 255
      pattern: "^[A-Za-z0-9._-]+$"
    BackupPlanID:
      type: string
      pattern: "^bkp_[0-9a-f]{64}$"
    SnapshotCreateRequest:
      type: object
      additionalProperties: false
      required: [include_userdata]
      properties:
        label:
          type: string
          maxLength: 255
        include_userdata:
          type: boolean
          description: Explicit opt-in; user data is not captured when false.
    SnapshotActionRequest:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          maxLength: 255
          description: Used only by pin and unpin; verify requires an empty object.
    SnapshotListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, keep_auto, snapshots, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        keep_auto:
          type: integer
          minimum: 0
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/SnapshotRecord"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    SnapshotRecord:
      type: object
      additionalProperties: false
      required: [id, kind, pinned, created_at, reason, label, deployment_id, complete, config_matches_current, size_bytes, modules, healthy, includes_userdata]
      properties:
        id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        kind:
          type: string
        pinned:
          type: boolean
        created_at:
          type: string
        reason:
          type: string
        label:
          type: string
        deployment_id:
          type: string
        complete:
          type: boolean
        config_matches_current:
          type: boolean
        size_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
        modules:
          type: object
          additionalProperties:
            type: string
        healthy:
          type: boolean
        includes_userdata:
          type: boolean
    BackupPlanRequest:
      type: object
      additionalProperties: false
      required: [target_id, no_stop, skip_userdata]
      properties:
        target_id:
          $ref: "#/components/schemas/BackupTargetID"
        mode:
          type: string
          enum: [snapshot, send, send-file, copy]
        snapshot_id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        parent_backup_id:
          $ref: "#/components/schemas/BackupID"
        no_stop:
          type: boolean
        skip_userdata:
          type: boolean
          description: Explicitly omit user data; false preserves the default inclusion.
    BackupPlanResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, target_id, plan_id, capabilities, plan]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        target_id:
          $ref: "#/components/schemas/BackupTargetID"
        plan_id:
          $ref: "#/components/schemas/BackupPlanID"
        capabilities:
          $ref: "#/components/schemas/BackupCapabilities"
        plan:
          $ref: "#/components/schemas/BackupPlan"
    BackupCapabilities:
      type: object
      additionalProperties: false
      required: [source, target, tools, privileged, estimate, modes, recommended]
      properties:
        source:
          $ref: "#/components/schemas/BackupSource"
        target:
          $ref: "#/components/schemas/BackupTarget"
        tools:
          type: object
          additionalProperties:
            type: boolean
        privileged:
          type: boolean
        estimate:
          $ref: "#/components/schemas/BackupEstimate"
        modes:
          type: array
          items:
            $ref: "#/components/schemas/BackupMode"
        recommended:
          type: string
    BackupSource:
      type: object
      additionalProperties: false
      required: [fs_type, data_is_subvolume, data_is_mountpoint, data_fully_readable]
      properties:
        fs_type: { type: string }
        data_is_subvolume: { type: boolean }
        data_is_mountpoint: { type: boolean }
        data_fully_readable: { type: boolean }
    BackupTarget:
      type: object
      additionalProperties: false
      required: [id, exists, writable, fs_type, free_bytes]
      properties:
        id:
          $ref: "#/components/schemas/BackupTargetID"
        exists: { type: boolean }
        writable: { type: boolean }
        fs_type: { type: string }
        free_bytes:
          type: [integer, "null"]
          format: int64
          minimum: 0
    BackupEstimate:
      type: object
      additionalProperties: false
      required: [data_bytes, userdata_bytes, state_bytes, active_deployment_bytes, total_bytes]
      properties:
        data_bytes: { type: integer, format: int64, minimum: 0 }
        userdata_bytes: { type: integer, format: int64, minimum: 0 }
        state_bytes: { type: integer, format: int64, minimum: 0 }
        active_deployment_bytes: { type: integer, format: int64, minimum: 0 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
    BackupMode:
      type: object
      additionalProperties: false
      required: [id, available, incremental, parents, notes]
      properties:
        id: { type: string }
        available: { type: boolean }
        reason: { type: string }
        incremental: { type: boolean }
        parents:
          type: array
          items: { type: string }
        notes:
          type: array
          items: { type: string }
    BackupPlan:
      type: object
      additionalProperties: false
      required: [mode, incremental, transfer_bytes, dest_free_after_bytes, includes, excludes, stop_containers, containers_to_stop, estimated_downtime_seconds, warnings, actions]
      properties:
        mode: { type: string }
        incremental: { type: boolean }
        parent: { type: string }
        transfer_bytes: { type: integer, format: int64, minimum: 0 }
        dest_free_after_bytes:
          type: [integer, "null"]
          format: int64
        includes:
          type: array
          items: { type: string }
        excludes:
          type: array
          items: { type: string }
        stop_containers: { type: boolean }
        containers_to_stop:
          type: array
          items: { type: string }
        estimated_downtime_seconds: { type: integer, minimum: 0 }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/BackupWarning"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/BackupAction"
    BackupWarning:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string }
    BackupAction:
      type: object
      additionalProperties: false
      required: [step, op]
      properties:
        step: { type: integer, minimum: 1 }
        op: { type: string }
        target:
          type: string
          description: Omitted by the HTTP projection when the CLI value is a host path.
        count: { type: integer, minimum: 0 }
    BackupListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, target_id, backups, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id: { type: string }
        target_id:
          $ref: "#/components/schemas/BackupTargetID"
        backups:
          type: array
          items:
            $ref: "#/components/schemas/BackupRecord"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    BackupRecord:
      type: object
      additionalProperties: false
      required: [id, mode, created_at, incremental, size_bytes, deployment_id, modules, complete, chain_broken, includes_userdata]
      properties:
        id:
          $ref: "#/components/schemas/BackupID"
        mode: { type: string }
        created_at: { type: string }
        source_snapshot: { type: string }
        incremental: { type: boolean }
        parent: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        deployment_id: { type: string }
        modules:
          type: object
          additionalProperties: { type: string }
        complete: { type: boolean }
        chain_broken: { type: boolean }
        includes_userdata: { type: boolean }
    LocalAdminListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, accounts, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id: { type: string }
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/LocalAdminRecord"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    LocalAdminRecord:
      type: object
      additionalProperties: false
      required: [target_id, module, account, purpose, username, url]
      properties:
        target_id:
          type: string
          pattern: "^lad_[0-9a-f]{64}$"
          description: Opaque server-generated target bound into credential-reveal step-up proofs.
        module: { type: string }
        account: { type: string }
        purpose: { type: string }
        username: { type: string }
        url: { type: string }
    LocalAdminRevealRequest:
      type: object
      additionalProperties: false
      required: [step_up_proof]
      properties:
        step_up_proof:
          type: string
          pattern: "^sup_[A-Za-z0-9_-]{43}$"
          writeOnly: true
    LocalAdminRevealResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, module, account, purpose, username, url, password]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id: { type: string }
        module: { type: string }
        account: { type: string }
        purpose: { type: string }
        username: { type: string }
        url: { type: string }
        password:
          type: string
          minLength: 1
          description: Sensitive one-time display value; the response is always marked Cache-Control no-store.
    TerminalActionRequest:
      oneOf:
        - $ref: "#/components/schemas/TerminalSnapshotRestoreRequest"
        - $ref: "#/components/schemas/TerminalSnapshotDeleteRequest"
        - $ref: "#/components/schemas/TerminalBackupCreateRequest"
        - $ref: "#/components/schemas/TerminalBackupRestoreRequest"
        - $ref: "#/components/schemas/TerminalBackupVerifyRequest"
    TerminalSnapshotRestoreRequest:
      type: object
      additionalProperties: false
      required: [operation, snapshot]
      properties:
        operation: { const: snapshot.restore }
        snapshot:
          $ref: "#/components/schemas/TerminalSnapshotRestoreTarget"
    TerminalSnapshotDeleteRequest:
      type: object
      additionalProperties: false
      required: [operation, snapshot]
      properties:
        operation: { const: snapshot.delete }
        snapshot:
          $ref: "#/components/schemas/TerminalSnapshotDeleteTarget"
    TerminalSnapshotRestoreTarget:
      type: object
      additionalProperties: false
      required: [id, restore_userdata]
      properties:
        id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        restore_userdata: { type: boolean }
    TerminalSnapshotDeleteTarget:
      type: object
      additionalProperties: false
      required: [id, force]
      properties:
        id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        force: { type: boolean }
    TerminalBackupCreateRequest:
      type: object
      additionalProperties: false
      required: [operation, backup]
      properties:
        operation: { const: backup.create }
        backup:
          $ref: "#/components/schemas/TerminalBackupCreateTarget"
    TerminalBackupRestoreRequest:
      type: object
      additionalProperties: false
      required: [operation, backup]
      properties:
        operation: { const: backup.restore }
        backup:
          $ref: "#/components/schemas/TerminalBackupExistingTarget"
    TerminalBackupVerifyRequest:
      type: object
      additionalProperties: false
      required: [operation, backup]
      properties:
        operation: { const: backup.verify }
        backup:
          $ref: "#/components/schemas/TerminalBackupExistingTarget"
    TerminalBackupCreateTarget:
      type: object
      additionalProperties: false
      required: [target_id, plan_id, mode, no_stop, skip_userdata]
      properties:
        target_id:
          $ref: "#/components/schemas/BackupTargetID"
        plan_id:
          $ref: "#/components/schemas/BackupPlanID"
        mode:
          type: string
          enum: [snapshot, send, send-file, copy]
        snapshot_id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        parent_backup_id:
          $ref: "#/components/schemas/BackupID"
        no_stop: { type: boolean }
        skip_userdata:
          type: boolean
          description: Explicitly omit user data; false preserves backup create's default inclusion.
    TerminalBackupExistingTarget:
      type: object
      additionalProperties: false
      required: [target_id, backup_id]
      properties:
        target_id:
          $ref: "#/components/schemas/BackupTargetID"
        backup_id:
          $ref: "#/components/schemas/BackupID"
    TerminalActionPreviewResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, operation, target, impact, argv, display, cli_contract]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id: { type: string }
        operation:
          type: string
          enum: [snapshot.restore, snapshot.delete, backup.create, backup.restore, backup.verify]
        target:
          $ref: "#/components/schemas/TerminalActionTarget"
        impact:
          $ref: "#/components/schemas/TerminalActionImpact"
        argv:
          type: array
          minItems: 1
          items: { type: string }
        display:
          type: string
          minLength: 1
          description: POSIX-shell-safe display that losslessly round-trips to argv.
        cli_contract:
          type: string
          minLength: 1
    TerminalActionTarget:
      type: object
      additionalProperties: false
      properties:
        snapshot_id:
          $ref: "#/components/schemas/MaintenanceSnapshotID"
        backup_target_id:
          $ref: "#/components/schemas/BackupTargetID"
        backup_plan_id:
          $ref: "#/components/schemas/BackupPlanID"
        backup_id:
          $ref: "#/components/schemas/BackupID"
    TerminalActionImpact:
      type: object
      additionalProperties: false
      required: [data, userdata, reversible]
      properties:
        data: { type: boolean }
        userdata: { type: boolean }
        reversible: { type: boolean }
    DeploymentPlanRequest:
      type: object
      additionalProperties: false
      properties:
        step_up_proof:
          type: string
          pattern: "^sup_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          description: Required in full state and forbidden during bootstrap.
        deployment_id:
          type: string
          maxLength: 255
          description: Optional existing ready deployment target bound into the full-state step-up proof.
    PlanDigest:
      type: string
      description: Stable SHA-256 digest of the complete typed plan and opaque config validator.
      pattern: "^[0-9a-f]{64}$"
    DeploymentPlanResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, job, plan, confirmation]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        job:
          $ref: "#/components/schemas/JobSummary"
        plan:
          $ref: "#/components/schemas/DeploymentPlan"
        confirmation:
          $ref: "#/components/schemas/DeploymentConfirmation"
    DeploymentPlan:
      type: object
      additionalProperties: false
      required:
        - config_validator
        - digest
        - modules
        - iam
        - module_plans
        - capability_bindings
        - dns_platforms
        - dns_credential_compatibility
        - dynamic_dns
        - module_lifecycles
      properties:
        config_validator:
          $ref: "#/components/schemas/ConfigValidator"
        digest:
          $ref: "#/components/schemas/PlanDigest"
        modules:
          type: array
          items:
            type: string
        iam:
          $ref: "#/components/schemas/DeploymentPlanIAM"
        module_plans:
          $ref: "#/components/schemas/NestedStringMap"
        capability_bindings:
          $ref: "#/components/schemas/NestedStringMap"
        dns_platforms:
          $ref: "#/components/schemas/StringMap"
        dns_credential_compatibility:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentDNSCredentialCompatibility"
        dynamic_dns:
          $ref: "#/components/schemas/DeploymentDynamicDNS"
        module_lifecycles:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentModuleLifecycle"
    DeploymentPlanIAM:
      type: object
      additionalProperties: false
      required: [provider, consumers]
      properties:
        provider:
          type: [string, "null"]
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentPlanIAMConsumer"
    DeploymentPlanIAMConsumer:
      type: object
      additionalProperties: false
      required: [module, interface]
      properties:
        module:
          type: string
        interface:
          type: string
    DeploymentDNSCredentialCompatibility:
      type: object
      additionalProperties: false
      required: [left, right, platform, compatibility]
      properties:
        left:
          type: string
        right:
          type: string
        platform:
          type: string
        compatibility:
          type: string
    DeploymentDynamicDNS:
      type: object
      additionalProperties: false
      required: [provider, self_managed, automatic]
      properties:
        provider:
          type: [string, "null"]
        self_managed:
          type: array
          items:
            type: string
        automatic:
          type: boolean
    DeploymentModuleLifecycle:
      type: object
      additionalProperties: false
      required: [module, status]
      properties:
        module:
          type: string
        status:
          type: string
    StringMap:
      type: object
      additionalProperties:
        type: string
    NestedStringMap:
      type: object
      additionalProperties:
        $ref: "#/components/schemas/StringMap"
    DeploymentConfirmation:
      type: object
      additionalProperties: false
      required: [token, expires_at, action, plan_job_id, config_validator, plan_digest]
      properties:
        token:
          type: string
          pattern: "^cnf_[0-9a-f]{64}$"
          description: One-use 256-bit proof returned only here and never persisted in plaintext.
        expires_at:
          type: string
          format: date-time
        action:
          type: string
          const: deployment.apply
        plan_job_id:
          type: string
          minLength: 1
          maxLength: 256
        config_validator:
          $ref: "#/components/schemas/ConfigValidator"
        plan_digest:
          $ref: "#/components/schemas/PlanDigest"
    DeploymentApplyRequest:
      type: object
      additionalProperties: false
      required:
        - plan_job_id
        - confirmation_token
        - expected_config_validator
        - expected_plan_digest
        - allow_risky
      properties:
        plan_job_id:
          type: string
          minLength: 1
          maxLength: 256
        confirmation_token:
          type: string
          pattern: "^cnf_[0-9a-f]{64}$"
          writeOnly: true
        step_up_proof:
          type: string
          pattern: "^sup_[A-Za-z0-9_-]{43}$"
          writeOnly: true
          description: Required for full-state direct apply and forbidden during bootstrap.
        expected_config_validator:
          $ref: "#/components/schemas/ConfigValidator"
        expected_plan_digest:
          $ref: "#/components/schemas/PlanDigest"
        deployment_id:
          type: string
          maxLength: 255
        build:
          type: boolean
          default: false
        update_lock:
          type: boolean
          default: false
        allow_risky:
          type: boolean
          description: Explicit even when false; omission is rejected.
        snapshot:
          type: boolean
          default: false
        no_snapshot:
          type: boolean
          default: false
    DeploymentApplyResponse:
      type: object
      additionalProperties: false
      required: [api_version, job, existing]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        job:
          $ref: "#/components/schemas/JobSummary"
        existing:
          type: boolean
    LifecycleActionRequest:
      type: object
      additionalProperties: false
      required: [modules]
      properties:
        modules:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        expected_deployment_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Required only when executing a previously returned preview.
        expected_digest:
          $ref: "#/components/schemas/PlanDigest"
        confirmed_modules:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
          description: Required only for execution and must exactly equal preview.affected_modules in order.
    LifecyclePreviewResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, preview]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        preview:
          $ref: "#/components/schemas/LifecyclePreview"
    LifecyclePreview:
      type: object
      additionalProperties: false
      required: [deployment_id, action, requested_modules, affected_modules, digest]
      properties:
        deployment_id:
          type: string
          minLength: 1
          maxLength: 255
        action:
          type: string
          enum: [start, stop, restart]
        requested_modules:
          type: array
          items:
            type: string
        affected_modules:
          type: array
          items:
            type: string
        digest:
          $ref: "#/components/schemas/PlanDigest"
    RollbackActionRequest:
      type: object
      additionalProperties: false
      required: [deployment_id]
      properties:
        deployment_id:
          type: string
          minLength: 1
          maxLength: 255
        expected_active_deployment:
          type: string
          minLength: 1
          maxLength: 255
          description: Required only when executing a previously returned preview.
        expected_digest:
          $ref: "#/components/schemas/PlanDigest"
        allow_risky:
          type: boolean
          description: Required only for execution and explicit even when false.
        confirmed_deployment_id:
          type: string
          minLength: 1
          maxLength: 255
          description: Required only for execution and must equal the preview target.
        confirmed_guarded_changes:
          type: array
          items:
            type: string
          description: Required only for execution and must exactly equal preview.guarded_changes in order.
    RollbackPreviewResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, preview]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        preview:
          $ref: "#/components/schemas/RollbackPreview"
    RollbackPreview:
      type: object
      additionalProperties: false
      required: [active_deployment, target_deployment, guarded_changes, data_touched, digest]
      properties:
        active_deployment:
          type: string
          minLength: 1
          maxLength: 255
        target_deployment:
          type: string
          minLength: 1
          maxLength: 255
        guarded_changes:
          type: array
          items:
            type: string
        data_touched:
          type: boolean
          const: false
        digest:
          $ref: "#/components/schemas/PlanDigest"
    ControlPlaneState:
      type: string
      enum: [bootstrap, enrollment, full]
    ConsoleRuntimeState:
      type: string
      enum: [m0, bootstrap, enrollment, full]
      description: Public capability state used by the console shell to select the safe entry flow.
    BootstrapExchangeRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          writeOnly: true
          description: The one-use bootstrap token printed by the local CLI.
    EnrollmentHandoffExchangeRequest:
      type: object
      additionalProperties: false
      required: [handoff]
      properties:
        handoff:
          type: string
          minLength: 1
          writeOnly: true
          description: The one-use handoff returned at the plaintext source origin.
    EnrollmentOwnerRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
    LocalStepUpRequest:
      type: object
      additionalProperties: false
      required: [action, workspace_id]
      properties:
        password:
          type: string
          minLength: 1
          format: password
          writeOnly: true
          description: Required only for the direct local-owner source; forbidden on the trusted-proxy source.
        action:
          type: string
          enum: [deployment.apply, local_admin.reveal]
        workspace_id:
          type: string
          minLength: 1
          maxLength: 256
        deployment_id:
          type: string
          maxLength: 255
          description: Optional target for deployment.apply; mutually exclusive with target_id.
        target_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: "^lad_[0-9a-f]{64}$"
          description: Required for local_admin.reveal; opaque server-generated target from the local-administrator list and mutually exclusive with deployment_id.
    LocalStepUpResponse:
      type: object
      additionalProperties: false
      required: [api_version, proof, expires_at, action, workspace_id]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        proof:
          type: string
          pattern: "^sup_[A-Za-z0-9_-]{43}$"
          description: Returned once; only its SHA-256 digest is persisted.
        expires_at:
          type: string
          format: date-time
        action:
          type: string
          enum: [deployment.apply, local_admin.reveal]
        workspace_id:
          type: string
          minLength: 1
          maxLength: 256
        deployment_id:
          type: string
          maxLength: 255
        target_id:
          type: string
          minLength: 1
          maxLength: 256
    CSRFResponse:
      type: object
      additionalProperties: false
      required: [api_version, csrf_token, expires_at]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        csrf_token:
          type: string
          minLength: 1
          description: Echo this value in X-CSRF-Token; it is also set in the pre-authentication cookie.
        expires_at:
          type: string
          format: date-time
    BootstrapSessionResponse:
      type: object
      additionalProperties: false
      required: [api_version, csrf_token, expires_at, idle_expires_at, state, transaction_id]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        csrf_token:
          type: string
          minLength: 1
          description: Session-bound CSRF value; the session token itself is only in the HttpOnly cookie.
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        state:
          $ref: "#/components/schemas/ControlPlaneState"
        transaction_id:
          type: string
          minLength: 1
    EnrollmentHandoffResponse:
      type: object
      additionalProperties: false
      required: [api_version, handoff, target_origin, form_action, expires_at]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        handoff:
          type: string
          minLength: 1
          description: One-use credential displayed only in this response and never persisted in plaintext.
        target_origin:
          type: string
          format: uri
          pattern: "^https://"
        form_action:
          type: string
          format: uri
          pattern: "^https://"
        expires_at:
          type: string
          format: date-time
    EnrollmentOwnerResponse:
      type: object
      additionalProperties: false
      required: [api_version, state]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        state:
          type: string
          const: full
    LocalSessionResponse:
      type: object
      additionalProperties: false
      required: [api_version, csrf_token, expires_at, idle_expires_at, state]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        csrf_token:
          type: string
          minLength: 1
          description: Session-bound CSRF value; the session token itself is only in the HttpOnly cookie.
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        state:
          type: string
          const: full
    SessionRefreshResponse:
      oneOf:
        - $ref: "#/components/schemas/BootstrapSessionResponse"
        - $ref: "#/components/schemas/LocalSessionResponse"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
    SystemResponse:
      type: object
      additionalProperties: false
      required: [api_version, build, capabilities, workspace_ids, backup_target_ids, certificate_issuer, console_state, listener, direct_recovery_urls, proxy_url]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        build:
          $ref: "#/components/schemas/BuildInfo"
        capabilities:
          $ref: "#/components/schemas/SystemCapabilities"
        workspace_ids:
          type: array
          items:
            type: string
          uniqueItems: true
        backup_target_ids:
          type: array
          description: Root-configured backup destination IDs; host paths are never exposed.
          items:
            $ref: "#/components/schemas/BackupTargetID"
          uniqueItems: true
        certificate_issuer:
          type: string
          enum: [none, temporary, internal, acme]
          description: Current validated serving-certificate source; `internal` is a supported trusted mode, not an error state.
        console_state:
          $ref: "#/components/schemas/ConsoleRuntimeState"
        listener:
          type: string
          enum: [direct, trusted_proxy]
          description: Physical listener that served this representation; the SPA uses it to avoid publishing local-login UI on the proxy entry.
        direct_recovery_urls:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uri
            pattern: "^https?://"
          description: Server-derived direct-listener origins shown as plain recovery references, never as a local-login fallback link on the trusted-proxy origin.
        proxy_url:
          type: [string, "null"]
          format: uri
          pattern: "^https://"
          description: Configured Traefik/OIDC public origin, or null when the trusted-proxy listener is disabled.
    BuildInfo:
      type: object
      additionalProperties: false
      required: [version, commit, date]
      properties:
        version:
          type: string
        commit:
          type: string
        date:
          type: string
          description: Build date supplied by the release process, or `unknown` in a development build.
    SystemCapabilities:
      type: object
      additionalProperties: false
      required: [read_only]
      properties:
        read_only:
          type: boolean
          description: False when the configured service exposes a supported mutating application service such as managed configuration writes.
    ConfigValidator:
      type: string
      description: Opaque 256-bit random managed-config generation validator without ETag quoting.
      pattern: "^cfgv-[0-9a-f]{64}$"
    ConfigPublicDocument:
      type: object
      description: |
        JSON-compatible normalized desired state. The server accepts and emits
        only registered structural and schema-addressed fields. The raw
        `secrets` mapping and every effective sensitive value are excluded.
      not:
        required: [secrets]
      additionalProperties: true
    ConfigSensitiveUnchanged:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: string
          const: unchanged
    ConfigSensitiveUnset:
      type: object
      additionalProperties: false
      required: [operation]
      properties:
        operation:
          type: string
          const: unset
    ConfigSensitiveSet:
      type: object
      additionalProperties: false
      required: [operation, value]
      properties:
        operation:
          type: string
          const: set
        value:
          type: string
          writeOnly: true
          description: The replacement secret; accepted only in a request and never echoed.
    ConfigSensitiveMutation:
      description: Explicit, non-ambiguous operation for one schema-declared sensitive field.
      oneOf:
        - $ref: "#/components/schemas/ConfigSensitiveUnchanged"
        - $ref: "#/components/schemas/ConfigSensitiveSet"
        - $ref: "#/components/schemas/ConfigSensitiveUnset"
    ConfigCandidate:
      type: object
      additionalProperties: false
      required: [config]
      properties:
        config:
          $ref: "#/components/schemas/ConfigPublicDocument"
        sensitive:
          type: object
          description: |
            Map keyed only by schema-declared sensitive field path. Omission of
            a path is treated as unchanged; supplied values must use exactly one
            tagged operation.
          propertyNames:
            type: string
            minLength: 1
            maxLength: 512
          additionalProperties:
            $ref: "#/components/schemas/ConfigSensitiveMutation"
    ConfigConstraints:
      type: object
      additionalProperties: false
      properties:
        minimum:
          type: integer
        maximum:
          type: integer
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 0
        pattern:
          type: string
        format:
          type: string
          enum: [iana_timezone, language_tag, locale, ipv4, dns_name]
    ConfigField:
      type: object
      additionalProperties: false
      allOf:
        - if:
            required: [sensitive]
            properties:
              sensitive:
                const: true
          then:
            required: [sensitive_state]
            not:
              required: [default]
      required:
        - path
        - document_path
        - module
        - parameter
        - type
        - allowed_values
        - has_default
        - default_source
        - input_required
        - must_resolve
        - constraints
        - sensitive
        - editable
        - effect
      properties:
        path:
          type: string
          minLength: 1
        document_path:
          type: array
          minItems: 1
          description: Canonical path of this field inside the public config document.
          items:
            type: string
            minLength: 1
        module:
          type: string
          minLength: 1
        parameter:
          type: string
          minLength: 1
        type:
          type: string
          enum: [unknown, string, bool, int, enum]
        allowed_values:
          type: array
          items:
            type: string
          uniqueItems: true
        default:
          type: string
          description: Omitted for sensitive fields and when no public literal default is available.
        has_default:
          type: boolean
        default_source:
          type: string
          enum: [none, static, host, runtime, inherited, generated]
        input_required:
          type: boolean
        must_resolve:
          type: boolean
        constraints:
          $ref: "#/components/schemas/ConfigConstraints"
        sensitive:
          type: boolean
        sensitive_state:
          type: string
          enum: [set, unset]
          description: Present only for an effective sensitive field; never contains its value.
        editable:
          type: boolean
          description: False for guarded effects and effective sensitive aliases that cannot be safely round-tripped.
        edit_command:
          type: string
          description: Safe operator guidance, not executable argv supplied by the client.
        effect:
          type: string
          minLength: 1
        apply:
          type: string
        description:
          type: string
    ConfigChange:
      type: object
      additionalProperties: false
      required: [path, change, effect, sensitive, editable]
      properties:
        path:
          type: string
          minLength: 1
        change:
          type: string
          enum: [add, change, remove]
        effect:
          type: string
          minLength: 1
        apply:
          type: string
        sensitive:
          type: boolean
        editable:
          type: boolean
    ConfigSnapshotResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, managed, config, available_modules, fields]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        managed:
          type: boolean
        config:
          $ref: "#/components/schemas/ConfigPublicDocument"
        available_modules:
          type: array
          description: Canonically ordered registry Module names available for selection, including Modules with no configuration fields.
          items:
            type: string
            minLength: 1
          uniqueItems: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfigField"
    ConfigValidationResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, config, changes]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        base_validator:
          $ref: "#/components/schemas/ConfigValidator"
        config:
          $ref: "#/components/schemas/ConfigPublicDocument"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ConfigChange"
    ConfigPutResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, validator, config, available_modules, fields, changes]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        previous_validator:
          $ref: "#/components/schemas/ConfigValidator"
        validator:
          $ref: "#/components/schemas/ConfigValidator"
        config:
          $ref: "#/components/schemas/ConfigPublicDocument"
        available_modules:
          type: array
          description: Canonically ordered registry Module names available for selection.
          items:
            type: string
            minLength: 1
          uniqueItems: true
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ConfigField"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ConfigChange"
    AuditEventListResponse:
      type: object
      additionalProperties: false
      required: [api_version, items, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        next_cursor:
          $ref: "#/components/schemas/NullableString"
    AuditEvent:
      type: object
      additionalProperties: false
      required: [sequence, timestamp, type]
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestamp:
          type: string
          format: date-time
        type:
          type: string
          minLength: 1
        actor:
          type: string
        workspace_id:
          type: string
        outcome:
          type: string
        details:
          type: object
          description: Value-safe details after the audit writer's mandatory credential redaction.
          additionalProperties: true
    JobListResponse:
      type: object
      additionalProperties: false
      required: [api_version, items, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        items:
          type: array
          items:
            $ref: "#/components/schemas/JobSummary"
        next_cursor:
          $ref: "#/components/schemas/NullableString"
    JobDetailResponse:
      type: object
      additionalProperties: false
      required: [api_version, job]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        job:
          $ref: "#/components/schemas/JobDetail"
    JobSummary:
      type: object
      additionalProperties: false
      required: [id, kind, workspace_id, mutating, status, progress, created_at, revision]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        mutating:
          type: boolean
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 0
    JobDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - workspace_id
        - mutating
        - status
        - progress
        - created_at
        - revision
        - warnings
        - needs_compensation_check
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          minLength: 1
        workspace_id:
          type: string
          minLength: 1
        mutating:
          type: boolean
        status:
          $ref: "#/components/schemas/JobStatus"
        progress:
          type: integer
          minimum: 0
          maximum: 100
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            type: string
        result:
          type: object
          additionalProperties: true
        error:
          $ref: "#/components/schemas/JobError"
        needs_compensation_check:
          type: boolean
      description: Deliberately omits the persisted request and raw creator identity.
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, canceled, interrupted]
    JobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        detail:
          $ref: "#/components/schemas/JobErrorDetail"
    JobErrorDetail:
      type: object
      additionalProperties: false
      required: [blocked]
      properties:
        blocked:
          type: array
          minItems: 1
          maxItems: 256
          items:
            type: string
            minLength: 1
            maxLength: 4096
    JobEvent:
      type: object
      additionalProperties: false
      required: [api_version, id, job_id, timestamp, kind]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        id:
          type: integer
          minimum: 1
        job_id:
          type: string
        timestamp:
          type: string
          format: date-time
        kind:
          type: string
        data:
          type: object
          additionalProperties: true
      description: JSON object serialized in each SSE `job` event's data field.
    EventGapProblem:
      type: object
      additionalProperties: false
      required:
        - api_version
        - type
        - title
        - status
        - detail
        - code
        - job_id
        - requested_after
        - pruned_through
        - oldest_available
        - latest_id
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          const: 410
        detail:
          type: string
        code:
          type: string
          const: event_gap
        job_id:
          type: string
        requested_after:
          type: integer
          minimum: 0
        pruned_through:
          type: integer
          minimum: 0
        oldest_available:
          type: integer
          minimum: 0
        latest_id:
          type: integer
          minimum: 0
    WorkspaceListResponse:
      type: object
      additionalProperties: false
      required: [api_version, items, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceListItem"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    WorkspaceListItem:
      type: object
      additionalProperties: false
      required: [id]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$"
    WorkspaceStatusResponse:
      type: object
      additionalProperties: false
      required:
        - api_version
        - workspace_id
        - active_deployment
        - runtime_status
        - runtime_healthy
        - runtime_probe_error
        - module_runtime
        - activated_at
        - verified_at
        - previous_deployments
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        active_deployment:
          $ref: "#/components/schemas/NullableString"
        runtime_status:
          type: [string, "null"]
          enum: [running, stopped, degraded, not_applicable, unknown, null]
          description: Live Compose-derived aggregate; never copied from active.yml.
        runtime_healthy:
          $ref: "#/components/schemas/NullableBoolean"
        runtime_probe_error:
          type: [string, "null"]
          enum: [runtime_probe_unavailable, runtime_probe_failed, null]
        module_runtime:
          type: array
          items:
            $ref: "#/components/schemas/ModuleRuntimeStatus"
        activated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        verified_at:
          $ref: "#/components/schemas/NullableTimestamp"
        previous_deployments:
          type: array
          items:
            type: string
    ModuleRuntimeStatus:
      type: object
      additionalProperties: false
      required: [module, runtime, health, containers]
      properties:
        module:
          type: string
        runtime:
          type: string
          enum: [running, stopped, degraded, not_applicable]
        health:
          type: string
          enum: [healthy, unhealthy, starting, none, not_applicable]
        containers:
          type: integer
          minimum: 0
    DeploymentListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, items, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentState"
        next_cursor:
          $ref: "#/components/schemas/NullableString"
    DeploymentDetailResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, deployment, state]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        deployment:
          $ref: "#/components/schemas/Deployment"
        state:
          $ref: "#/components/schemas/DeploymentState"
    DeploymentState:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - created_at
        - activated_at
        - deactivated_at
        - verified_at
        - predecessor
        - failure
      properties:
        id:
          type: string
        status:
          type: string
          description: One of `ready`, `active`, `previous`, or `failed`; empty when a legacy artifact has no independent state record.
        created_at:
          type: string
        activated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        deactivated_at:
          $ref: "#/components/schemas/NullableTimestamp"
        verified_at:
          $ref: "#/components/schemas/NullableTimestamp"
        predecessor:
          $ref: "#/components/schemas/NullableString"
        failure:
          $ref: "#/components/schemas/NullableString"
    Deployment:
      type: object
      additionalProperties: false
      description: Safe, path-free projection of an `anas.deployment/v1` manifest.
      required:
        - api_version
        - id
        - created_at
        - images_built
        - build_acceleration
        - module_order
        - capability_bindings
        - modules
        - settings
        - resources
        - snapshot
      properties:
        api_version:
          type: string
          const: anas.deployment/v1
        id:
          type: string
        created_at:
          type: string
        images_built:
          type: boolean
        build_acceleration:
          type: boolean
        module_order:
          type: array
          items:
            type: string
        capability_bindings:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: string
        modules:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DeploymentModule"
        settings:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DeploymentSetting"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/DeploymentResource"
        snapshot:
          $ref: "#/components/schemas/DeploymentSnapshotPolicy"
    DeploymentModule:
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - revision
        - app_version
        - lifecycle
        - artifact_deployment
        - data_breaking
        - runtime
        - env_prefix
        - consumes
        - dependencies
        - host_lan
      properties:
        name:
          type: string
        version:
          type: string
        revision:
          type: integer
        app_version:
          $ref: "#/components/schemas/NullableString"
        lifecycle:
          type: string
        artifact_deployment:
          type: string
        data_breaking:
          type: [array, "null"]
          items:
            type: string
        runtime:
          type: string
        env_prefix:
          $ref: "#/components/schemas/NullableString"
        consumes:
          type: array
          items:
            type: string
        dependencies:
          type: array
          items:
            type: string
        host_lan:
          $ref: "#/components/schemas/NullableString"
    DeploymentSetting:
      type: object
      additionalProperties: false
      required: [module, parameter, effect, apply]
      properties:
        module:
          type: string
        parameter:
          type: string
        effect:
          type: string
        apply:
          $ref: "#/components/schemas/NullableString"
    DeploymentResource:
      type: object
      additionalProperties: false
      required: [consumer, id, contract, contract_version, provider, interface]
      properties:
        consumer:
          type: string
        id:
          type: string
        contract:
          type: string
        contract_version:
          type: string
        provider:
          type: string
        interface:
          type: string
    DeploymentSnapshotPolicy:
      type: object
      additionalProperties: false
      required: [backend, keep_auto]
      properties:
        backend:
          $ref: "#/components/schemas/NullableString"
        keep_auto:
          type: integer
    ModuleCommandListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, active_deployment, items, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        active_deployment:
          $ref: "#/components/schemas/NullableString"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCommand"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ModuleListResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, active_deployment, modules, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        active_deployment:
          $ref: "#/components/schemas/NullableString"
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleState"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ModuleState:
      type: object
      additionalProperties: false
      required: [name, configuration_state, installed_release, desired_release, deployed_release, runtime, health, containers, dependencies, entry_points]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        configuration_state:
          type: string
          enum: [available, selected, dependency]
        installed_release:
          $ref: "#/components/schemas/NullableString"
        desired_release:
          $ref: "#/components/schemas/NullableString"
        deployed_release:
          $ref: "#/components/schemas/NullableString"
        runtime:
          type: string
          minLength: 1
        health:
          type: string
          minLength: 1
        containers:
          type: integer
          minimum: 0
        dependencies:
          type: array
          items:
            type: string
          uniqueItems: true
        entry_points:
          type: array
          items:
            $ref: "#/components/schemas/ModuleManagementSurface"
    ModuleManagementSurface:
      type: object
      additionalProperties: false
      required: [id, uri, authentication]
      properties:
        id:
          type: string
          minLength: 1
        uri:
          type: string
          format: uri
          pattern: "^https?://"
        authentication:
          type: string
    ModuleCatalogResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, catalog, next_cursor]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
          minLength: 1
        catalog:
          $ref: "#/components/schemas/ModuleCatalog"
        next_cursor:
          $ref: "#/components/schemas/NextCursor"
    ModuleCatalog:
      type: object
      additionalProperties: false
      required: [source, catalog_reference, catalog_digest, source_commit, modules]
      properties:
        source:
          type: string
          minLength: 1
        catalog_reference:
          type: string
          minLength: 1
        catalog_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        source_commit:
          type: string
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCatalogEntry"
    ModuleCatalogEntry:
      type: object
      additionalProperties: false
      required: [module, release, repository, platforms]
      properties:
        module:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
        release:
          type: string
          minLength: 1
        repository:
          type: string
          minLength: 1
        platforms:
          type: array
          items:
            type: string
          uniqueItems: true
    ModuleUpdateRequest:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [sync, update]
        modules:
          type: array
          description: Valid only for update mode; omission updates all selected Modules.
          items:
            type: string
            pattern: "^[a-z][a-z0-9_]*$"
          uniqueItems: true
    ModuleCommandDetailResponse:
      type: object
      additionalProperties: false
      required: [api_version, workspace_id, command]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        workspace_id:
          type: string
        command:
          $ref: "#/components/schemas/ModuleCommand"
    ModuleCommand:
      type: object
      additionalProperties: false
      required:
        - module
        - release
        - deployment_id
        - id
        - title
        - description
        - mode
        - risk
        - runtime_state
        - lock
        - timeout_seconds
        - cancellable
        - parameters
        - digest
        - available
      properties:
        module:
          type: string
        release:
          type: string
        deployment_id:
          type: string
        id:
          type: string
          pattern: "^[a-z][a-z0-9-]{0,62}$"
        title:
          type: string
        description:
          type: string
        mode:
          type: string
          enum: [query, change]
        risk:
          type: string
          enum: [normal, destructive]
        runtime_state:
          type: string
          enum: [running, stopped, any]
        lock:
          type: string
          enum: [module_read, module_write, workspace_write]
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        cancellable:
          type: string
          enum: ["false", "true", safe_points]
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ModuleCommandParameter"
        digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        available:
          type: boolean
        unavailable_reason:
          type: string
    ModuleCommandParameter:
      type: object
      additionalProperties: false
      required: [name, title, description, type, allowed_values, constraints, required]
      properties:
        name:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [string, int, bool, enum]
        allowed_values:
          type: array
          items:
            type: string
          uniqueItems: true
        constraints:
          $ref: "#/components/schemas/ModuleCommandConstraints"
        required:
          type: boolean
        default:
          oneOf:
            - type: string
            - type: integer
            - type: boolean
    ModuleCommandConstraints:
      type: object
      additionalProperties: false
      properties:
        minimum:
          type: integer
        maximum:
          type: integer
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 0
        pattern:
          type: string
        format:
          type: string
    NullableString:
      type: [string, "null"]
    NullableBoolean:
      type: [boolean, "null"]
    NullableTimestamp:
      type: [string, "null"]
    Problem:
      type: object
      additionalProperties: false
      required: [api_version, type, title, status, detail, code]
      properties:
        api_version:
          $ref: "#/components/schemas/APIVersion"
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
