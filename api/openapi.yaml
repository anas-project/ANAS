  /api/v1/workspaces/{ws}/config:
    parameters:
      - $ref: "#/components/parameters/WorkspaceID"
    get:
      operationId: getWorkspaceConfig
      summary: Read the normalized desired configuration and its field metadata
      description: |
        Returns a public projection of the current desired configuration. Raw
        Secret Store values, `secrets`, sensitive defaults, and sensitive field
        values are never returned. A sensitive field is represented only by its
        `set` or `unset` state in the field metadata. When the configuration is
        already managed, the response carries the strong ETag that a subsequent
        PUT must copy byte-for-byte into If-Match. A first, unmanaged workspace
        has no ETag. The response is never cacheable.
      tags: [Configuration]
      security:
        - bootstrapSessionCookie: []
        - localSessionCookie: []
      x-anas-permission: config.read
      x-anas-scope: workspace
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        bootstrap: {authentication: bootstrap, transports: [plaintext, tls]}
        full: {authentication: owner, transports: [tls]}
      responses:
        "200":
          description: The normalized public configuration and schema projection.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            ETag:
              $ref: "#/components/headers/ManagedConfigETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigSnapshotResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/ConfigMethodNotAllowedProblem"
        "408":
          $ref: "#/components/responses/RequestCanceledProblem"
        "412":
          $ref: "#/components/responses/PreconditionProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/DeadlineProblem"
    put:
      operationId: putWorkspaceConfig
      summary: Atomically save a normalized desired configuration
      description: |
        Validates and saves desired state only; it does not plan, apply, or
        otherwise change the running environment. An already managed
        configuration requires exactly one strong If-Match value copied from
        GET. The first managed write instead requires exactly
        `If-None-Match: *`. Sending both header families, multiple values, or a
        malformed entity tag is a 400. Omitting the required family or using
        the family for the other lifecycle state is a 428. A weak If-Match,
        wildcard If-Match, non-wildcard If-None-Match, stale validator, or a manual
        edit to config.yml is a 412. The configuration file, Secret Store, and
        managed state are committed as one recoverable transaction. Each actual
        generation receives a fresh random opaque validator; its internal
        content digest is never exposed. The
        response is never cacheable.
      tags: [Configuration]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/ConfigIfMatch"
        - $ref: "#/components/parameters/ConfigIfNoneMatch"
      security:
        - bootstrapSessionCookie: []
          csrfHeader: []
        - localSessionCookie: []
          csrfHeader: []
      x-anas-permission: config.write
      x-anas-scope: workspace
      x-anas-listeners: [direct, trusted_proxy]
      x-anas-state-access:
        bootstrap: {authentication: bootstrap, transports: [plaintext, tls]}
        full: {authentication: owner, transports: [tls]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigCandidate"
      responses:
        "200":
          description: The new managed desired configuration; no apply was started.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            ETag:
              $ref: "#/components/headers/ManagedConfigETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPutResponse"
        "400":
          $ref: "#/components/responses/BadRequestProblem"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "403":
          $ref: "#/components/responses/ForbiddenProblem"
        "404":
          $ref: "#/components/responses/NotFoundProblem"
        "405":
          $ref: "#/components/responses/ConfigMethodNotAllowedProblem"
        "408":
          $ref: "#/components/responses/RequestCanceledProblem"
        "412":
          $ref: "#/components/responses/PreconditionProblem"
        "413":
          $ref: "#/components/responses/PayloadTooLargeProblem"
        "415":
          $ref: "#/components/responses/UnsupportedMediaTypeProblem"
        "428":
          $ref: "#/components/responses/PreconditionRequiredProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ConfigPutServiceUnavailableProblem"
        "504":
          $ref: "#/components/responses/DeadlineProblem"
