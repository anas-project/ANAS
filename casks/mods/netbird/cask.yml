api_version: anas.dev/v1
kind: Cask
name: netbird
version: 0.25.5
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: NetBird
description: Incomplete WireGuard overlay network scaffold; excluded from recommended deployments.
category: network
status: experimental
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - oidc
        prefer:
          - oidc
config:
  defaults:
    domain_prefix: netbird
    adminer_enabled: "false"
    iam_protocol: auto
  # Generic client registration and app-launcher metadata published to
  # whichever IAM the deployment selected.
  exports:
    - ANAS_IAM_CLIENT__NETBIRD__*
    - APPS_LIST*
  # This cask's own IAM binding. It reads no other consumer's binding and no
  # IAM-implementation variable.
  consumes:
    - ANAS_IAM_BINDING__NETBIRD__*
  changes:
    iam_protocol:
      effect: container_recreate
      apply: recreate-netbird
      description: The OIDC issuer and client configuration change together.
features:
  generated_secrets: true
  domain: true
services:
  optional:
    - name: NETBIRD_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
