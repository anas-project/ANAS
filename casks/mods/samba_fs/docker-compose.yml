services:
  anas_samba_fs:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    build:
      context: ./${MODULE_NAME}
      args:
        - CHINESE_SPEEDUP
    image: ${IMAGE_PREFIX}${MODULE_NAME}:26.04.0
    restart: unless-stopped
    hostname: ${SAMBA_FS_HOSTNAME}
    cap_add:
      - CAP_NET_ADMIN
    # Joining the domain needs the AD zone, which only the domain controller's
    # DNS serves. Without this the container inherits a resolver that cannot
    # answer for the realm and the join loops on
    # "kinit: Cannot contact any KDC".
    dns:
      - ${LOCAL_DNS_SERVER}
    dns_search:
      - ${SAMBA_DC_DNS_SEARCH}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wbinfo", "-t"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    volumes:
      - "${USERDATA_PATH}:/${USERDATA_NAME}"
      - "${DATA_PATH}/samba_fs/var:/var/lib/samba"
    # ports:
    #   - 445:445

networks:
  default:
    name: ${VLAN_INTERFACE}
    external: true
