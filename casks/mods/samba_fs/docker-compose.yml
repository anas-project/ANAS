version: "3.5"

services:
  anas_samba_fs:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    build:
      context: ./${MODULE_NAME}
      args:
        - CHINESE_SPEEDUP
    image: ${IMAGE_PREFIX}${MODULE_NAME}:latest
    restart: unless-stopped
    hostname: ${SAMBA_FS_HOSTNAME}
    cap_add:
      - CAP_NET_ADMIN
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wbinfo", "-t"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    volumes:
      - "${USERDATA_PATH}:/${USERDATA_NAME}"
      - "${DATA_PATH}/samba_fs/var:/var/lib/samba"
    # ports:
    #   - 445:445

networks:
  default:
    name: ${VLAN_INTERFACE}
    external: true
