api_version: anas.dev/v1
kind: Cask
name: samba_fs
version: 26.04.1
app_version: 4.23.6
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: Samba file server
description: File sharing service joined to the Samba domain.
category: storage
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - samba_dc
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    log_level: "1"
    wsdd_log_level: "0"
    hostname: SambaFS
  # The normalized share access mode is published without a cask prefix for
  # the file-sharing templates.
  exports:
    - SHARE_ACCESS_MODE
  consumes:
    - SHARE_ACCESS_MODE
    - USE_DEFAULT_DOMAIN
    # The domain join authenticates as this account. The password is sensitive
    # and owned by samba_dc, so it only crosses the boundary through an explicit
    # claim; without it the join runs with an empty password and locks the
    # account out after the tenth attempt.
    - SAMBA_DC_ADMIN_PASSWORD
  changes:
    hostname:
      effect: data_migrate
      apply: rejoin-samba-member
      description: The AD machine account and member join must be changed together.
    log_level:
      effect: container_recreate
      apply: recreate-samba-fs
      description: The generated smb.conf is installed during container initialization.
features:
  host_lan: required
logic:
  hook:
    command:
      - go
      - run
      - ./hook
