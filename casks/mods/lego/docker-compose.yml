services:
  anas_lego:
    build:
      context: ./lego
      args:
        - CHINESE_SPEEDUP
    container_name: ${CONTAINER_PREFIX}lego
    image: ${IMAGE_PREFIX}lego:5.3.1
    restart: unless-stopped
    volumes:
      - "${LEGO_DATA_PATH}:/certs"
    env_file:
      - .env

networks:
  default:
    driver: bridge
    name: ${NETWORK_PREFIX}lego
