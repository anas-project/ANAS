api_version: anas.dev/v1
kind: Cask
name: lego
version: 4.11.0
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: Lego ACME certificates
description: Issues and stores wildcard certificates used by Traefik and domain services.
category: certificate
runtime:
  type: compose
  compose_file: docker-compose.yml
config:
  required:
    - global.dns_provider
  defaults:
    dns_server: 223.5.5.5
  # Issuer-neutral certificate paths every TLS-serving or TLS-verifying cask
  # reads. LEGO_* remains this cask's private vocabulary.
  exports:
    - ANAS_TLS_*
  # DNS provider credentials from the user secrets section for the ACME
  # DNS-01 challenge.
  consumes:
    - DNSPOD_API_KEY
  changes:
    virtual_domain:
      effect: reconcile
      apply: reissue-certificates
      description: Switching between ACME and the internal CA replaces the certificate every service presents, and clients must re-trust it.
logic:
  hook:
    command:
      - go
      - run
      - ./hook
