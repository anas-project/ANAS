api_version: anas.dev/v1
kind: Cask
name: bind
version: 20.04.0
abi:
  supports:
    - anas.cask/v1
title: Bind DNS
description: Local DNS server integrated with Samba domain services.
category: network
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - core
config:
  defaults:
    debug: "true"
features:
  kerberos_env: true
  special_files:
    - bind/root/root/.ssh/id_rsa
logic:
  hook:
    command:
      - go
      - run
      - ./hook
