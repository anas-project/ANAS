api_version: anas.dev/v1
kind: Cask
name: core
version: 0.0.0
abi:
  supports:
    - anas.cask/v1
title: Core runtime
description: Shared runtime defaults, host network discovery, generated secrets, and directory variables.
category: system
runtime:
  type: builtin
  compose: none
config:
  required:
    - domain
    - email
    - default_root_password
  defaults:
    data_path: ~/data
    timezone: Asia/Hong_Kong
    container_prefix: anas_
    image_prefix: anas_
    network_prefix: anas_
    puid: "1000"
    pgid: "1000"
    basicauth_user: admin
    default_language: zh-cn
    chinese_speedup: "false"
    use_default_domain: "yes"
    ipv4: "true"
    ipv6: "true"
    dns_server: 223.5.5.5
    share_dir_name: Share
    userdata_name: userdata
    share_guest_ok: "Yes"
features:
  generated_secrets: true
  host_network_discovery: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
