api_version: anas.dev/v1
kind: Cask
name: llng
version: 2.0.64
app_version: 2.0.64
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: LemonLDAP::NG
description: SSO portal, SAML/OIDC identity provider, and app launcher.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  provides:
    - name: iam
      interfaces:
        - oidc
        - saml
dependencies:
  requires:
    - traefik
    - samba_dc
  requires_one:
    - capability: relational_database
      selected_by: db_type
      providers:
        - postgres
        - mariadb
      default: postgres
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: auth
    manager_domain_prefix: auth-manager
    test_domain_prefix: auth-test
    log_level: warn
    db_name: lemonldap-ng
    enable_test: "true"
    adminer_enabled: "false"
    db_type: auto
  # Endpoints this cask publishes for its bound consumers. The runner checks
  # that every binding actually received them.
  exports:
    - ANAS_IAM_BINDING_*
    - ANAS_IAM_PORTAL_URL
  # Generic client registration requests from consumers (translated into this
  # cask's private SAML SP / OIDC RP configuration during render_env), the app
  # launcher metadata, and the resolved database backend's real password.
  # Consumers publish these, so they are outside this cask's closure.
  consumes:
    - ANAS_IAM_CLIENTS
    - ANAS_IAM_OIDC_CLIENTS
    - ANAS_IAM_SAML_CLIENTS
    - ANAS_IAM_CLIENT_*
    - APPS_LIST*
    - POSTGRES_PASSWORD
    - MARIADB_PASSWORD
  changes:
    password:
      effect: credential_rotate
      apply: rotate-llng-admin-password
      sensitive: true
      description: Update the existing manager authentication state explicitly.
    db_type:
      effect: data_migrate
      apply: migrate-llng-database
      description: Existing LLNG data must be migrated explicitly.
    domain_prefix:
      effect: reconcile
      apply: reconcile-llng-domain
      description: SAML/OIDC metadata, clients, and proxy routes must change together.
features:
  generated_secrets: true
  after_start: copy_portal_logos
services:
  optional:
    - name: LLNG_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
