services:
  anas_mariadb:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    image: mariadb:12.3.2
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - "${DATA_PATH}/mariadb:/var/lib/mysql"
      - "./mariadb/root/etc/my.cnf.d/server.cnf:/etc/mysql/conf.d/anas.cnf:ro"
    healthcheck:
      test: ["CMD-SHELL", "unset MYSQL_HOST MARIADB_HOST; exec healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - mariadb

  anas_mariadb_adminer:
    image: adminer:5.5.0
    container_name: ${CONTAINER_PREFIX}mariadb_adminer
    restart: unless-stopped
    env_file:
      - .env
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.mariadb_adminer.entrypoints=https"
      - "traefik.http.routers.mariadb_adminer.rule=Host(`${MARIADB_ADMINER_DOMAIN}`)"
      - "traefik.http.routers.mariadb_adminer.tls=true"
      - "traefik.http.services.mariadb_adminer.loadbalancer.server.port=8080"
    networks:
      - mariadb
      - traefik

networks:
  mariadb:
    driver: bridge
    name: ${MARIADB_NETWORK_NAME}
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
