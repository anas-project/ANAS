api_version: anas.dev/v1
kind: Cask
name: mariadb
version: 12.3.2
revision: 1
app_version: 12.3.2
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: MariaDB
description: MariaDB database service with optional Adminer UI.
category: database
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    adminer_enabled: "false"
  # MySQL-compatibility aliases published for consumers that expect MYSQL_*.
  exports:
    - MYSQL_*
  changes:
    root_password:
      effect: credential_rotate
      apply: rotate-mariadb-root-password
      sensitive: true
      description: MYSQL_ROOT_PASSWORD only initializes an empty data directory.
    adminer_enabled:
      effect: container_recreate
      apply: recreate-mariadb-project
      description: The optional Compose service set changes.
services:
  optional:
    - name: mariadb_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
