api_version: anas.dev/v1
kind: Cask
name: mariadb
version: 10.11.4
abi:
  supports:
    - anas.cask/v1
title: MariaDB
description: MariaDB database service with optional Adminer UI.
category: database
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - core
  after:
    - traefik
config:
  defaults:
    adminer_enabled: "false"
  changes:
    root_password:
      effect: credential_rotate
      apply: rotate-mariadb-root-password
      sensitive: true
      description: MYSQL_ROOT_PASSWORD only initializes an empty data directory.
    adminer_enabled:
      effect: container_recreate
      apply: recreate-mariadb-project
      description: The optional Compose service set changes.
services:
  optional:
    - name: mariadb_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
