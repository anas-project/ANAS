api_version: anas.dev/v1
kind: Cask
name: mariadb
version: 10.11.4
abi:
  supports:
    - anas.cask/v1
title: MariaDB
description: MariaDB database service with optional Adminer UI.
category: database
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - core
  after:
    - traefik
config:
  defaults:
    adminer_enabled: "false"
services:
  optional:
    - name: mariadb_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
