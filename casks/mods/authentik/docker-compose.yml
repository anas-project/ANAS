services:
  anas_authentik_init:
    container_name: ${CONTAINER_PREFIX}authentik_init
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data && chown -R 1000:1000 /data"]
    restart: "no"
    volumes:
      - "${DATA_PATH}/authentik/data:/data"

  anas_authentik:
    container_name: ${CONTAINER_PREFIX}authentik
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    restart: unless-stopped
    command: server
    shm_size: 512mb
    depends_on:
      anas_authentik_init:
        condition: service_completed_successfully
    volumes:
      - "${DATA_PATH}/authentik/data:/data"
      # Declarative Application and Provider definitions generated from the
      # generic client registration requests.
      - "./blueprints:/blueprints/anas:ro"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.authentik.entrypoints=https"
      - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - traefik
      - authentik
      - db

  anas_authentik_worker:
    container_name: ${CONTAINER_PREFIX}authentik_worker
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    restart: unless-stopped
    # Import the trust anchor before the worker discovers the Samba AD
    # blueprint. authentik deliberately skips LDAP TLS verification when
    # peer_certificate is empty and does not fall back to the OS trust store,
    # so it has to be given something -- and that something must cover
    # whichever issuer is serving LDAPS. The internal CA alone stops working
    # the moment ACME succeeds for the domain, which fails here as
    # "unable to get local issuer certificate" and silently stops every sync.
    # peer_certificate is documented as a CA *chain*, so the bundle fits.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -m 0444 "/certs/$${ANAS_TLS_TRUST_BUNDLE_NAME}" /tmp/anas-samba-ad-ca.crt
        ak import_certificate \
          --certificate /tmp/anas-samba-ad-ca.crt \
          --name anas-samba-ad-ca
        exec ak worker
    shm_size: 512mb
    depends_on:
      anas_authentik_init:
        condition: service_completed_successfully
    volumes:
      - "${DATA_PATH}/authentik/data:/data"
      - "./blueprints:/blueprints/anas:ro"
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - authentik
      - db

  # Subscribes to the directory event journal and asks the scheduler to run the
  # Samba AD sync early. Reuses the authentik image purely so it can reach the
  # ORM: triggering through the REST API instead would mean provisioning a
  # long-lived token, and this needs no credential at all.
  anas_authentik_dirwatch:
    container_name: ${CONTAINER_PREFIX}authentik_dirwatch
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    restart: unless-stopped
    entrypoint: ["python3", "/app/directory_watch.py"]
    depends_on:
      anas_authentik:
        condition: service_healthy
    volumes:
      - "./dirwatch/directory_watch.py:/app/directory_watch.py:ro"
      # Read-only: a subscriber never writes to the journal.
      - "${AUTHENTIK_DIRWATCH_EVENTS_DIR}:/var/lib/anas-directory-events:ro"
      - "${DATA_PATH}/authentik/data:/data"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/directory_watch.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - authentik
      - db

networks:
  authentik:
    name: ${NETWORK_PREFIX}authentik
  db:
    name: $AUTHENTIK_NETWORK_DB
    external: true
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
