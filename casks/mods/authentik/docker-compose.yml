services:
  anas_authentik_init:
    container_name: ${CONTAINER_PREFIX}authentik_init
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data && chown -R 1000:1000 /data"]
    restart: "no"
    volumes:
      - "${DATA_PATH}/authentik/data:/data"

  anas_authentik:
    container_name: ${CONTAINER_PREFIX}authentik
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    restart: unless-stopped
    command: server
    shm_size: 512mb
    depends_on:
      anas_authentik_init:
        condition: service_completed_successfully
    volumes:
      - "${DATA_PATH}/authentik/data:/data"
      # Declarative Application and Provider definitions generated from the
      # generic client registration requests.
      - "./blueprints:/blueprints/anas:ro"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.authentik.entrypoints=https"
      - "traefik.http.routers.authentik.rule=Host(`${AUTHENTIK_DOMAIN}`)"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - traefik
      - authentik
      - db

  anas_authentik_worker:
    container_name: ${CONTAINER_PREFIX}authentik_worker
    image: ghcr.io/goauthentik/server:${AUTHENTIK_IMAGE_TAG}
    restart: unless-stopped
    # Import the ANAS CA before the worker discovers the Samba AD blueprint.
    # authentik deliberately skips LDAP TLS verification when peer_certificate
    # is empty and does not fall back to the OS trust store.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        ak import_certificate \
          --certificate "/certs/$${ANAS_TLS_INTERNAL_CA_NAME}" \
          --name anas-samba-ad-ca
        exec ak worker
    shm_size: 512mb
    user: root
    depends_on:
      anas_authentik_init:
        condition: service_completed_successfully
    volumes:
      - "${DATA_PATH}/authentik/data:/data"
      - "./blueprints:/blueprints/anas:ro"
      - "${ANAS_TLS_CERTS_DIR}:/certs:ro"
    env_file:
      - .env
    dns:
      - ${LOCAL_DNS_SERVER}
    healthcheck:
      test: ["CMD", "ak", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - authentik
      - db

networks:
  authentik:
    name: ${NETWORK_PREFIX}authentik
  db:
    name: $AUTHENTIK_NETWORK_DB
    external: true
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
