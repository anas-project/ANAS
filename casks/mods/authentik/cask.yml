api_version: anas.dev/v1
kind: Cask
name: authentik
version: 2026.5.6
app_version: 2026.5.6
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: authentik
description: Identity provider serving OIDC and SAML with per-application endpoints.
category: identity
status: experimental
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  provides:
    - name: iam
      interfaces:
        - oidc
        - saml
dependencies:
  requires:
    - traefik
    - samba_dc
  requires_one:
    - capability: relational_database
      selected_by: db_type
      providers:
        - postgres
      default: postgres
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: auth
    log_level: warn
    db_name: authentik
    image_tag: 2026.5.6
    db_type: auto
    ldap_enabled: "true"
    ldap_object_uniqueness_field: objectSid
    ldap_password_writeback: "true"
  # Endpoints this cask publishes for its bound consumers. Unlike a portal that
  # serves one endpoint set for the whole deployment, these differ per
  # consumer, which is why the contract is per-binding.
  exports:
    - ANAS_IAM_BINDING_*
    - ANAS_IAM_PORTAL_URL
  # Generic client registration requests published by consumers, translated
  # into blueprints during render_env.
  consumes:
    - ANAS_IDENTITY_OIDC_CLIENTS
    - ANAS_IDENTITY_SAML_CLIENTS
    - ANAS_IAM_CLIENT_*
    - APPS_LIST*
    - POSTGRES_PASSWORD
    - MARIADB_PASSWORD
    - SAMBA_DC_LDAPS_SERVER_URL_PORT
    - SAMBA_DC_PASSWORD_BIND_DN
    - SAMBA_DC_PASSWORD_BIND_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-authentik-database
      description: Existing authentik data must be migrated explicitly.
    domain_prefix:
      effect: reconcile
      apply: reconcile-authentik-domain
      description: Every per-application endpoint is derived from this domain, so clients must be reconciled with it.
    ldap_object_uniqueness_field:
      effect: reconcile
      apply: reconcile-authentik-ldap-source
      description: Changing the LDAP identity key requires an explicit duplicate-account audit.
features:
  generated_secrets: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
