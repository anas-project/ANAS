services:
  anas_ddns-updater:
    image: ghcr.io/qdm12/ddns-updater:2.10.0
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    restart: unless-stopped
    dns:
      - ${DDNS_DNS_SERVER}
    env_file:
      - .env
    environment:
      - CONFIG=${DDNS_CONFIG}
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=http
      - PUBLICIP_HTTP_PROVIDERS=ifconfig,ipinfo
      - HTTP_TIMEOUT=10s
      - DATADIR=/updater/data
      - RESOLVER_ADDRESS=${DDNS_DNS_SERVER}:53

      # Web UI
      - SERVER_ENABLED=yes
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/
      - HEALTH_SERVER_ADDRESS=127.0.0.1:9999

      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data

      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=short
      - SHOUTRRR_ADDRESSES=

    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.ddns.entrypoints=https"
      - "traefik.http.routers.ddns.rule=Host(`${DDNS_DOMAIN}`)"
      - "traefik.http.routers.ddns.tls=true"
      - "traefik.http.services.ddns.loadbalancer.server.port=8000"

networks:
  default:
    external: true
    name: ${NETWORK_PREFIX}traefik
