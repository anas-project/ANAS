api_version: anas.dev/v1
kind: Cask
name: ddns
version: 0.0.0
abi:
  supports:
    - anas.cask/v1
title: DDNS
description: Dynamic DNS updater for the base domain and wildcard host.
category: network
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
config:
  required:
    - global.dns_provider
  defaults:
    domain_prefix: ddns
  # DNS provider credentials from the user secrets section.
  consumes:
    - DNSPOD_API_KEY
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
