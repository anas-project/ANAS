api_version: anas.dev/v1
kind: Cask
name: keycloak
version: 23.0.6-0
abi:
  supports:
    - anas.cask/v1
title: Keycloak
description: Alternative identity and portal cask based on the LLNG integration assets.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - samba_dc
  requires_one:
    - capability: relational_database
      selected_by: db_type
      providers:
        - postgres
        - mariadb
      default: postgres
config:
  defaults:
    domain_prefix: auth
    realm: master
    manager_domain_prefix: auth-manager
    test_domain_prefix: auth-test
    log_level: warn
    db_name: keycloak
    enable_test: "true"
    adminer_enabled: "false"
    db_type: auto
  # Mirrors the LLNG integration assets: SAML SP registrations, OIDC RP
  # clients, and the app launcher published by application casks, and
  # connects to its resolved database backend with that backend's real
  # password.
  consumes:
    - SMAL_SP_*
    - OIDC_RP_*
    - APPS_LIST*
    - POSTGRES_PASSWORD
    - MARIADB_PASSWORD
  changes:
    password:
      effect: credential_rotate
      apply: rotate-keycloak-admin-password
      sensitive: true
      description: The bootstrap password does not update an existing Keycloak administrator.
    db_type:
      effect: data_migrate
      apply: migrate-keycloak-database
      description: Existing Keycloak data must be migrated explicitly.
    domain_prefix:
      effect: reconcile
      apply: reconcile-keycloak-domain
      description: Issuer, redirect URIs, and proxy routes must change together.
features:
  sso_provider: true
  generated_secrets: true
services:
  optional:
    - name: KEYCLOAK_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
