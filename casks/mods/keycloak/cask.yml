api_version: anas.dev/v1
kind: Cask
name: keycloak
version: 23.0.6-0
abi:
  supports:
    - anas.cask/v1
title: Keycloak
description: Alternative identity and portal cask based on the LLNG integration assets.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - core
  after:
    - traefik
    - postgres
    - mariadb
config:
  defaults:
    domain_prefix: auth
    realm: master
    manager_domain_prefix: auth-manager
    test_domain_prefix: auth-test
    log_level: warn
    db_name: keycloak
    enable_test: "true"
    adminer_enabled: "false"
features:
  sso_provider: true
  generated_secrets: true
services:
  optional:
    - name: KEYCLOAK_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
