version: "3.5"

services:
  anas_keycloak:
    container_name: ${CONTAINER_PREFIX}keycloak
    image: ${IMAGE_PREFIX}keycloak:latest
    build: ./keycloak
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_PASSWORD}
      KC_DB: ${KEYCLOAK_DB_TYPE}
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST}
      KC_DB_URL_PORT: ${KEYCLOAK_DB_PORT}
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_DOMAIN}
      KC_HOSTNAME_PORT: ${TRAEFIK_BASE_PORT}
    labels:
      - "traefik.enable=true"
      - "anas.traefik.instance=${NETWORK_PREFIX}traefik"
      - "traefik.http.routers.keycloak.entrypoints=https"
      - "traefik.http.routers.keycloak.rule=Host(`${KEYCLOAK_DOMAIN}`)"
      - "traefik.http.routers.keycloak.tls=true"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
    networks:
      - traefik
      - db

networks:
  db:
    name: ${KEYCLOAK_NETWORK_DB}
    external: true
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
