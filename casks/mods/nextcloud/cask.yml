api_version: anas.dev/v1
kind: Cask
name: nextcloud
version: 34.0.2
revision: 1
app_version: 34.0.2
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: Nextcloud
description: File sync, sharing, office integration, memories, and Talk.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - eturnal
    - samba_dc
  requires_capabilities:
    # Only SAML is declared: this cask configures the user_saml app and has no
    # OIDC path, and declaring a protocol it cannot actually serve is exactly
    # the gap between "manifest claims" and "deployment works" that this model
    # exists to close.
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - saml
        prefer:
          - saml
  requires_one:
    - capability: relational_database
      selected_by: db_type
      providers:
        - postgres
        - mariadb
      default: postgres
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: nc
    db_name: nextcloud
    phone_region: CN
    rm_skeleton_files: "false"
    log_level: "2"
    memory_limit: 1G
    upload_max_size: 16G
    debug: "false"
    talk_enabled: "true"
    memories_enabled: "true"
    db_type: auto
    iam_protocol: auto
  # Generic SAML SP registration, app-launcher metadata, and Talk service
  # settings published for the selected IAM and the bundled Talk containers.
  exports:
    - ANAS_IAM_CLIENT__NEXTCLOUD__*
    - APPS_LIST*
    - TALK_*
  # This cask's own IAM binding plus the resolved database backend's real
  # connection password. No IAM-implementation variable is read.
  consumes:
    - ANAS_IAM_BINDING__NEXTCLOUD__*
    - ANAS_IAM_PORTAL_URL
    - COLLABORA_DOMAIN_FULL
    - COLLABORA_HOSTNAME
    - POSTGRES_PASSWORD
    - MARIADB_PASSWORD
    - TURN_SECRET
    # Directory credentials owned by samba_dc: the LDAP agent bind password
    # configured through occ, and the administrator password this cask reuses
    # for its own initial admin. Both are sensitive, so they only cross the
    # cask boundary through an explicit claim.
    - SAMBA_DC_PASSWORD_BIND_PASSWORD
    - SAMBA_DC_ADMIN_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: Changing the environment does not migrate an installed Nextcloud database.
    db_name:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: The database name is materialized during installation.
    admin_password:
      effect: credential_rotate
      apply: rotate-nextcloud-admin-password
      sensitive: true
      description: maintenance:install does not update an existing administrator password.
    domain_prefix:
      effect: reconcile
      apply: reconcile-nextcloud-domain
      description: Trusted domains, SSO metadata, and proxy routes must be updated together.
    upload_max_size:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    memory_limit:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    talk_enabled:
      effect: container_recreate
      apply: recreate-nextcloud-project
      description: The optional Compose service set changes.
    memories_enabled:
      effect: reconcile
      apply: reconcile-nextcloud-apps
      description: The app can be enabled or disabled through occ without restarting the container.
identity:
  interfaces:
    - ldaps
  application_group: true
features:
  generated_secrets: true
  domain: true
services:
  optional:
    - name: talk
      enabled_by: talk_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
