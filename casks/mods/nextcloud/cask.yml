api_version: anas.dev/v1
kind: Cask
name: nextcloud
version: 30.0.1
app_version: 30.0.1
abi:
  supports:
    - anas.cask/v1
title: Nextcloud
description: File sync, sharing, office integration, memories, and Talk.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - eturnal
    - samba_dc
  requires_one:
    - capability: relational_database
      selected_by: db_type
      providers:
        - postgres
        - mariadb
      default: postgres
config:
  defaults:
    domain_prefix: nc
    db_name: nextcloud
    phone_region: CN
    rm_skeleton_files: "false"
    log_level: "2"
    memory_limit: 1G
    upload_max_size: 16G
    debug: "false"
    talk_enabled: "true"
    memories_enabled: "true"
    db_type: auto
  # SAML SP registration, app-launcher metadata, and Talk service settings
  # published for the IAM portal and the bundled Talk containers.
  exports:
    - SMAL_SP_*
    - APPS_LIST*
    - TALK_*
  # SAML IdP endpoints and signing material read by the container init
  # scripts when LLNG is deployed (absent keys simply disable the SP setup),
  # and the resolved database backend's real connection password.
  consumes:
    - LLNG_DOMAIN
    - LLNG_SAML_*
    - POSTGRES_PASSWORD
    - MARIADB_PASSWORD
  changes:
    db_type:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: Changing the environment does not migrate an installed Nextcloud database.
    db_name:
      effect: data_migrate
      apply: migrate-nextcloud-database
      description: The database name is materialized during installation.
    admin_password:
      effect: credential_rotate
      apply: rotate-nextcloud-admin-password
      sensitive: true
      description: maintenance:install does not update an existing administrator password.
    domain_prefix:
      effect: reconcile
      apply: reconcile-nextcloud-domain
      description: Trusted domains, SSO metadata, and proxy routes must be updated together.
    upload_max_size:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    memory_limit:
      effect: container_recreate
      apply: recreate-nextcloud
      description: The limit is injected into the container environment.
    talk_enabled:
      effect: container_recreate
      apply: recreate-nextcloud-project
      description: The optional Compose service set changes.
    memories_enabled:
      effect: reconcile
      apply: reconcile-nextcloud-apps
      description: The app can be enabled or disabled through occ without restarting the container.
features:
  ldap_client: true
  sso_client: true
  generated_secrets: true
  domain: true
services:
  optional:
    - name: talk
      enabled_by: talk_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
