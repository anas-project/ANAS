api_version: anas.dev/v1
kind: Cask
name: eturnal
version: 1.12.2
app_version: 1.12.2
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: Eturnal TURN
description: TURN service used by realtime communication modules.
category: communication
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  env_prefix: TURN
  defaults:
    port: "3478"
    domain_prefix: turn
features:
  generated_secrets: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
