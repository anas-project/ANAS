services:
  anas_eturnal:
    image: ${IMAGE_PREFIX}${MODULE_NAME}:latest
    build:
      context: ./eturnal
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        GHCR_REGISTRY: ${GHCR_REGISTRY:-ghcr.io}
    container_name: ${CONTAINER_PREFIX}eturnal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    tmpfs:
      - /run/anas:mode=0700,uid=9000,gid=9000,size=1m
