services:
  anas_eturnal:
    image: ghcr.io/processone/eturnal:1.12.2
    container_name: ${CONTAINER_PREFIX}eturnal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    ports:
      - "${TURN_PORT}:${TURN_PORT}/tcp"
      - "${TURN_PORT}:${TURN_PORT}/udp"
      - "${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}:${TURN_RELAY_MIN_PORT}-${TURN_RELAY_MAX_PORT}/udp"
    restart: unless-stopped
    networks:
      - traefik
    env_file:
      - .env
    volumes:
      - "./eturnal/eturnal.yml:/etc/eturnal.yml:ro"

networks:
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
