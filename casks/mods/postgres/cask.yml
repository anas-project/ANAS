api_version: anas.dev/v1
kind: Cask
name: postgres
version: 15.3.0
abi:
  supports:
    - anas.cask/v1
title: PostgreSQL
description: PostgreSQL database service with optional Adminer UI.
category: database
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - core
  after:
    - traefik
config:
  defaults:
    username: postgres
    adminer_enabled: "false"
services:
  optional:
    - name: postgres_adminer
      enabled_by: adminer_enabled
logic:
  hook:
    command:
      - go
      - run
      - ./hook
