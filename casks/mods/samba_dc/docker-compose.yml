services:
  anas_samba_dc:
    container_name: ${CONTAINER_PREFIX}${MODULE_NAME}
    build: 
      context: ./${MODULE_NAME}
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        - CHINESE_SPEEDUP
        - APT_MIRROR_URL
        - DOCKER_HUB_REGISTRY
    image: ${IMAGE_PREFIX}${MODULE_NAME}:26.04.2
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/anas-identity-schema.ready && test -f /run/anas-zone.ready && test -f /run/anas-structure.ready && pgrep -x named >/dev/null && samba-tool domain level show >/dev/null && samba-tool user show \"$$SAMBA_DC_ADMIN_NAME\" >/dev/null && nc -z 127.0.0.1 53 && nc -z 127.0.0.1 88 && nc -z 127.0.0.1 389 && nc -z 127.0.0.1 636 && host \"$$SAMBA_DC_DC_DOMAIN\" 127.0.0.1 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 90s
    volumes:
      - "${LEGO_CERTS_PATH}:/certs:ro"
      - "${DATA_PATH}/samba_dc/var:/var/lib/samba"
      - "${SAMBA_DC_AUDIT_PATH}:/var/log/samba-audit"

  # Docker creates a bind-mount source as root, and the anchor worker runs
  # unprivileged, so the journal directory has to be handed over before it
  # starts. Same shape as the authentik data init.
  anas_samba_dc_events_init:
    container_name: ${CONTAINER_PREFIX}samba_dc_events_init
    image: ${DOCKER_HUB_REGISTRY:-docker.io}/library/ubuntu:resolute
    user: root
    entrypoint: ["/bin/sh", "-c"]
    # 0755: subscribers run as their own application's user and only ever read.
    # The journal carries DNs and changed attribute names, never values, so a
    # readable path costs nothing that LDAP itself does not already expose.
    command: ["mkdir -p /events && chown 65534:65534 /events && chmod 0755 /events"]
    restart: "no"
    volumes:
      - "${SAMBA_DC_EVENTS_PATH}:/events"

  anas_samba_dc_anchor:
    container_name: ${CONTAINER_PREFIX}samba_dc_anchor
    build:
      context: ./anchor_worker
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        - CHINESE_SPEEDUP
        - APT_MIRROR_URL
        - DOCKER_HUB_REGISTRY
    image: ${IMAGE_PREFIX}samba_dc_anchor:26.04.2
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      anas_samba_dc:
        condition: service_healthy
      anas_samba_dc_events_init:
        condition: service_completed_successfully
    dns:
      - ${LOCAL_DNS_SERVER}
    environment:
      ANCHOR_LDAP_URL: ${SAMBA_DC_LDAPS_SERVER_URL_PORT}
      ANCHOR_BIND_DN: ${SAMBA_DC_ANCHOR_BIND_DN}
      ANCHOR_BIND_PASSWORD: ${SAMBA_DC_ANCHOR_BIND_PASSWORD}
      ANCHOR_USER_BASES: ${SAMBA_DC_ANCHOR_USER_BASES}
      ANCHOR_GROUP_BASES: ${SAMBA_DC_ANCHOR_GROUP_BASES}
      ANCHOR_BINARY_ATTRIBUTE: ${SAMBA_DC_IDENTITY_ANCHOR_BINARY_ATTRIBUTE}
      ANCHOR_ATTRIBUTE: ${SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE}
      ANCHOR_SCAN_INTERVAL: ${SAMBA_DC_ANCHOR_SCAN_INTERVAL}
      ANCHOR_AUDIT_FILE: ${SAMBA_DC_ANCHOR_AUDIT_FILE}
      ANCHOR_EVENT_FILE: ${SAMBA_DC_ANCHOR_EVENT_FILE}
      ANCHOR_EVENT_ATTRIBUTES: ${SAMBA_DC_ANCHOR_EVENT_ATTRIBUTES}
      # The domain controller presents whichever certificate lego published, so
      # the worker verifies against the bundle rather than one issuer's chain.
      ANCHOR_TLS_CACERT: /certs/${ANAS_TLS_TRUST_BUNDLE_NAME}
      ANCHOR_HEALTH_FILE: /run/anchor-worker/health.json
    volumes:
      # Samba's own log stays read-only here; the normalized journal the worker
      # publishes lives in its own directory so this container never has write
      # access to the domain controller's audit trail.
      - "${SAMBA_DC_AUDIT_PATH}:/var/log/samba-audit:ro"
      - "${SAMBA_DC_EVENTS_PATH}:/var/lib/anas-directory-events"
      - "${LEGO_CERTS_PATH}:/certs:ro"
    tmpfs:
      - /run/anchor-worker:uid=65534,gid=65534,mode=0750
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python3", "/app/anchor_worker.py", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
