api_version: anas.dev/v1
kind: Cask
name: samba_dc
version: 24.04.0
abi:
  supports:
    - anas.cask/v1
title: Samba domain controller
description: Active Directory compatible domain controller and LDAP source.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - lego
    - bind
config:
  defaults:
    app_filter: "true"
    create_structure: "true"
    admin_name: admin
    template_shell: /bin/false
    template_homedir: /home/%D/%U
    user_complex_pass: "true"
    user_max_pass_age: "90"
    user_min_pass_age: "1"
    user_min_pass_length: "8"
    user_password_history: "4"
    user_lockout_threshold: "10"
    user_lockout_duration: "30"
    user_lockout_reset_after: "30"
    ldap_bind_name: svc_ldap
    password_bind_name: svc_password
    log_level: "1"
features:
  ldap_provider: true
  kerberos_env: true
  special_files:
    - samba_dc/root/root/.ssh/authorized_keys
logic:
  hook:
    command:
      - go
      - run
      - ./hook
