api_version: anas.dev/v1
kind: Cask
name: collabora
version: 23.05.0-2
abi:
  supports:
    - anas.cask/v1
title: Collabora Online
description: Online document editing backend for Nextcloud.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - traefik
config:
  defaults:
    domain_prefix: collabora
    log_level: warning
    interface: default
    auto_save: "60"
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
