api_version: anas.dev/v1
kind: Cask
name: collabora
version: 23.05.0-2
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: Collabora Online
description: Online document editing backend for Nextcloud.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - nextcloud
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: collabora
    log_level: warning
    interface: default
    auto_save: "60"
  changes:
    domain_prefix:
      effect: container_recreate
      apply: recreate-collabora
      description: The proxy route and Collabora hostname change.
    log_level:
      effect: container_recreate
      apply: recreate-collabora
      description: The value is injected into the container environment.
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
