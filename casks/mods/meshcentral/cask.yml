api_version: anas.dev/v1
kind: Cask
name: meshcentral
version: 1.1.5
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: MeshCentral
description: Remote device management service using LDAP authentication.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - mariadb
    - samba_dc
config:
  defaults:
    domain_prefix: meshcentral
    mps_port: "4433"
  # The container connects to MariaDB and binds to LDAP with these real
  # credentials directly (config.json.erb).
  consumes:
    - MYSQL_PASSWORD
    - SAMBA_DC_LDAP_BIND_PASSWORD
features:
  ldap_client: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
