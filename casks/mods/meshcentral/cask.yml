api_version: anas.dev/v1
kind: Cask
name: meshcentral
version: 1.2.5
app_version: 1.2.4
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: MeshCentral
description: Remote device management service using LDAP authentication.
category: app
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - mariadb
    - samba_dc
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: meshcentral
    mps_port: "4433"
  # The container connects to MariaDB and binds to LDAP with these real
  # credentials directly. Its entrypoint derives config.json in /run/anas.
  consumes:
    - MYSQL_HOST
    - MYSQL_PORT
    - MYSQL_USERNAME
    - SAMBA_DC_ADMIN_GROUP_DN
    - SAMBA_DC_ADMIN_NAME
    - SAMBA_DC_APP_ALL_DN
    - SAMBA_DC_APP_FILTER
    - SAMBA_DC_BASE_APP_DN
    - SAMBA_DC_BASE_GROUPS_ROLE_DN
    - SAMBA_DC_BASE_USERS_DN
    - SAMBA_DC_GROUP_CLASS_FILTER
    - SAMBA_DC_IDENTITY_ANCHOR_ATTRIBUTE
    - SAMBA_DC_LDAPS_SERVER_URL_PORT
    - SAMBA_DC_LDAP_BIND_DN
    - SAMBA_DC_USER_CLASS_FILTER
    - SAMBA_DC_USER_DISPLAY_NAME
    - SAMBA_DC_USER_EMAIL
    - SAMBA_DC_USER_ENABLED_FILTER
    - SAMBA_DC_USER_LOGIN_ATTRS
    - TRAEFIK_BASE_PORT
    - TRAEFIK_DOMAIN
    - TRAEFIK_DOMAIN_FULL
    - TRAEFIK_HOSTNAME
    - MYSQL_PASSWORD
    - SAMBA_DC_LDAP_BIND_PASSWORD
identity:
  interfaces:
    - ldaps
  application_group: true
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
