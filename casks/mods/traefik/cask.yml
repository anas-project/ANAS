api_version: anas.dev/v1
kind: Cask
name: traefik
version: 2.5.1
abi:
  supports:
    - anas.cask/v1
title: Traefik reverse proxy
description: HTTPS reverse proxy and dashboard for all web-facing services.
category: network
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - lego
config:
  defaults:
    base_port: "9000"
    domain_prefix: traefik
features:
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
