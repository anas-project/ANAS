api_version: anas.dev/v1
kind: Cask
name: oauth2_proxy
version: 7.15.3
revision: 1
app_version: 7.15.3
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: OAuth2 Proxy
description: Authenticated gate in front of services that have no login of their own.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
capabilities:
  # The exchange Traefik speaks to an external authenticator: ask about each
  # request, forward it only on a 2xx.
  provides:
    - name: forward_auth
      interfaces:
        - http
dependencies:
  requires:
    - traefik
  # It gates access using the deployment's own accounts rather than a second
  # user database, so it is an ordinary OIDC client of whichever IAM is
  # selected. Group membership is enforced by the IAM through the existing
  # ANAS_IAM_CLIENT__*__ALLOW_GROUPS contract, so no group logic lives here.
  requires_capabilities:
    - name: iam
      interface_selected_by: iam_protocol
      interfaces:
        any_of:
          - oidc
        prefer:
          - oidc
upgrade:
  # Empty, not absent: no release of this cask has rewritten its on-disk data
  # format. Absent would mean "unknown" and would block every rollback that
  # changes the version. See docs/contracts/snapshot.md.
  data_breaking: []
config:
  defaults:
    domain_prefix: auth-gate
    iam_protocol: auto
    # Only members of these groups may pass the gate. The default is the
    # administrator group because the services behind this gate are
    # administrative interfaces.
    allow_groups: Admins
  # The middleware name protected casks attach to their routers, and the URL
  # of the gate itself.
  exports:
    - ANAS_FORWARD_AUTH_*
    - ANAS_IAM_CLIENT__OAUTH2_PROXY__*
  consumes:
    - ANAS_IAM_BINDING_*
    - SAMBA_DC_ADMIN_GROUP_NAME
    # The issuer-neutral certificate contract: the identity provider presents
    # an internally issued certificate on a domain that cannot obtain a public
    # one, and this cask has to trust it to complete OIDC discovery.
    - ANAS_TLS_CERTS_DIR
    - ANAS_TLS_INTERNAL_CA_NAME
features:
  domain: true
  generated_secrets: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
