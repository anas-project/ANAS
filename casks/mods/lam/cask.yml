api_version: anas.dev/v1
kind: Cask
name: lam
version: 7.8.0
abi:
  supports:
    - anas.cask/v1
    - anas.cask/v2
title: LDAP Account Manager
description: Web UI for LDAP account administration.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  requires:
    - traefik
    - samba_dc
config:
  defaults:
    domain_prefix: lam
  changes:
    admin_password:
      effect: container_recreate
      apply: recreate-lam
      sensitive: true
      description: LAM configuration is generated when the container starts.
    domain_prefix:
      effect: container_recreate
      apply: recreate-lam
      description: The proxy route is generated from the domain.
features:
  ldap_client: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
