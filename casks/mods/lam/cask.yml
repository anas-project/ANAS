api_version: anas.dev/v1
kind: Cask
name: lam
version: 7.8.0
abi:
  supports:
    - anas.cask/v1
title: LDAP Account Manager
description: Web UI for LDAP account administration.
category: identity
runtime:
  type: compose
  compose_file: docker-compose.yml
dependencies:
  before:
    - traefik
  after:
    - samba_dc
config:
  defaults:
    domain_prefix: lam
features:
  ldap_client: true
  domain: true
logic:
  hook:
    command:
      - go
      - run
      - ./hook
