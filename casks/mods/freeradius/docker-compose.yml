services:
  anas_freeradius:
    container_name: ${CONTAINER_PREFIX}freeradius
    image: ${DOCKER_HUB_REGISTRY:-docker.io}/freeradius/freeradius-server:3.2.10
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "freeradius", "-XC"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    driver: bridge
    name: ${NETWORK_PREFIX}freeradius
