version: "3.5"

services:
  anas_eturnal:
    build: ./eturnal
    image: ${IMAGE_PREFIX}eturnal:latest
    container_name: ${CONTAINER_PREFIX}eturnal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
    ports:
      - ${TURN_PORT}:${TURN_PORT}/tcp
      - ${TURN_PORT}:${TURN_PORT}/udp
    restart: unless-stopped
    networks:
      - traefik
    env_file:
      - .env

networks:
  traefik:
    name: ${NETWORK_PREFIX}traefik
    external: true
